<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="810.0" y="350.0">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="900.0" y="350.0">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="480.0" y="177.0">ENI</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#495057" font-weight="normal"><tspan x="480" y="218.8">EKS-managed</tspan><tspan x="480" y="231.2">ENI</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="105.0" y="349.4">kubectl</tspan><tspan x="105.0" y="365.6">(you)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="457.5">users</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="300.0" y="449.4">Application</tspan><tspan x="300.0" y="465.6">Load Balancer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#e8590c" font-weight="bold"><tspan x="300" y="405.0">user traffic → ALB → nodes (never via the control plane)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="730" y="470.0">spreading nodes across AZs = high availability</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="730" y="500.0">EKS Distro (EKS-D) = the same K8s build, run anywhere yourself</tspan></text>
