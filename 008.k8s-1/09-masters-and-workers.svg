<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="380" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="140" width="125" height="85" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="540" y="140" width="125" height="85" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="550" y="95" width="105" height="36" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="185" y="140" width="125" height="85" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="685" y="140" width="125" height="85" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="695" y="95" width="105" height="36" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="140" width="125" height="85" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="830" y="140" width="125" height="85" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="840" y="95" width="105" height="36" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M40,245 L40,255 L445,255 L445,245" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M540,245 L540,255 L945,255 L945,245" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Masters run the control plane, workers run your apps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="102.5" y="174.4">master 1</tspan><tspan x="102.5" y="190.6">(control plane)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="602.5" y="182.5">worker 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="602.5" y="113.0">user apps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="247.5" y="174.4">master 2</tspan><tspan x="247.5" y="190.6">(control plane)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="747.5" y="182.5">worker 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="747.5" y="113.0">user apps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="392.5" y="174.4">master 3</tspan><tspan x="392.5" y="190.6">(control plane)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="892.5" y="182.5">worker 3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="892.5" y="113.0">user apps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="240" y="110.0">⊘  no user apps here</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="242" y="275.0">3 or 5 masters (odd number) for high availability</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="742" y="275.0">as many workers as your apps need</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="330.0">spread masters across different data centers / availability zones — if one dies, the cluster keeps working</tspan></text>
</g>
</svg>