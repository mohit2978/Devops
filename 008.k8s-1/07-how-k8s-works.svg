<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">What happens after  kubectl apply -f pod.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="110.0" y="128.0">kubectl</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="360.0" y="128.0">API Server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="635.0" y="128.0">etcd</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="635.0" y="253.0">Scheduler</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="130.0" y="253.0">Controller Manager</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="485" y="348.0">chosen worker node</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="320.0" y="404.0">kubelet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="485.0" y="404.0">runtime</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="652" y="382.0">Pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="652.5" y="417.0">container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#ffffff" font-weight="bold"><tspan x="225" y="110.0">1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#ffffff" font-weight="bold"><tspan x="500" y="110.0">2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#ffffff" font-weight="bold"><tspan x="515" y="185.0">3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#ffffff" font-weight="bold"><tspan x="310" y="260.0">4</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#ffffff" font-weight="bold"><tspan x="572" y="380.0">5</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#ffffff" font-weight="bold"><tspan x="248" y="195.0">6</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="770" y="98.5">1  kubectl sends the request</tspan><tspan x="770" y="113.5">   to the API server</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="770" y="144.5">2  API server validates it and</tspan><tspan x="770" y="159.5">   stores it in etcd (pending)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="770" y="191.0">3  Scheduler sees the pending pod</tspan><tspan x="770" y="206.0">   and picks a node with enough</tspan><tspan x="770" y="221.0">   CPU / RAM (info from kubelets)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="770" y="252.5">4  API server hands the pod to</tspan><tspan x="770" y="267.5">   that node&#x27;s kubelet</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="770" y="299.0">5  kubelet tells the runtime to</tspan><tspan x="770" y="314.0">   pull the image &amp; start the</tspan><tspan x="770" y="329.0">   container inside the pod</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="770" y="361.0">6  Controller Manager keeps</tspan><tspan x="770" y="376.0">   checking desired = actual and</tspan><tspan x="770" y="391.0">   recreates pods that die</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="505.0">kube-proxy (on every node) then sets up the network rules so traffic can reach the new pod</tspan></text>
</g>
</svg>