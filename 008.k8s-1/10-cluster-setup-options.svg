<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="25" y="80" width="300" height="130" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="25" y="225" width="300" height="80" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="350" y="80" width="300" height="130" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="350" y="225" width="300" height="80" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="675" y="80" width="300" height="130" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="675" y="225" width="300" height="80" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M70,340 L930,340" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M918.3,345.7 L930,340 L918.3,334.3" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">3 ways to get a Kubernetes cluster</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="175.0" y="127.5">Minikube</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="149.2">single-node cluster on</tspan><tspan x="175.0" y="166.8">your laptop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="256.9">practice only —</tspan><tspan x="175.0" y="273.1">never say this in an interview</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="127.5">kubeadm</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="149.2">self-managed cluster</tspan><tspan x="500.0" y="166.8">on your own VMs</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="256.9">YOU handle everything:</tspan><tspan x="500.0" y="273.1">upgrades, HA, failures</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="825.0" y="127.5">Managed (cloud)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="825.0" y="149.2">EKS (AWS) • AKS (Azure)</tspan><tspan x="825.0" y="166.8">GKE (Google) • DOKS • LKE</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="825.0" y="256.9">provider runs the control plane</tspan><tspan x="825.0" y="273.1">(billable) — used by most companies</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="362.0">less work for you, more responsibility on the provider  →</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="388.0">in these notes we use AWS EKS</tspan></text>
</g>
</svg>