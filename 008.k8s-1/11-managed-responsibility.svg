<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="440" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="960" height="150" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<rect x="330" y="110" width="130" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="480" y="110" width="130" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="630" y="110" width="130" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M20,245 L980,245" fill="none" stroke="#1e1e1e" stroke-width="3"/>
<rect x="20" y="265" width="960" height="150" rx="16" fill="#fff9db" stroke="#e8590c" stroke-width="2"/>
<rect x="330" y="300" width="130" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="480" y="300" width="130" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="630" y="300" width="130" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Managed Kubernetes — who is responsible for what?</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold"><tspan x="40" y="98.0">managed by the CLOUD PROVIDER</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="395.0" y="145.0">master 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="545.0" y="145.0">master 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="695.0" y="145.0">master 3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="160" y="142.5">☐ control plane upgrades</tspan><tspan x="160" y="160.0">☐ performance</tspan><tspan x="160" y="177.5">☐ availability</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="700" y="200.0">control plane (API server, etcd, scheduler …)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#e8590c" font-weight="bold"><tspan x="40" y="288.0">managed by YOU</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="395.0" y="335.0">worker 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="545.0" y="335.0">worker 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="695.0" y="335.0">worker 3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="160" y="332.5">☐ worker nodes</tspan><tspan x="160" y="350.0">☐ your applications</tspan><tspan x="160" y="367.5">☐ paying the bill</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="700" y="395.0">your pods run here</tspan></text>
</g>
</svg>