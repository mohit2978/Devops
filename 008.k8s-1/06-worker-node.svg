<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="440" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="960" height="320" rx="16" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="120" width="280" height="105" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="255" width="280" height="105" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="380" y="120" width="180" height="110" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="388" y="150" width="164" height="23" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="575" y="120" width="180" height="110" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="583" y="150" width="164" height="23" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="583" y="178" width="164" height="23" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="770" y="120" width="180" height="110" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="778" y="150" width="164" height="23" rx="5" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="380" y="270" width="570" height="90" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M325,172 L380,172" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M368.3,177.7 L380,172 L368.3,166.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Worker node components — where your apps actually run</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500" y="95.0">Worker node  (a VM / EC2 instance / physical server)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="185.0" y="150.0">kubelet  (node agent)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="185.0" y="167.9">talks to the API server, starts /</tspan><tspan x="185.0" y="182.9">stops pods, reports node &amp; pod</tspan><tspan x="185.0" y="197.9">health back to the control plane</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="185.0" y="285.0">kube-proxy</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="185.0" y="302.9">keeps network rules (iptables /</tspan><tspan x="185.0" y="317.9">IPVS) so Services can reach</tspan><tspan x="185.0" y="332.9">the right pods</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="470.0" y="136.0">Pod  IP 10.244.1.5</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="470.0" y="161.5">order-service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="665.0" y="136.0">Pod  IP 10.244.1.6</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="665.0" y="161.5">payment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="665.0" y="189.5">log-sidecar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="860.0" y="136.0">Pod  IP 10.244.1.7</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="860.0" y="161.5">user-service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="665.0" y="300.0">container runtime</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="665.0" y="317.9">containerd / CRI-O (Docker until K8s 1.24): pulls images,</tspan><tspan x="665.0" y="332.9">creates and stops the containers inside pods</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#495057" font-weight="normal"><tspan x="352" y="160.0">manages</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="420.0">every node runs kubelet + kube-proxy + a runtime  •  a pod gets its own IP and holds 1+ containers</tspan></text>
</g>
</svg>