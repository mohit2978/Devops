<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="380" y="70" width="240" height="46" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M500,116 L500,170" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M494.3,158.3 L500,170 L505.7,158.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="370" y="170" width="260" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="700" y="180" width="270" height="95" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M630,215 L700,215" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M688.3,220.7 L700,215 L688.3,209.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M641.7,209.3 L630,215 L641.7,220.7" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="90" width="280" height="105" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M310,160 L370,205" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M357.2,202.5 L370,205 L364.0,193.5" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M322.8,162.5 L310,160 L316.0,171.5" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="30" y="280" width="280" height="105" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M310,320 L370,250" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M366.7,262.6 L370,250 L358.1,255.2" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M313.3,307.4 L310,320 L321.9,314.8" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="370" y="330" width="260" height="80" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M500,280 L500,330" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M494.3,318.3 L500,330 L505.7,318.3" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M505.7,291.7 L500,280 L494.3,291.7" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Control plane components — the brain of the cluster</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="93.0">kubectl / UI</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="200.6">API Server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="220.5">front door of the cluster:</tspan><tspan x="500.0" y="236.7">validates every request;</tspan><tspan x="500.0" y="253.0">all components talk ONLY to it</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="835.0" y="211.2">etcd</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="835.0" y="231.1">key-value database: the cluster&#x27;s</tspan><tspan x="835.0" y="247.3">desired + current state</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="665" y="200.0">read/write</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="170.0" y="118.1">Scheduler</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="170.0" y="137.9">finds pods with no node yet →</tspan><tspan x="170.0" y="154.2">picks the best node (CPU, RAM,</tspan><tspan x="170.0" y="170.4">affinity rules)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="170.0" y="308.1">Controller Manager</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="170.0" y="327.9">control loops: compares DESIRED</tspan><tspan x="170.0" y="344.2">vs CURRENT state and fixes drift</tspan><tspan x="170.0" y="360.4">(recreate pods, node failures)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="362.5">worker nodes&#x27; kubelets</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="379.8">report status, receive pod specs</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="445.0">only the API server talks to etcd • production clusters run 3 or 5 control-plane nodes for high availability</tspan></text>
</g>
</svg>