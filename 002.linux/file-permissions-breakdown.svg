<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- User Section Gradient (Amber / Orange) -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(249, 115, 22, 0.18)"/>
      <stop offset="100%" stop-color="rgba(249, 115, 22, 0.04)"/>
    </linearGradient>
    <linearGradient id="userBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Group Section Gradient (Emerald / Green) -->
    <linearGradient id="groupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.18)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.04)"/>
    </linearGradient>
    <linearGradient id="groupBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Others Section Gradient (Rose / Pink) -->
    <linearGradient id="othersGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.18)"/>
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.04)"/>
    </linearGradient>
    <linearGradient id="othersBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Shadows & Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="940" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(0, 30)">
    <text class="font-sans" x="470" y="10" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">LINUX FILE PERMISSION ARCHITECTURE</text>
    <text class="font-mono" x="470" y="46" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="4">
      <tspan fill="#f97316">r w - </tspan>
      <tspan fill="#10b981">r - - </tspan>
      <tspan fill="#ec4899">r - -</tspan>
    </text>
    <text class="font-sans" x="470" y="74" text-anchor="middle" fill="#64748b" font-size="13">9-Character Mode String &amp; Octal Value Breakdown</text>
  </g>

  <!-- ==================== USER CARD ==================== -->
  <g transform="translate(45, 135)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="260" height="240" rx="14" fill="url(#userGrad)" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
    
    <!-- Header Pill -->
    <rect x="30" y="-14" width="200" height="28" rx="14" fill="url(#userBadge)"/>
    <text class="font-sans" x="130" y="5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">USER / OWNER (u)</text>

    <!-- Permission Chunk Display -->
    <g transform="translate(130, 55)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1" stroke-opacity="0.5"/>
      <text class="font-mono" x="0" y="8" text-anchor="middle" fill="#f97316" font-size="22" font-weight="700" letter-spacing="6">rw-</text>
    </g>

    <!-- Calculation Details -->
    <g transform="translate(30, 102)" class="font-mono" font-size="12">
      <text x="0" y="16" fill="#94a3b8">r (Read)    : <tspan fill="#f97316" font-weight="700">4</tspan></text>
      <text x="0" y="38" fill="#94a3b8">w (Write)   : <tspan fill="#f97316" font-weight="700">2</tspan></text>
      <text x="0" y="60" fill="#94a3b8">- (Execute) : <tspan fill="#64748b">0</tspan></text>
      <line x1="0" y1="72" x2="200" y2="72" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="0" y="94" fill="#cbd5e1" font-size="13">Sum: 4 + 2 + 0 =</text>
    </g>

    <!-- Numeric Result Pill -->
    <g transform="translate(205, 196)">
      <circle cx="0" cy="0" r="22" fill="#f97316"/>
      <text class="font-mono" x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">6</text>
    </g>
  </g>

  <!-- ==================== GROUP CARD ==================== -->
  <g transform="translate(340, 135)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="260" height="240" rx="14" fill="url(#groupGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
    
    <!-- Header Pill -->
    <rect x="30" y="-14" width="200" height="28" rx="14" fill="url(#groupBadge)"/>
    <text class="font-sans" x="130" y="5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">GROUP (g)</text>

    <!-- Permission Chunk Display -->
    <g transform="translate(130, 55)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
      <text class="font-mono" x="0" y="8" text-anchor="middle" fill="#10b981" font-size="22" font-weight="700" letter-spacing="6">r--</text>
    </g>

    <!-- Calculation Details -->
    <g transform="translate(30, 102)" class="font-mono" font-size="12">
      <text x="0" y="16" fill="#94a3b8">r (Read)    : <tspan fill="#10b981" font-weight="700">4</tspan></text>
      <text x="0" y="38" fill="#94a3b8">- (Write)   : <tspan fill="#64748b">0</tspan></text>
      <text x="0" y="60" fill="#94a3b8">- (Execute) : <tspan fill="#64748b">0</tspan></text>
      <line x1="0" y1="72" x2="200" y2="72" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="0" y="94" fill="#cbd5e1" font-size="13">Sum: 4 + 0 + 0 =</text>
    </g>

    <!-- Numeric Result Pill -->
    <g transform="translate(205, 196)">
      <circle cx="0" cy="0" r="22" fill="#10b981"/>
      <text class="font-mono" x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">4</text>
    </g>
  </g>

  <!-- ==================== OTHERS CARD ==================== -->
  <g transform="translate(635, 135)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="260" height="240" rx="14" fill="url(#othersGrad)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)"/>
    
    <!-- Header Pill -->
    <rect x="30" y="-14" width="200" height="28" rx="14" fill="url(#othersBadge)"/>
    <text class="font-sans" x="130" y="5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">OTHERS (o)</text>

    <!-- Permission Chunk Display -->
    <g transform="translate(130, 55)">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5"/>
      <text class="font-mono" x="0" y="8" text-anchor="middle" fill="#ec4899" font-size="22" font-weight="700" letter-spacing="6">r--</text>
    </g>

    <!-- Calculation Details -->
    <g transform="translate(30, 102)" class="font-mono" font-size="12">
      <text x="0" y="16" fill="#94a3b8">r (Read)    : <tspan fill="#ec4899" font-weight="700">4</tspan></text>
      <text x="0" y="38" fill="#94a3b8">- (Write)   : <tspan fill="#64748b">0</tspan></text>
      <text x="0" y="60" fill="#94a3b8">- (Execute) : <tspan fill="#64748b">0</tspan></text>
      <line x1="0" y1="72" x2="200" y2="72" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="0" y="94" fill="#cbd5e1" font-size="13">Sum: 4 + 0 + 0 =</text>
    </g>

    <!-- Numeric Result Pill -->
    <g transform="translate(205, 196)">
      <circle cx="0" cy="0" r="22" fill="#ec4899"/>
      <text class="font-mono" x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">4</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g transform="translate(45, 400)">
    <rect x="0" y="0" width="850" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <text class="font-sans" x="25" y="32" fill="#94a3b8" font-size="13" font-weight="500">
      Default Linux File Permission:
    </text>
    
    <g transform="translate(235, 32)">
      <text class="font-mono" x="0" y="0" font-size="20" font-weight="800">
        <tspan fill="#f97316">6</tspan>
        <tspan fill="#10b981">4</tspan>
        <tspan fill="#ec4899">4</tspan>
      </text>
    </g>

    <text class="font-sans" x="300" y="32" fill="#64748b" font-size="12">
      (User: <tspan fill="#f97316" font-weight="600">rw-</tspan> | Group: <tspan fill="#10b981" font-weight="600">r--</tspan> | Others: <tspan fill="#ec4899" font-weight="600">r--</tspan>)
    </text>
    
    <rect x="725" y="12" width="105" height="28" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text class="font-mono" x="777" y="30" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">chmod 644</text>
  </g>
</svg>
