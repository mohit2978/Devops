<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="460" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="105" width="130" height="34" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="40" y="148" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="40" y="186" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="40" y="224" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="40" y="262" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="185" y="105" width="130" height="34" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="185" y="148" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="185" y="186" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="185" y="224" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="105" width="130" height="34" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="148" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="186" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="224" width="130" height="32" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="150" width="130" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="525" y="262" width="100" height="34" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="655" y="150" width="130" height="50" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="262" width="100" height="34" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="800" y="150" width="130" height="50" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="815" y="262" width="100" height="34" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="370" width="940" height="70" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">chmod — two ways to say the same thing</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold"><tspan x="250" y="85.0">SYMBOLIC:  who  op  permission</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="105.0" y="122.0">who</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="105.0" y="164.0">u user</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="105.0" y="202.0">g group</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="105.0" y="240.0">o others</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="105.0" y="278.0">a all</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="250.0" y="122.0">op</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="250.0" y="164.0">+ add</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="250.0" y="202.0">- remove</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="250.0" y="240.0">= set exactly</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="395.0" y="122.0">perm</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="395.0" y="164.0">r read</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="395.0" y="202.0">w write</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="395.0" y="240.0">x execute</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="250" y="302.5">chmod u+x deploy.sh</tspan><tspan x="250" y="320.0">chmod g-w,o-rwx secret.txt</tspan><tspan x="250" y="337.5">chmod a=r notes.txt</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#6741d9" font-weight="bold"><tspan x="720" y="85.0">OCTAL:  r=4  w=2  x=1  → add per group</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="720" y="128.0">chmod 754 deploy.sh</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="575.0" y="175.0">7</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="575" y="222.0">user</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="575" y="247.0">4+2+1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="normal"><tspan x="575.0" y="279.0">rwx</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="720.0" y="175.0">5</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="720" y="222.0">group</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="720" y="247.0">4+0+1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="normal"><tspan x="720.0" y="279.0">r-x</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="865.0" y="175.0">4</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="865" y="222.0">others</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="865" y="247.0">4+0+0</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="normal"><tspan x="865.0" y="279.0">r--</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="720" y="330.0">result:  -rwxr-xr--</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="396.2">common:  644 files (rw-r--r--) • 755 scripts &amp; folders (rwxr-xr-x) • 600 / 400 private keys</tspan><tspan x="500.0" y="413.8">777 = everyone can do everything → avoid on servers</tspan></text>
</g>
</svg>