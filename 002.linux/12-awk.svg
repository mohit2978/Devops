<rect x="455" y="80" width="110" height="30" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="70" y="120" width="510" height="32" rx="6" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<rect x="70" y="160" width="510" height="32" rx="6" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<rect x="70" y="200" width="510" height="32" rx="6" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<rect x="610" y="82" width="370" height="44" rx="8" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="134" width="370" height="44" rx="8" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="186" width="370" height="44" rx="8" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="238" width="370" height="44" rx="8" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="290" width="370" height="44" rx="8" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="342" width="370" height="44" rx="8" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">awk — work with columns (fields)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="40" y="95.0">NR</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="130.0" y="95.0">$1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="250.0" y="95.0">$2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="380.0" y="95.0">$3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="510.0" y="95.0">$4</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="40" y="135.0">1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="130" y="136.0">101</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="250" y="136.0">John</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="380" y="136.0">python</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="510" y="136.0">85</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="40" y="175.0">2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="130" y="176.0">102</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="250" y="176.0">Alice</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="380" y="176.0">java</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="510" y="176.0">90</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="40" y="215.0">3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="130" y="216.0">103</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="250" y="216.0">Bob</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="380" y="216.0">python</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="510" y="216.0">78</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="325" y="260.0">$0 = whole line • NF = number of fields (4) • NR = line number</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="325" y="285.0">fields split on spaces by default; -F &#x27;,&#x27; or -F &#x27;:&#x27; to change</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="97.0">awk &#x27;{print $2, $3}&#x27; f</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="115.0">→ John python / Alice java / Bob python</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="149.0">awk &#x27;/python/&#x27; f</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="167.0">→ lines 101 and 103</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="201.0">awk &#x27;$4 &gt; 80 {print $2}&#x27; f</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="219.0">→ John, Alice</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="253.0">awk &#x27;{sum += $4} END {print sum}&#x27; f</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="271.0">→ 253</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="305.0">awk &#x27;END {print NR}&#x27; f</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="323.0">→ 3  (line count)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="357.0">awk -F &#x27;:&#x27; &#x27;{print $1}&#x27; /etc/passwd</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="622" y="375.0">→ all user names</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="420.0">pattern {action}: no pattern → every line • no action → print the line • BEGIN / END run once</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="448.0">grep finds lines • sed edits lines • awk slices lines into columns and calculates</tspan></text>
</g>
</svg>