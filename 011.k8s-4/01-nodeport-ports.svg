<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="170" width="130" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="200" y="80" width="780" height="260" rx="16" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="230" y="160" width="160" height="90" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="450" y="160" width="170" height="90" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="680" y="135" width="270" height="140" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="705" y="175" width="220" height="80" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M150,205 L230,205" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M218.3,210.7 L230,205 L218.3,199.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M390,205 L450,205" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M438.3,210.7 L450,205 L438.3,199.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M620,205 L705,215" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M692.7,219.2 L705,215 L694.0,208.0" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">NodePort service — nodePort, port, targetPort</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="85.0" y="205.0">browser</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="590" y="100.0">worker node  (public IP 13.233.x.x)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="310.0" y="182.5">nodePort</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="310.0" y="199.8">30070</tspan><tspan x="310.0" y="214.8">on EVERY node</tspan><tspan x="310.0" y="229.8">(30000–32767)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="535.0" y="182.5">Service port</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="535.0" y="199.8">80</tspan><tspan x="535.0" y="214.8">ClusterIP:80 inside</tspan><tspan x="535.0" y="229.8">the cluster</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="815" y="155.0">Pod  app=javawebapp</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="815.0" y="208.1">targetPort = containerPort</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="815.0" y="223.5">8080 (Tomcat listens here)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="370.0">http://&lt;node-public-ip&gt;:30070/java-web-app   →  nodePort 30070 → service 80 → container 8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="400.0">port = the Service&#x27;s own port • targetPort = the container port • nodePort = opened on the nodes</tspan></text>
</g>
</svg>