<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="75" width="940" height="250" rx="18" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<rect x="70" y="120" width="640" height="185" rx="16" fill="#fff9db" stroke="#e8590c" stroke-width="2"/>
<rect x="110" y="165" width="360" height="120" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">The 3 Service types build on each other</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#e8590c" font-weight="bold"><tspan x="60" y="100.0">LoadBalancer = NodePort + a cloud load balancer</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#e67700" font-weight="bold"><tspan x="95" y="143.0">NodePort = ClusterIP + a port (30000–32767) on every node</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold"><tspan x="290" y="190.0">ClusterIP</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="290" y="226.9">stable internal IP + DNS</tspan><tspan x="290" y="243.1">inside the cluster only</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="590" y="221.9">+ reachable at</tspan><tspan x="590" y="238.1">nodeIP:30080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="840" y="193.8">+ public DNS,</tspan><tspan x="840" y="210.0">spreads traffic</tspan><tspan x="840" y="226.2">across all nodes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="355.0">type: ClusterIP (default)  →  type: NodePort  →  type: LoadBalancer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="383.0">internal services → ClusterIP • quick test → NodePort • public app → LoadBalancer / Ingress</tspan></text>
</g>
</svg>