<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="470" height="300" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="60" y="125" width="180" height="100" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M240,175 L290,175" fill="none" stroke="#e03131" stroke-width="2"/>
<path d="M278.3,180.7 L290,175 L278.3,169.3" fill="none" stroke="#e03131" stroke-width="2"/>
<rect x="290" y="125" width="180" height="100" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="75" width="470" height="300" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="545" y="125" width="170" height="90" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="780" y="125" width="170" height="90" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="745" cy="290" rx="120" ry="40" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M630,215 L700,255" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M687.0,254.1 L700,255 L692.6,244.3" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M865,215 L790,255" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M797.7,244.5 L790,255 L803.0,254.5" fill="none" stroke="#e8590c" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Stateless vs stateful containers — why the DB data disappeared</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="255" y="98.0">✗ data stored INSIDE the container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="150.0" y="160.0">mysqldb</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="150.0" y="176.6">orders table:</tspan><tspan x="150.0" y="191.6">120 rows</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#e03131" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="265" y="160.0">down</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="380.0" y="160.0">new mysqldb</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="380.0" y="176.6">orders table:</tspan><tspan x="380.0" y="191.6">0 rows ✗</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="normal"><tspan x="255" y="271.9">container&#x27;s writable layer is deleted with</tspan><tspan x="255" y="288.1">the container → stateless by default</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="745" y="98.0">✓ data in a named VOLUME</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="630.0" y="155.0">mysqldb</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="630.0" y="171.6">writes to</tspan><tspan x="630.0" y="186.6">/var/lib/mysql</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="865.0" y="156.2">new mysqldb</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="865.0" y="172.2">same volume</tspan><tspan x="865.0" y="186.0">mounted → 120 rows ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="745" y="282.5">volume dbdata</tspan><tspan x="745" y="297.5">(/var/lib/docker/volumes)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="410.0">stateless = data dies with the container • stateful = data lives in a volume outside it</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="440.0">volumes: - /data/mysql (just a path) creates an ANONYMOUS volume — use name:path, e.g. dbdata:/var/lib/mysql</tspan></text>
</g>
</svg>