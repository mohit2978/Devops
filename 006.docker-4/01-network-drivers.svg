<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="80" width="305" height="155" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="345" y="80" width="305" height="155" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="80" width="305" height="155" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="255" width="305" height="155" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="345" y="255" width="305" height="155" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="255" width="305" height="155" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker network drivers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="172.5" y="127.5">bridge (default)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="172.5" y="145.4">private network inside the host;</tspan><tspan x="172.5" y="160.4">each container gets its own IP</tspan><tspan x="172.5" y="175.4">(172.17.x.x / 172.18.x.x);</tspan><tspan x="172.5" y="190.4">reach it from outside with -p</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="497.5" y="135.0">host</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="497.5" y="152.9">container shares the HOST&#x27;s</tspan><tspan x="497.5" y="167.9">network — no own IP, no -p</tspan><tspan x="497.5" y="182.9">needed; app port = host port</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="822.5" y="142.5">none</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="822.5" y="160.4">no network at all —</tspan><tspan x="822.5" y="175.4">fully isolated container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="172.5" y="317.5">overlay</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="172.5" y="335.4">one network spanning MANY</tspan><tspan x="172.5" y="350.4">hosts (Docker Swarm)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="497.5" y="310.0">macvlan</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="497.5" y="327.9">container gets its own MAC +</tspan><tspan x="497.5" y="342.9">IP on the physical LAN,</tspan><tspan x="497.5" y="357.9">looks like a real machine</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="822.5" y="295.0">built-in on every install</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="822.5" y="312.2">docker network ls →</tspan><tspan x="822.5" y="327.2">bridge • host • none</tspan><tspan x="822.5" y="342.2"></tspan><tspan x="822.5" y="357.2">overlay / macvlan: created</tspan><tspan x="822.5" y="372.2">when needed</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="445.0">in real projects Kubernetes handles container networking — these matter for plain Docker / Compose</tspan></text>
</g>
</svg>