<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="520" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="75" width="470" height="400" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="75" width="410" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="150" width="410" height="70" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="330" width="410" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="415" width="410" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">docker-compose.yml — the 4 sections</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#adb5bd" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="99.0">version: &quot;3&quot;            # optional in Compose v2</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="121.0">services:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="143.0">  application:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="165.0">    image: spring-boot-mysql-app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="187.0">    ports: [&quot;8080:8080&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="209.0">    networks: [springboot-db-net]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="231.0">    depends_on: [mysqldb]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="253.0">  mysqldb:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="275.0">    image: mysql:5.7</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="297.0">    environment:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="319.0">      MYSQL_ROOT_PASSWORD: root</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="341.0">      MYSQL_DATABASE: sbms</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="363.0">    volumes: [dbdata:/var/lib/mysql]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#74c0fc" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="385.0">networks:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#74c0fc" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="407.0">  springboot-db-net:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="429.0">volumes:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="451.0">  dbdata:</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="765.0" y="95.0">version</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="112.2">compose file format (old field;</tspan><tspan x="765.0" y="127.2">newer Docker ignores it)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="765.0" y="170.0">services</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="187.2">one entry per CONTAINER:</tspan><tspan x="765.0" y="202.2">image, ports, env, depends_on…</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="765.0" y="350.0">networks</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="367.2">networks the services join;</tspan><tspan x="765.0" y="382.2">services reach each other by name</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="765.0" y="435.0">volumes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="452.2">named storage that survives</tspan><tspan x="765.0" y="467.2">container deletion</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="500.0">the default file name is docker-compose.yml (or compose.yaml); another name → docker-compose -f &lt;file&gt; up</tspan></text>
</g>
</svg>