<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="440" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="90" width="230" height="180" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="300" y="80" width="360" height="240" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="320" y="120" width="150" height="45" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="490" y="120" width="150" height="45" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="320" y="180" width="150" height="45" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="490" y="180" width="150" height="45" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="320" y="240" width="150" height="45" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="700" y="120" width="270" height="160" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M660,200 L700,200" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M688.3,205.7 L700,200 L688.3,194.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Why Docker Compose? Many microservices = many containers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="145.0" y="142.5">monolith (earlier)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="145.0" y="159.8">ONE app with hotels,</tspan><tspan x="145.0" y="174.8">flights, trains, cabs</tspan><tspan x="145.0" y="189.8">inside</tspan><tspan x="145.0" y="204.8"></tspan><tspan x="145.0" y="219.8">→ one container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="480" y="100.0">microservices: one container per API</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="395.0" y="142.5">hotels-api</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="565.0" y="142.5">flights-api</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="395.0" y="202.5">trains-api</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="565.0" y="202.5">cabs-api</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="395.0" y="262.5">mysql-db</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e03131" font-weight="bold"><tspan x="480" y="305.0">create / start / stop each one by hand ✗</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="835.0" y="170.0">Docker Compose</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="835.0" y="187.2">ONE docker-compose.yml</tspan><tspan x="835.0" y="202.2">ONE command:</tspan><tspan x="835.0" y="217.2">docker-compose up -d</tspan><tspan x="835.0" y="232.2">→ all containers + network</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="375.0">Docker Compose = manage multi-container applications with a single file and single commands</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="405.0">for ONE machine (dev / testing) • production across many machines → Kubernetes</tspan></text>
</g>
</svg>