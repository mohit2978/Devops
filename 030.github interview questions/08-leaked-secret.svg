<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="440" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="25" y="90" width="220" height="150" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="270" y="90" width="220" height="150" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M245,165 L270,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M258.3,170.7 L270,165 L258.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="515" y="90" width="220" height="150" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M490,165 L515,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M503.3,170.7 L515,165 L503.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="760" y="90" width="220" height="150" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M735,165 L760,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M748.3,170.7 L760,165 L748.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="25" y="280" width="460" height="60" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="515" y="280" width="460" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">A secret was pushed to GitHub — incident response</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="135.0" y="132.5">① ROTATE IT NOW</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="135.0" y="151.0">revoke the key in</tspan><tspan x="135.0" y="167.3">AWS / Vault / IAM</tspan><tspan x="135.0" y="183.5">(bots scan GitHub</tspan><tspan x="135.0" y="199.8">in seconds)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="380.0" y="140.6">② rewrite history</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="380.0" y="159.2">git-filter-repo</tspan><tspan x="380.0" y="175.4">--path secrets.env</tspan><tspan x="380.0" y="191.7">--invert-paths</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="625.0" y="132.5">③ force-push</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="625.0" y="151.0">git push --force --all</tspan><tspan x="625.0" y="167.3">git push --force --tags</tspan><tspan x="625.0" y="183.5">(tell the team to</tspan><tspan x="625.0" y="199.8">re-clone)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="870.0" y="140.6">④ purge caches</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="870.0" y="159.2">ask GitHub Support to</tspan><tspan x="870.0" y="175.4">remove cached views,</tspan><tspan x="870.0" y="191.7">check forks &amp; PR refs</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="301.2">✗ git rm secrets.env + commit is NOT enough —</tspan><tspan x="255.0" y="318.8">the secret still lives in older commits</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="745.0" y="301.2">prevent it: .gitignore, pre-commit secret scanners,</tspan><tspan x="745.0" y="318.8">GitHub secret scanning + push protection</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="500" y="380.0">step ① comes FIRST: once pushed, assume the secret is already stolen</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="410.0">git filter-branch is deprecated → use git-filter-repo (or BFG Repo-Cleaner)</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.8;0.81;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M135,250 L380,250 L625,250 L870,250" keyPoints="0;0;1;1" keyTimes="0;0.05;0.8;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><rect x="-14.0" y="-13" width="28" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">●</text></g>
</svg>