<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="200" cy="160" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="340" cy="160" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M314,160 L229,160" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M240.7,154.3 L229,160 L240.7,165.7" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="30" y="290" width="300" height="140" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="350" y="290" width="300" height="140" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="290" width="300" height="140" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">git reset &lt;commit&gt; — move the branch BACK</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="200" y="160.0">C1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="340" y="160.0">C2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="180.0" y="333.8">--soft</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="180.0" y="353.6">changes of C3, C4 are</tspan><tspan x="180.0" y="371.1">STAGED — ready to</tspan><tspan x="180.0" y="388.6">commit again</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="342.5">--mixed  (default)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="362.3">changes kept in the</tspan><tspan x="500.0" y="379.8">working dir, UNSTAGED</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="820.0" y="333.8">--hard  ⚠</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="353.6">changes DELETED</tspan><tspan x="820.0" y="371.1">from your files —</tspan><tspan x="820.0" y="388.6">gone for good</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="470.0">--hard + already pushed? you&#x27;d need git push -f — dangerous on shared branches (use git revert instead)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="498.0">delete last n commits:  git reset --hard &lt;commit&gt;  (or git rebase -i &lt;commit&gt;)  →  git push -f origin master</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;1;0.2;0.2" keyTimes="0;0.3;0.32;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="480" cy="160" rx="26" ry="26" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><ellipse cx="620" cy="160" rx="26" ry="26" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><path d="M454,160 L369,160" fill="none" stroke="#495057" stroke-width="2"/><path d="M380.7,154.3 L369,160 L380.7,165.7" fill="none" stroke="#495057" stroke-width="2"/><path d="M594,160 L509,160" fill="none" stroke="#495057" stroke-width="2"/><path d="M520.7,154.3 L509,160 L520.7,165.7" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="480" y="160.0">C3</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="620" y="160.0">C4</tspan></text></g></g>
<g ><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.32;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="678.0" y="145" width="76" height="30" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/><path d="M678.0,160 L650.0,160" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M661.7,154.3 L650.0,160 L661.7,165.7" fill="none" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="716.0" y="160.0">main</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="302.0" y="75" width="76" height="30" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/><path d="M340,105 L340,134" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M334.3,122.3 L340,134 L345.7,122.3" fill="none" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="340" y="90.0">main</tspan></text></g></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.52;0.54;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M550,190 L180,285" keyPoints="0;0;1;1" keyTimes="0;0.35;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-70.0" y="-13" width="140" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">C3+C4 changes</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.52;0.54;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M550,190 L500,285" keyPoints="0;0;1;1" keyTimes="0;0.35;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-70.0" y="-13" width="140" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">C3+C4 changes</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.52;0.54;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M550,190 L820,285" keyPoints="0;0;1;1" keyTimes="0;0.35;0.5;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-70.0" y="-13" width="140" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">C3+C4 changes</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.3;0.32;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="245.0">main → C4</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="245.0">git reset C2   → main jumps back; C3, C4 leave the history</tspan></text></g></g>
</svg>