<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Main Branch Gradient (Blue) -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Feature Branch Gradient (Purple) -->
    <linearGradient id="featGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Merge Commit Gradient (Emerald) -->
    <linearGradient id="mergeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Rebase Commit Gradient (Amber) -->
    <linearGradient id="rebaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="cShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1020" height="650" rx="16" fill="url(#bgGit)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 22)">
    <text class="sans" x="510" y="18" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">GIT BRANCH INTEGRATION STRATEGIES</text>
    <text class="sans" x="510" y="48" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Git Merge vs Git Rebase: Architectural Deep Dive</text>
    <text class="sans" x="510" y="70" text-anchor="middle" fill="#94a3b8" font-size="12.5">Non-Linear Historical Record vs Linear Rewritten Commit History</text>
  </g>

  <!-- ================= 1. INITIAL STATE ================= -->
  <g transform="translate(40, 105)">
    <rect width="940" height="115" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#cShadow)"/>
    <rect x="25" y="-12" width="220" height="24" rx="12" fill="#334155"/>
    <text class="sans" x="135" y="4" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">INITIAL STATE (Diverged)</text>

    <!-- Main Branch Line -->
    <line x1="70" y1="42" x2="480" y2="42" stroke="#38bdf8" stroke-width="3"/>
    <!-- Feature Branch Line -->
    <path d="M 210 42 L 280 82 L 530 82" stroke="#c084fc" stroke-width="3" fill="none"/>

    <!-- Commits Main -->
    <!-- C1 -->
    <circle cx="90" cy="42" r="14" fill="url(#mainGrad)"/>
    <text class="mono" x="90" y="46" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">C1</text>
    <!-- C2 (Fork Point) -->
    <circle cx="210" cy="42" r="14" fill="url(#mainGrad)"/>
    <text class="mono" x="210" y="46" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">C2</text>
    <!-- C3 -->
    <circle cx="430" cy="42" r="14" fill="url(#mainGrad)"/>
    <text class="mono" x="430" y="46" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">C3</text>
    <rect x="460" y="30" width="55" height="24" rx="4" fill="#0369a1"/>
    <text class="mono" x="487" y="46" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">main</text>

    <!-- Commits Feature -->
    <!-- F1 -->
    <circle cx="330" cy="82" r="14" fill="url(#featGrad)"/>
    <text class="mono" x="330" y="86" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">F1</text>
    <!-- F2 -->
    <circle cx="450" cy="82" r="14" fill="url(#featGrad)"/>
    <text class="mono" x="450" y="86" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">F2</text>
    <rect x="480" y="70" width="65" height="24" rx="4" fill="#7e22ce"/>
    <text class="mono" x="512" y="86" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">feature</text>

    <!-- Explanation Note (Safely Padded) -->
    <g transform="translate(630, 22)" class="sans" font-size="11">
      <text x="0" y="16" fill="#f8fafc" font-weight="700">Branching Scenario:</text>
      <text x="0" y="36" fill="#94a3b8">• Feature branched from C2</text>
      <text x="0" y="54" fill="#94a3b8">• Main moved ahead with C3</text>
      <text x="0" y="72" fill="#94a3b8">• Need to integrate changes</text>
    </g>
  </g>

  <!-- ================= 2. MERGE COMPARISON CARD ================= -->
  <g transform="translate(40, 245)">
    <rect width="455" height="270" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cShadow)"/>
    <rect x="25" y="-12" width="220" height="24" rx="12" fill="url(#mergeGrad)"/>
    <text class="sans" x="135" y="4" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">METHOD 1: GIT MERGE (3-Way)</text>

    <!-- Graph Representation -->
    <g transform="translate(20, 22)">
      <!-- Main Line -->
      <line x1="25" y1="35" x2="350" y2="35" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Feature Line & Merge Curve -->
      <path d="M 85 35 L 135 70 L 235 70 L 295 35" stroke="#c084fc" stroke-width="2" fill="none"/>

      <!-- Commits -->
      <circle cx="35" cy="35" r="11" fill="url(#mainGrad)"/>
      <text class="mono" x="35" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">C2</text>

      <circle cx="135" cy="70" r="11" fill="url(#featGrad)"/>
      <text class="mono" x="135" y="74" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">F1</text>

      <circle cx="215" cy="70" r="11" fill="url(#featGrad)"/>
      <text class="mono" x="215" y="74" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">F2</text>

      <circle cx="185" cy="35" r="11" fill="url(#mainGrad)"/>
      <text class="mono" x="185" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">C3</text>

      <!-- Merge Commit M -->
      <circle cx="295" cy="35" r="14" fill="url(#mergeGrad)"/>
      <text class="mono" x="295" y="39" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">M</text>
      
      <rect x="325" y="23" width="55" height="24" rx="4" fill="#047857"/>
      <text class="mono" x="352" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">main</text>
    </g>

    <!-- Properties (Carefully wrapped to avoid overflow) -->
    <g transform="translate(20, 125)" class="sans" font-size="11">
      <text x="0" y="14" fill="#34d399" font-weight="700">Architectural Characteristics:</text>
      
      <text x="0" y="34" fill="#f8fafc">• Creates new <tspan fill="#34d399" font-weight="700">Merge Commit (M)</tspan></text>
      <text x="12" y="49" fill="#94a3b8">Preserves 2 parent pointers (C3 &amp; F2)</text>

      <text x="0" y="71" fill="#f8fafc">• Preserves commit SHAs</text>
      <text x="12" y="86" fill="#94a3b8">Retains exact historical record &amp; timestamps</text>

      <text x="0" y="108" fill="#f8fafc">• 100% safe on public branches</text>
      <text x="12" y="123" fill="#94a3b8">Non-destructive; no force push needed</text>
    </g>
  </g>

  <!-- ================= 3. REBASE COMPARISON CARD ================= -->
  <g transform="translate(525, 245)">
    <rect width="455" height="270" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cShadow)"/>
    <rect x="25" y="-12" width="220" height="24" rx="12" fill="url(#rebaseGrad)"/>
    <text class="sans" x="135" y="4" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">METHOD 2: GIT REBASE (Replay)</text>

    <!-- Graph Representation -->
    <g transform="translate(20, 22)">
      <!-- Single Linear Line -->
      <line x1="20" y1="35" x2="350" y2="35" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Commits -->
      <circle cx="35" cy="35" r="11" fill="url(#mainGrad)"/>
      <text class="mono" x="35" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">C2</text>

      <circle cx="105" cy="35" r="11" fill="url(#mainGrad)"/>
      <text class="mono" x="105" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">C3</text>

      <!-- Replayed Commits (F1', F2') -->
      <circle cx="185" cy="35" r="13" fill="url(#rebaseGrad)"/>
      <text class="mono" x="185" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">F1'</text>

      <circle cx="265" cy="35" r="13" fill="url(#rebaseGrad)"/>
      <text class="mono" x="265" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">F2'</text>

      <rect x="295" y="23" width="65" height="24" rx="4" fill="#b45309"/>
      <text class="mono" x="327" y="39" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">feature</text>

      <text class="sans" x="110" y="74" fill="#64748b" font-size="10">Base moved from C2 to C3</text>
    </g>

    <!-- Properties (Carefully wrapped to avoid overflow) -->
    <g transform="translate(20, 125)" class="sans" font-size="11">
      <text x="0" y="14" fill="#fbbf24" font-weight="700">Architectural Characteristics:</text>
      
      <text x="0" y="34" fill="#f8fafc">• Replays commits one-by-one</text>
      <text x="12" y="49" fill="#94a3b8">Generates <tspan fill="#fbbf24" font-weight="700">brand-new commit SHAs</tspan></text>

      <text x="0" y="71" fill="#f8fafc">• Clean linear history</text>
      <text x="12" y="86" fill="#94a3b8">No noisy merge commits cluttering git log</text>

      <text x="0" y="108" fill="#fca5a5">• Rewrites history!</text>
      <text x="12" y="123" fill="#f87171">Never use on shared/public remote branches</text>
    </g>
  </g>

  <!-- ================= 4. GOLDEN RULE FOOTER BANNER ================= -->
  <g transform="translate(40, 535)">
    <rect width="940" height="92" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    
    <g transform="translate(25, 18)" class="sans">
      <text x="0" y="14" fill="#ef4444" font-size="11" font-weight="800" letter-spacing="1">THE GOLDEN RULE OF REBASING (CRUCIAL SDE-2 PRINCIPLE):</text>
      <text x="0" y="34" fill="#f87171" font-size="11" font-weight="700">"Never rebase commits that exist outside your local repo and that others rely on."</text>
      <text x="0" y="52" fill="#cbd5e1" font-size="10.5">Rebasing rewrites commit hashes. If teammates base work on old SHAs, force-pushing</text>
      <text x="0" y="66" fill="#cbd5e1" font-size="10.5">overwrites their base, resulting in divergent history and severe merge conflicts.</text>
    </g>
  </g>
</svg>
