pace="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e8590c" font-weight="bold"><tspan x="640" y="246.9">S = F1 + F2 + F3</tspan><tspan x="640" y="263.1">squashed into ONE</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="870" y="251.9">✓ 1 clean commit per PR</tspan><tspan x="870" y="268.1">✗ loses small commits</tspan></text></g></g>
