<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">GitHub PR merge buttons — 3 different histories</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="505.0">small PRs → squash • keep every commit → rebase &amp; merge • need the real branch structure → merge commit</tspan></text>
</g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.12;1" dur="4s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="85" width="190" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><ellipse cx="270" cy="115" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><ellipse cx="380" cy="115" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><path d="M354,115 L299,115" fill="none" stroke="#495057" stroke-width="2"/><path d="M310.7,109.3 L299,115 L310.7,120.7" fill="none" stroke="#495057" stroke-width="2"/><ellipse cx="420" cy="173" rx="26" ry="26" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><path d="M396,164 L297,125" fill="none" stroke="#495057" stroke-width="2"/><path d="M310.0,124.0 L297,125 L305.8,134.6" fill="none" stroke="#495057" stroke-width="2"/><ellipse cx="520" cy="173" rx="26" ry="26" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><path d="M494,173 L449,173" fill="none" stroke="#495057" stroke-width="2"/><path d="M460.7,167.3 L449,173 L460.7,178.7" fill="none" stroke="#495057" stroke-width="2"/><ellipse cx="620" cy="173" rx="26" ry="26" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><path d="M594,173 L549,173" fill="none" stroke="#495057" stroke-width="2"/><path d="M560.7,167.3 L549,173 L560.7,178.7" fill="none" stroke="#495057" stroke-width="2"/><ellipse cx="720" cy="115" rx="26" ry="26" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><path d="M694,115 L409,115" fill="none" stroke="#495057" stroke-width="2"/><path d="M420.7,109.3 L409,115 L420.7,120.7" fill="none" stroke="#495057" stroke-width="2"/><path d="M698,128 L645,158" fill="none" stroke="#495057" stroke-width="2"/><path d="M652.4,147.3 L645,158 L658.0,157.2" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="117.5">Create a merge commit</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="115.0" y="134.8">git merge --no-ff</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="270" y="115.0">M1</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="380" y="115.0">M2</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="420" y="173.0">F1</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="520" y="173.0">F2</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="620" y="173.0">F3</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="720" y="115.0">X</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e8590c" font-weight="bold"><tspan x="720" y="75.0">merge commit</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="870" y="111.9">✓ full history + authors</tspan><tspan x="870" y="128.1">✗ noisy log</tspan></text></g></g>
