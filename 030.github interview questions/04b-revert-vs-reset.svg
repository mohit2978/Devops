<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">git revert vs git reset — undoing a bad commit C3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="255" y="105.0">git revert C3   (safe ✓)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="70" y="200.0">C1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="170" y="200.0">C2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="270" y="200.0">C3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="255" y="325.0">history kept → fine for pushed/shared branches</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e03131" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="745" y="105.0">git reset --hard C2   (rewrites ⚠)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="570" y="200.0">C1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="690" y="200.0">C2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="745" y="325.0">C3 erased → only for private, unpushed work</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="380.0">git revert -n &lt;commit&gt; → undo without committing yet   •   git revert --abort → cancel</tspan></text>
</g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.37;0.97;0.99;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="380" cy="200" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><path d="M354,200 L299,200" fill="none" stroke="#495057" stroke-width="2"/><path d="M310.7,194.3 L299,200 L310.7,205.7" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="380" y="200.0">R</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#2f9e44" font-weight="bold"><tspan x="380" y="142.5">new commit that</tspan><tspan x="380" y="157.5">UNDOES C3</tspan></text></g></g>
