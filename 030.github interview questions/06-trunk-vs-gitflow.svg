in, develop, release/*, feature/*, hotfix/* branches</tspan></text><text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="100" y="300.0">main</tspan></text><text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="100" y="345.0">hotfix</tspan></text><text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="100" y="390.0">release</tspan></text><text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="100" y="435.0">develop</tspan></text><text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="100" y="480.0">feature</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="522.0">more control for scheduled releases, but slow feedback and big painful merges</tspan></text></g></g>
