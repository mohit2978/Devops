" fill="none" stroke="#6741d9" stroke-width="2.5"/><path d="M710.3,152.4 L720,161 L720.7,148.0" fill="none" stroke="#6741d9" stroke-width="2.5"/><ellipse cx="675" cy="131" rx="7" ry="7" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><path d="M810,161 Q855,100 900,161" fill="none" stroke="#6741d9" stroke-width="2.5"/><path d="M890.3,152.4 L900,161 L900.7,148.0" fill="none" stroke="#6741d9" stroke-width="2.5"/><ellipse cx="855" cy="131" rx="7" ry="7" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="30" y="92.0">TRUNK-BASED — one main branch, tiny short-lived branches, deploy many times a day</tspan></text><text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="40" y="170.0">main</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="215.0">feature branch lives &lt; 1–2 days → PR + CI → merge  •  unfinished work hidden behind FEATURE FLAGS</tspan></text></g></g>
