<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Git hooks — checks that run automatically</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="175.0">git commit</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="252.0" y="158.8">pre-commit</tspan><tspan x="252.0" y="175.0">lint, format,</tspan><tspan x="252.0" y="191.2">unit tests</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="414.0" y="158.8">commit-msg</tspan><tspan x="414.0" y="175.0">&quot;PROJ-123: …&quot;</tspan><tspan x="414.0" y="191.2">format check</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="576.0" y="175.0">git push</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="738.0" y="158.8">pre-push</tspan><tspan x="738.0" y="175.0">integration</tspan><tspan x="738.0" y="191.2">tests</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="900.0" y="158.8">GitHub CI</tspan><tspan x="900.0" y="175.0">branch protection,</tspan><tspan x="900.0" y="191.2">secret scanning</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e8590c" font-weight="bold"><tspan x="410" y="92.0">client-side: .git/hooks (local — can be skipped with --no-verify)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="900" y="92.0">server-side: can&#x27;t skip</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="340.0">share hooks with the team: Husky / pre-commit → git config core.hooksPath .githooks</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="370.0">real enforcement must live on the server (CI + branch protection), because client hooks are optional</tspan></text>
</g>
