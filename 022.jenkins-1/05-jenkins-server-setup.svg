<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="300" y="85" width="450" height="335" rx="16" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="335" y="128" width="380" height="50" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="335" y="192" width="380" height="58" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="335" y="264" width="380" height="50" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="335" y="328" width="380" height="50" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="247" y="150" width="22" height="190" rx="4" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
<rect x="25" y="190" width="180" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M205,228 L335,222" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M323.6,228.2 L335,222 L323.0,216.9" fill="none" stroke="#1971c2" stroke-width="2"/>
<rect x="25" y="320" width="180" height="60" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M205,352 L335,352" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M323.3,357.7 L335,352 L323.3,346.3" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="775" y="85" width="200" height="335" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Jenkins server setup on AWS EC2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="525" y="108.0">EC2 VM • Ubuntu • t2.medium (2 vCPU, 4 GiB)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="525.0" y="153.0">/var/lib/jenkins  → jobs, workspace, secrets</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="525.0" y="212.2">Jenkins (jenkins.war)</tspan><tspan x="525.0" y="229.8">systemd service • listens on port 8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="525.0" y="289.0">Java 17 (openjdk-17-jre) — Jenkins needs it</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="525.0" y="353.0">Ubuntu OS  (user: ubuntu)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e03131" font-weight="bold"><tspan x="258" y="137.0">SG: 8080 open</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="115.0" y="221.2">browser</tspan><tspan x="115.0" y="238.8">http://public-ip:8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="115.0" y="341.2">MobaXterm</tspan><tspan x="115.0" y="358.8">(SSH, port 22)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="875.0" y="165.0">1. create VM</tspan><tspan x="875.0" y="182.5">2. open port 8080</tspan><tspan x="875.0" y="200.0">3. install Java</tspan><tspan x="875.0" y="217.5">4. install Jenkins</tspan><tspan x="875.0" y="235.0">5. enable + start</tspan><tspan x="875.0" y="252.5">6. check status</tspan><tspan x="875.0" y="270.0">7. open ip:8080</tspan><tspan x="875.0" y="287.5">8. paste initial</tspan><tspan x="875.0" y="305.0">    admin password</tspan><tspan x="875.0" y="322.5">9. install plugins</tspan><tspan x="875.0" y="340.0">10. create admin</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="450.0">Why t2.medium?  Jenkins + Maven builds need RAM — t2.micro (1 GiB) is too small and often freezes</tspan></text>
</g>
</svg>