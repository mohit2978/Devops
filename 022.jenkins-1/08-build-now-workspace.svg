<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="90" width="200" height="70" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="275" y="90" width="200" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M230,125 L275,125" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M263.3,130.7 L275,125 L263.3,119.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="520" y="90" width="200" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M475,125 L520,125" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M508.3,130.7 L520,125 L508.3,119.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="765" y="90" width="200" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M720,125 L765,125" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M753.3,130.7 L765,125 L753.3,119.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="195" width="590" height="240" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="650" y="195" width="320" height="240" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Build Now → build #N → console output → workspace</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="130.0" y="116.2">Build Now</tspan><tspan x="130.0" y="133.8">(click)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="375.0" y="116.2">Build #1, #2, #3…</tspan><tspan x="375.0" y="133.8">(build history)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="620.0" y="116.2">Console Output</tspan><tspan x="620.0" y="133.8">(logs — errors are here)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="865.0" y="116.2">Finished:</tspan><tspan x="865.0" y="133.8">SUCCESS ✓ / FAILURE ✗</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="50" y="253.8">/var/lib/jenkins/                 ← JENKINS_HOME</tspan><tspan x="50" y="271.2">├── jobs/FirstJob/builds/         ← history &amp; logs</tspan><tspan x="50" y="288.8">└── workspace/                    ← jobs run here</tspan><tspan x="50" y="306.2">    ├── FirstJob/</tspan><tspan x="50" y="323.8">    │   └── ashokit.txt</tspan><tspan x="50" y="341.2">    └── Java Web app/</tspan><tspan x="50" y="358.8">        ├── pom.xml   src/</tspan><tspan x="50" y="376.2">        └── target/maven-web-app.war</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="810.0" y="245.0">Why does ashokit.txt grow?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="810.0" y="264.1">“&gt;&gt;” APPENDS a line on every build</tspan><tspan x="810.0" y="281.6"></tspan><tspan x="810.0" y="299.1">build #1 → 1 line</tspan><tspan x="810.0" y="316.6">build #2 → 2 lines</tspan><tspan x="810.0" y="334.1">build #3 → 3 lines</tspan><tspan x="810.0" y="351.6"></tspan><tspan x="810.0" y="369.1">the workspace is reused,</tspan><tspan x="810.0" y="386.6">not wiped between builds</tspan></text>
</g>
</svg>