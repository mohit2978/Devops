<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">What is a Jenkins job?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">JOB = a set of steps we give Jenkins to perform a task</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="150.0" y="116.2">1. take code</tspan><tspan x="150.0" y="133.8">from Git repo</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="385.0" y="116.2">2. Maven</tspan><tspan x="385.0" y="133.8">build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="620.0" y="116.2">3. build Docker</tspan><tspan x="620.0" y="133.8">image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="855.0" y="116.2">4. deploy to</tspan><tspan x="855.0" y="133.8">K8s cluster</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="260.0" y="228.8">FREESTYLE project</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="260.0" y="249.2">create the job through the GUI</tspan><tspan x="260.0" y="266.7">(forms, dropdowns, text boxes)</tspan><tspan x="260.0" y="284.2">good for learning &amp; simple jobs</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="740.0" y="228.8">PIPELINE</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="740.0" y="249.2">job written as a script (Jenkinsfile)</tspan><tspan x="740.0" y="266.7">stored in Git with the code</tspan><tspan x="740.0" y="284.2">← what real projects use</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="500" y="365.0">Tabs on a freestyle job&#x27;s “Configure” page</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="102.5" y="413.0">General</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="102" y="467.5">name,</tspan><tspan x="102" y="482.5">description</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="265.5" y="404.2">Source Code</tspan><tspan x="265.5" y="421.8">Management</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="265" y="475.0">Git repo URL</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="428.5" y="404.2">Build</tspan><tspan x="428.5" y="421.8">Triggers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="428" y="467.5">when to run</tspan><tspan x="428" y="482.5">(later)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="591.5" y="404.2">Build</tspan><tspan x="591.5" y="421.8">Environment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="591" y="467.5">env setup</tspan><tspan x="591" y="482.5">(later)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="754.5" y="404.2">Build</tspan><tspan x="754.5" y="421.8">Steps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="754" y="467.5">shell / Maven</tspan><tspan x="754" y="482.5">commands</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="917.5" y="404.2">Post-build</tspan><tspan x="917.5" y="421.8">Actions</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="917" y="467.5">what to do</tspan><tspan x="917" y="482.5">after build</tspan></text>
</g>
</svg>