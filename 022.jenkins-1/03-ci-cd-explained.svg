<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">CI / CD explained</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">CI/CD = an approach to automate the project build &amp; deployment process</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="87.5" y="170.2">commit</tspan><tspan x="87.5" y="187.8">(GitHub)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="224.5" y="170.2">build</tspan><tspan x="224.5" y="187.8">(Maven)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="361.5" y="179.0">unit tests</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="498.5" y="170.2">code review</tspan><tspan x="498.5" y="187.8">(Sonar)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="635.5" y="170.2">artifact</tspan><tspan x="635.5" y="187.8">(Nexus)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="772.5" y="170.2">deploy to</tspan><tspan x="772.5" y="187.8">QA / staging</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="909.5" y="170.2">deploy to</tspan><tspan x="909.5" y="187.8">production</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1971c2" font-weight="bold"><tspan x="293" y="105.0">CI = Continuous Integration</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#2f9e44" font-weight="bold"><tspan x="772" y="105.0">CD = Continuous Delivery / Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="normal"><tspan x="293" y="231.9">every commit is merged into the shared repo,</tspan><tspan x="293" y="248.1">built &amp; tested automatically → bugs caught early</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="normal"><tspan x="772" y="231.9">the tested artifact is always ready and</tspan><tspan x="772" y="248.1">moves to servers automatically</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold"><tspan x="30" y="318.0">Continuous DELIVERY</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="325.0" y="318.0">staging ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="530.0" y="309.2">manual approval</tspan><tspan x="530.0" y="326.8">(someone clicks)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="735.0" y="318.0">production</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="820" y="309.9">a human decides</tspan><tspan x="820" y="326.1">when to release</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold"><tspan x="30" y="408.0">Continuous DEPLOYMENT</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="325.0" y="408.0">staging ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="normal"><tspan x="530.0" y="396.0">automatic — no human in between</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="735.0" y="408.0">production</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="820" y="399.9">every passing change</tspan><tspan x="820" y="416.1">goes live</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="478.0">Jenkins = a CI/CD server: it runs this pipeline for any project — Java, Python, .NET, React, Angular…</tspan></text>
</g>
</svg>