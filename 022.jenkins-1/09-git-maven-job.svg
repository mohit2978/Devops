<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Job 2:  GitHub + Maven  (freestyle job)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="107.5" y="150.6">GitHub repo</tspan><tspan x="107.5" y="169.4">maven-web-app</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="240.0" y="146.0">git clone</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="240" y="183.1">(git client</tspan><tspan x="240" y="196.9">on server)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="390.0" y="150.0">Jenkins job</tspan><tspan x="390.0" y="170.0">“Java Web app”</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="540.0" y="146.0">clean package</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="675.0" y="150.6">Maven 3.9.9</tspan><tspan x="675.0" y="169.4">(auto-installed)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="905.0" y="141.2">target/</tspan><tspan x="905.0" y="160.0">maven-web-app</tspan><tspan x="905.0" y="178.8">.war</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="257.5" y="298.8">mvn clean package</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="257.5" y="318.6">clean → delete the old target/ folder</tspan><tspan x="257.5" y="336.1">package → compile + run tests + bundle</tspan><tspan x="257.5" y="353.6">→ creates the .war inside target/</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="747.5" y="298.8">Global Tool Configuration</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="747.5" y="318.6">Manage Jenkins → Tools → Add Maven</tspan><tspan x="747.5" y="336.1">☑ Install automatically → Jenkins downloads</tspan><tspan x="747.5" y="353.6">Maven itself (no apt install maven needed)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="500" y="435.0">code has errors → build FAILS ✗     •     code changed → Build Now again → fresh .war from latest code</tspan></text>
</g>
