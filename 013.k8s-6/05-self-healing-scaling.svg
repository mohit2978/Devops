<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="420" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="470" height="270" rx="16" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="50" y="130" width="120" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="190" y="130" width="120" height="60" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<path d="M310,160 L345,160" fill="none" stroke="#2f9e44" stroke-width="2.5"/>
<path d="M333.3,165.7 L345,160 L333.3,154.3" fill="none" stroke="#2f9e44" stroke-width="2.5"/>
<rect x="345" y="130" width="120" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="75" width="470" height="270" rx="16" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="535" y="130" width="95" height="55" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="643" y="130" width="95" height="55" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="751" y="130" width="95" height="55" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="859" y="130" width="95" height="55" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Self-healing and manual scaling</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="255" y="98.0">self-healing (replicas: 2)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="110.0" y="160.0">pod 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="250.0" y="151.9">pod 2 ✗</tspan><tspan x="250.0" y="168.1">deleted</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="405.0" y="151.9">pod 3 ✓</tspan><tspan x="405.0" y="168.1">new</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold"><tspan x="255" y="231.2">ReplicaSet sees 1 ≠ 2</tspan><tspan x="255" y="248.8">→ creates a replacement in seconds</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="255" y="310.0">kubectl delete pod &lt;name&gt;  → watch it come back</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="745" y="98.0">manual scaling</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="582.5" y="157.5">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="690.5" y="157.5">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="798.5" y="149.4">pod</tspan><tspan x="798.5" y="165.6">(new)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="906.5" y="149.4">pod</tspan><tspan x="906.5" y="165.6">(new)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="745" y="225.0">kubectl scale deployment javawebdeploy --replicas 4</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="745" y="260.0">2 → 4 pods (and back with --replicas 3)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="745" y="310.0">fixed number until you change it again</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="385.0">manual scaling needs a human; HPA (below) changes replicas automatically from CPU / memory usage</tspan></text>
</g>
</svg>