<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="130" width="250" height="120" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="360" y="140" width="230" height="100" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M280,190 L360,190" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M348.3,195.7 L360,190 L348.3,184.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="680" y="85" width="160" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
