<path d="M667.8,280.4 L680,285 L676.1,272.6" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">The load test: busybox hammering the ClusterIP service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="155.0" y="169.4">load-generator pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="155.0" y="186.0">busybox, loop:</tspan><tspan x="155.0" y="199.8">wget http://hpa-demo-deployment</tspan><tspan x="155.0" y="213.5">every 0.01 s</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="475.0" y="169.4">Service hpa-demo-deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="475.0" y="184.7">type ClusterIP (default)</tspan><tspan x="475.0" y="198.5">internal only — fine,</tspan><tspan x="475.0" y="212.2">load comes from inside</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="760.0" y="115.0">hpa-demo pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="760.0" y="192.5">hpa-demo pod</tspan><tspan x="760.0" y="207.5">(added by HPA)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="760.0" y="277.5">hpa-demo pod</tspan><tspan x="760.0" y="292.5">(added by HPA)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="910" y="167.5">CPU-heavy</tspan><tspan x="910" y="182.5">PHP page</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="330.0">window 1: run the load-generator  •  window 2: kubectl get hpa -w  (watch TARGETS and REPLICAS change)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="360.0">--rm deletes the busybox pod when you press Ctrl+C → load stops → HPA scales back down</tspan></text>
</g>
</svg>