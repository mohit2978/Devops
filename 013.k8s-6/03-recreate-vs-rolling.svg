<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Deployment strategies: Recreate vs RollingUpdate (v1 → v2)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="17" fill="#e03131" font-weight="bold"><tspan x="30" y="95.0">Recreate</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="70.0" y="155.0">v1</tspan></text>
