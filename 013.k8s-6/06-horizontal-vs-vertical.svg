<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="470" height="250" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<rect x="50" y="150" width="95" height="80" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="158" y="150" width="95" height="80" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="266" y="150" width="95" height="80" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="374" y="150" width="95" height="80" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="75" width="470" height="250" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<rect x="560" y="175" width="90" height="60" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M660,205 L720,205" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M708.3,210.7 L720,205 L708.3,199.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="720" y="125" width="200" height="140" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Horizontal vs vertical scaling</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold"><tspan x="255" y="98.0">HORIZONTAL — more copies (HPA)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="97.5" y="181.9">pod</tspan><tspan x="97.5" y="198.1">1 CPU</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="205.5" y="181.9">pod</tspan><tspan x="205.5" y="198.1">1 CPU</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="313.5" y="181.9">pod</tspan><tspan x="313.5" y="198.1">1 CPU</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="421.5" y="181.9">pod</tspan><tspan x="421.5" y="198.1">1 CPU</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="255" y="280.0">add / remove pods • no restart • used for stateless apps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold"><tspan x="745" y="98.0">VERTICAL — bigger pod (VPA)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="605.0" y="196.9">pod</tspan><tspan x="605.0" y="213.1">1 CPU</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="820.0" y="185.0">pod</tspan><tspan x="820.0" y="205.0">4 CPU, 8 GB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="745" y="290.0">more CPU / RAM for one pod • pod restarts • limited by node size</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="365.0">HPA = Horizontal Pod Autoscaler (elastic, widely used)  •  VPA = Vertical Pod Autoscaler (rarely used)</tspan></text>
</g>
</svg>