<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="270" width="600" height="150" rx="14" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="310" width="170" height="90" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="235" y="310" width="170" height="90" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="425" y="310" width="170" height="90" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="90" width="260" height="110" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M200,310 L160,200" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M169.3,209.1 L160,200 L158.7,212.9" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="370" y="90" width="250" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M290,145 L370,145" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M358.3,150.7 L370,145 L358.3,139.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="700" y="90" width="270" height="110" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M620,145 L700,145" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M688.3,150.7 L700,145 L688.3,139.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M835,200 L620,330" fill="none" stroke="#6741d9" stroke-width="2"/>
<path d="M627.1,319.1 L620,330 L632.9,328.8" fill="none" stroke="#6741d9" stroke-width="2"/>
<rect x="660" y="340" width="320" height="70" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">How HPA works: metrics-server → HPA → Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="320" y="290.0">worker nodes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="130.0" y="347.5">pod</tspan><tspan x="130.0" y="362.5">CPU 80% of request</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="320.0" y="347.5">pod</tspan><tspan x="320.0" y="362.5">CPU 80% of request</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="510.0" y="347.5">pod</tspan><tspan x="510.0" y="362.5">CPU 80% of request</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="160.0" y="124.4">metrics-server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="160.0" y="141.0">(pod in kube-system)</tspan><tspan x="160.0" y="154.8">collects CPU / RAM from</tspan><tspan x="160.0" y="168.5">every node&#x27;s kubelet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="220" y="250.0">kubelet stats</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="495.0" y="131.2">HPA controller</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="495.0" y="147.9">every 15 s: read metrics,</tspan><tspan x="495.0" y="161.6">compare with target 50%</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#495057" font-weight="normal"><tspan x="330" y="130.0">metrics API</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="835.0" y="131.2">Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="835.0" y="147.9">replicas: 1 → 4</tspan><tspan x="835.0" y="161.6">(ReplicaSet makes pods)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="660" y="130.0">scale</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#6741d9" font-weight="bold"><tspan x="760" y="290.0">new pods</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="367.5">kubectl top nodes / kubectl top pods</tspan><tspan x="820.0" y="382.5">also read from metrics-server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="455.0">no metrics-server → kubectl top fails and HPA shows TARGETS &lt;unknown&gt;</tspan></text>
</g>
</svg>