<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="500" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="200" width="120" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="200" y="180" width="200" height="110" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="500" y="75" width="470" height="140" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<rect x="520" y="115" width="430" height="40" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="520" y="162" width="430" height="40" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="500" y="255" width="470" height="110" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<rect x="520" y="295" width="430" height="50" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M400,215 L500,160" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M492.5,170.6 L500,160 L487.0,160.7" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M400,255 L500,310" fill="none" stroke="#2f9e44" stroke-width="3"/>
<path d="M487.0,309.3 L500,310 L492.5,299.4" fill="none" stroke="#2f9e44" stroke-width="3"/>
<path d="M140,235 L200,235" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M188.3,240.7 L200,235 L188.3,229.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="500" y="385" width="470" height="45" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">What happens to users mid-transaction during the switch?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="80.0" y="235.0">users</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="300.0" y="218.8">load balancer</tspan><tspan x="300.0" y="236.2">(live-service)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="300.0" y="244.1"></tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="735" y="95.0">BLUE v1 — still running</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="735.0" y="135.0">existing connections FINISH here (connection draining)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="735.0" y="182.0">e.g. a payment that already started completes on v1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="735" y="275.0">GREEN v2 — live</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="735.0" y="320.0">every NEW connection / request goes here</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1971c2" font-weight="bold"><tspan x="450" y="165.0">old</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#2f9e44" font-weight="bold"><tspan x="450" y="300.0">new</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="735.0" y="407.5">shared database: v1 and v2 must both work with its schema</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="240" y="335.0">why nothing is lost:</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="240" y="365.0">1. blue pods are NOT killed at switch</tspan><tspan x="240" y="380.0">2. requests already in progress finish</tspan><tspan x="240" y="395.0">3. data lives in the shared DB,</tspan><tspan x="240" y="410.0">    not in the pods</tspan><tspan x="240" y="425.0">4. DB changes backward-compatible</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="470.0">only delete blue after its open connections are done (and graceful shutdown handles SIGTERM if pods stop)</tspan></text>
</g>
</svg>