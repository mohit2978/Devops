<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="380" height="220" rx="14" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="130" width="320" height="40" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="190" width="320" height="40" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="220" cy="270" rx="100" ry="24" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="590" y="80" width="380" height="220" rx="14" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="620" y="130" width="320" height="40" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="620" y="190" width="320" height="40" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="620" y="250" width="320" height="40" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M380,150 L620,150" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M608.3,155.7 L620,150 L608.3,144.3" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M380,210 L620,210" fill="none" stroke="#6741d9" stroke-width="2.5"/>
<path d="M608.3,215.7 L620,210 L608.3,204.3" fill="none" stroke="#6741d9" stroke-width="2.5"/>
<path d="M320,270 L620,270" fill="none" stroke="#495057" stroke-width="2.5"/>
<path d="M608.3,275.7 L620,270 L608.3,264.3" fill="none" stroke="#495057" stroke-width="2.5"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">COPY vs ADD</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="220" y="102.0">your machine (build context)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="220.0" y="150.0">target/app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="220.0" y="210.0">app.tar.gz</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="220" y="270.0">https://…/file.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="780" y="102.0">inside the image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="780.0" y="150.0">/usr/app/app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="780.0" y="210.0">/usr/app/ (extracted files)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="780.0" y="270.0">/usr/app/file.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="138.0">COPY or ADD</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="198.0">ADD auto-extracts .tar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="470" y="258.0">ADD can download URLs</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="340.0">COPY &lt;path-on-your-machine&gt; &lt;path-in-image&gt;  — copies at BUILD time into the image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="370.0">best practice: use COPY; use ADD only when you need tar extraction</tspan></text>
</g>
</svg>