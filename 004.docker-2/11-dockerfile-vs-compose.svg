<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="470" height="395" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<rect x="40" y="115" width="430" height="160" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="100" y="295" width="120" height="50" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M220,320 L280,320" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M268.3,325.7 L280,320 L268.3,314.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="280" y="295" width="120" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="75" width="470" height="395" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<rect x="530" y="115" width="430" height="230" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="365" width="160" height="50" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M720,390 L765,390" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M753.3,395.7 L765,390 L753.3,384.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="765" y="360" width="90" height="30" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="765" y="395" width="90" height="30" rx="6" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="865" y="360" width="95" height="65" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Dockerfile vs docker-compose.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold"><tspan x="255" y="98.0">Dockerfile = how to BUILD one image</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="56" y="143.0">FROM eclipse-temurin:17-jre</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="56" y="169.0">WORKDIR /usr/app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="56" y="195.0">COPY target/app.jar app.jar</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="56" y="221.0">EXPOSE 8080</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="56" y="247.0">ENTRYPOINT [&quot;java&quot;,&quot;-jar&quot;,&quot;app.jar&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="160.0" y="320.0">docker build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="340.0" y="320.0">1 image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="255" y="376.9">describes ONE app: base image, files,</tspan><tspan x="255" y="393.1">install steps, start command</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="255" y="440.0">commands: docker build + docker run (long flags)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold"><tspan x="745" y="98.0">docker-compose.yml = how to RUN many containers</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="141.0">services:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="162.0">  app:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#adb5bd" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="183.0">    build: .            # uses the Dockerfile</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="204.0">    ports: [&quot;8080:8080&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="225.0">    depends_on: [db]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="246.0">  db:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="267.0">    image: mysql:8.0</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="288.0">    environment:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="309.0">      MYSQL_ROOT_PASSWORD: root</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546" y="330.0">    volumes: [dbdata:/var/lib/mysql]</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="640.0" y="390.0">docker compose up -d</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="810.0" y="375.0">app</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="810.0" y="410.0">db</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="912.5" y="385.6">network +</tspan><tspan x="912.5" y="399.4">volume</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="745" y="445.0">describes the whole APP STACK in one file</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="500.0">Dockerfile → builds the image  •  compose file → runs one or more containers from images (and can build them)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="530.0">they work TOGETHER: compose&#x27;s  build: .  uses your Dockerfile; image: mysql:8.0 pulls a ready-made image</tspan></text>
</g>
</svg>