<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="380" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="90" width="300" height="160" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="370" y="90" width="260" height="160" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="90" width="300" height="160" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M630,170 L670,170" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M658.3,175.7 L670,170 L658.3,164.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M641.7,164.3 L630,170 L641.7,175.7" fill="none" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">EXPOSE is documentation — -p actually opens the port</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="180.0" y="129.4">EXPOSE 8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="180.0" y="149.2">in the Dockerfile</tspan><tspan x="180.0" y="165.4"></tspan><tspan x="180.0" y="181.7">“this app listens on 8080”</tspan><tspan x="180.0" y="197.9">(info only — opens nothing,</tspan><tspan x="180.0" y="214.2">changes nothing)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="137.5">container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="156.0">app really listens</tspan><tspan x="500.0" y="172.3">on 8080</tspan><tspan x="500.0" y="188.5">(set by the app&#x27;s</tspan><tspan x="500.0" y="204.8">own config)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="820.0" y="145.6">docker run -p 9090:8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="164.2">publishes it:</tspan><tspan x="820.0" y="180.4">host port 9090 →</tspan><tspan x="820.0" y="196.7">container port 8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="295.0">the port is decided by the APP (e.g. server.port=8080), not by EXPOSE</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="325.0">docker run -P (capital) publishes all EXPOSEd ports to random host ports</tspan></text>
</g>
</svg>