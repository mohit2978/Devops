<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="80" width="470" height="250" rx="16" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<rect x="45" y="125" width="420" height="38" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="173" width="420" height="38" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="221" width="420" height="38" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="269" width="420" height="38" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="80" width="470" height="250" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<rect x="535" y="135" width="420" height="50" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="535" y="200" width="420" height="50" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M490,205 L510,205" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M498.3,210.7 L510,205 L498.3,199.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Build time vs run time — when does each instruction run?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e8590c" font-weight="bold"><tspan x="255" y="103.0">BUILD TIME  (docker build) — once</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="144.0">FROM  pick base image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="192.0">WORKDIR / COPY / ADD</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="240.0">RUN  install, compile, clone…</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="288.0">EXPOSE / USER / LABEL  metadata</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold"><tspan x="745" y="103.0">RUN TIME  (docker run) — every container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="745.0" y="160.0">CMD  — default command (can be replaced)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="745.0" y="225.0">ENTRYPOINT  — fixed command (args appended)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="745" y="290.0">starts your app: java -jar app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="365.0">RUN → baked INTO the image (layers)  •  CMD / ENTRYPOINT → only stored as metadata, executed on start</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="395.0">many RUN lines = all executed in order • many CMD lines = only the LAST one counts</tspan></text>
</g>
</svg>