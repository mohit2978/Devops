<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="460" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="330" height="250" rx="14" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="125" width="270" height="38" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="173" width="270" height="38" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="221" width="270" height="38" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="269" width="270" height="38" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="430" y="140" width="200" height="130" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M360,205 L430,205" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M418.3,210.7 L430,205 L418.3,199.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="700" y="140" width="270" height="130" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M630,205 L700,205" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M688.3,210.7 L700,205 L688.3,199.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="30" y="355" width="940" height="85" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">docker build — from a folder to an image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="195" y="102.0">build context  ( . = this folder )</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="144.0">Dockerfile</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="192.0">target/app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="240.0">src/ …</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="288.0">.dockerignore</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="530.0" y="182.5">docker build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="530.0" y="200.4">reads the Dockerfile</tspan><tspan x="530.0" y="215.4">runs each instruction</tspan><tspan x="530.0" y="230.4">top → bottom</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="835.0" y="182.5">image  myapp:1.0</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="835.0" y="200.4">name : tag</tspan><tspan x="835.0" y="215.4">(tag defaults to :latest)</tspan><tspan x="835.0" y="230.4">shows in docker images</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="383.0">$ docker build -t myapp:1.0 .                       # file named exactly &#x27;Dockerfile&#x27;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="409.0">$ docker build -t myapp:1.0 -f Dockerfile.prod .    # different file name → -f</tspan></text>
</g>
</svg>