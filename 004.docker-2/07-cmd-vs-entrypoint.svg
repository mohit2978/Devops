<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="330" height="40" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="370" y="80" width="260" height="40" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="640" y="80" width="330" height="40" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="130" width="330" height="75" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="370" y="130" width="260" height="75" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="640" y="130" width="330" height="75" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="215" width="330" height="75" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="370" y="215" width="260" height="75" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="640" y="215" width="330" height="75" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="300" width="330" height="75" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="370" y="300" width="260" height="75" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="640" y="300" width="330" height="75" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">CMD vs ENTRYPOINT — what happens when you pass arguments</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="195.0" y="100.0">Dockerfile</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="100.0">docker run img</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="805.0" y="100.0">docker run img echo hi</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="167.5">CMD [&quot;echo&quot;,&quot;hello&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="167.5">hello</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="805.0" y="167.5">hi   (CMD replaced)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="252.5">ENTRYPOINT [&quot;echo&quot;,&quot;hello&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="252.5">hello</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="805.0" y="252.5">hello echo hi   (args appended)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="195.0" y="330.0">ENTRYPOINT [&quot;java&quot;,&quot;-jar&quot;,&quot;app.jar&quot;]</tspan><tspan x="195.0" y="345.0">CMD [&quot;--server.port=8080&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="330.0">java -jar app.jar</tspan><tspan x="500.0" y="345.0">--server.port=8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="805.0" y="330.0">docker run img --server.port=9090</tspan><tspan x="805.0" y="345.0">→ port 9090</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="400.0">CMD = default, easily replaced • ENTRYPOINT = fixed executable (override only with --entrypoint)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="430.0">use the JSON (exec) form [&quot;java&quot;,&quot;-jar&quot;,&quot;app.jar&quot;] — the app becomes PID 1 and receives stop signals</tspan></text>
</g>
</svg>