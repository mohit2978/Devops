<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="450" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="150" y="85" width="470" height="48" rx="6" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="150" y="143" width="470" height="48" rx="6" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="150" y="201" width="470" height="48" rx="6" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="150" y="259" width="470" height="48" rx="6" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="150" y="317" width="470" height="48" rx="6" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M110,360 L110,95" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M115.7,106.7 L110,95 L104.3,106.7" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Each RUN / COPY / ADD makes a layer → Docker caches them</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="385.0" y="109.0">CMD [&quot;java&quot;,&quot;-jar&quot;,&quot;app.jar&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="bold"><tspan x="650" y="109.0">metadata only (no layer)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="385.0" y="167.0">COPY src/ + RUN mvn package</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold"><tspan x="650" y="167.0">rebuilt ↻ (code changed)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="385.0" y="225.0">COPY pom.xml + RUN mvn dependency:go-offline</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="650" y="225.0">cached ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="385.0" y="283.0">WORKDIR /app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="650" y="283.0">cached ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="385.0" y="341.0">FROM eclipse-temurin:17-jre</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="650" y="341.0">cached ✓</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="95" y="215.0">built</tspan><tspan x="95" y="230.0">bottom</tspan><tspan x="95" y="245.0">→ top</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="395.0">when a layer changes, it and every layer ABOVE it are rebuilt; layers below come from cache</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="425.0">put rarely-changing steps (base image, dependencies) FIRST and your code LAST → much faster builds</tspan></text>
</g>
</svg>