<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="380" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="85" width="440" height="190" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="540" y="85" width="430" height="190" rx="14" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<path d="M470,165 L655,207" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M642.3,209.9 L655,207 L644.8,198.9" fill="none" stroke="#e8590c" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">WORKDIR — the “cd” of a Dockerfile</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="125.0">COPY target/app.jar /usr/app/app.jar</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="165.0">WORKDIR /usr/app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="46" y="205.0">CMD [&quot;java&quot;, &quot;-jar&quot;, &quot;app.jar&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="755" y="105.0">image file system</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="600" y="150.0">/</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="620" y="180.0">└── usr/</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="660" y="210.0">└── app/   ← current directory</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="700" y="240.0">└── app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="315.0">every later RUN / COPY / CMD runs relative to it • created automatically if missing</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="345.0">prefer WORKDIR over RUN cd … (a cd inside RUN only lasts for that one RUN line)</tspan></text>
</g>
</svg>