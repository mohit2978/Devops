<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="420" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="520" height="260" rx="16" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
<rect x="55" y="125" width="220" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="305" y="125" width="220" height="110" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="55" y="255" width="470" height="36" rx="12" fill="#96f2d7" stroke="#1e1e1e" stroke-width="2"/>
<rect x="55" y="297" width="470" height="30" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="590" y="80" width="380" height="200" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">One pod, two containers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="290" y="102.0">Pod  •  one IP 192.168.19.209</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="165.0" y="165.0">javawebappcontainer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="165.0" y="181.6">ashokit/javawebapp</tspan><tspan x="165.0" y="196.6">port 8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="415.0" y="165.0">pythonapp</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="415.0" y="181.6">ashokit/py</tspan><tspan x="415.0" y="196.6">port 5000</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="290.0" y="273.0">shared network: each other at localhost:8080 / localhost:5000</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="290.0" y="312.0">ports must differ — they share one IP</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="106.0">spec:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="127.0">  containers:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="148.0">  - name: javawebappcontainer</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="169.0">    image: ashokit/javawebapp</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="190.0">  - name: pythonapp</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="211.0">    image: ashokit/py</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="232.0">    ports:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="606" y="253.0">    - containerPort: 5000</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="780" y="296.9">add another  - name:  entry</tspan><tspan x="780" y="313.1">under the same containers: list</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="375.0">normally 1 app container per pod; extra containers are helpers (log shipper, proxy) that must live together</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="402.0">kubectl logs &lt;pod&gt; -c pythonapp  → logs of one container in a multi-container pod</tspan></text>
</g>
</svg>