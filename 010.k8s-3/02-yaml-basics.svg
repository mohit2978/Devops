<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="85" width="225" height="95" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="195" width="225" height="52" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="265" y="85" width="225" height="95" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="265" y="195" width="225" height="74" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="85" width="225" height="95" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="195" width="225" height="96" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="755" y="85" width="225" height="95" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="755" y="195" width="225" height="96" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="330" width="880" height="50" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">YAML in 60 seconds — the rules that break manifests</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="132.5" y="125.0">key: value</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="132.5" y="142.2">a space after the colon</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="221.0">name: javawebapppod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="377.5" y="117.5">indentation = nesting</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="377.5" y="134.8">spaces only, never tabs;</tspan><tspan x="377.5" y="149.8">children indented more</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="281" y="221.0">metadata:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="281" y="243.0">  name: x</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="622.5" y="125.0">-  =  list item</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="622.5" y="142.2">containers, ports are lists</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="526" y="221.0">containers:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="526" y="243.0">- name: a</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="526" y="265.0">- name: b</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="867.5" y="125.0">---  separates resources</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="867.5" y="142.2">many resources in one file</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="771" y="221.0">kind: Pod</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="771" y="243.0">---</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="771" y="265.0">kind: Service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="355.0">most common errors: wrong indentation, a tab character, &#x27;label:&#x27; instead of &#x27;labels:&#x27;, missing space after &#x27;:&#x27;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="405.0">validate before applying:  kubectl apply -f pod.yml --dry-run=client</tspan></text>
</g>
</svg>