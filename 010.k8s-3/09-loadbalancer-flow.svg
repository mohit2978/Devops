<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">type: LoadBalancer on EKS — what gets created</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="80.0" y="210.0">users</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="310.0" y="189.4">AWS Classic LB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="310.0" y="205.3">created automatically</tspan><tspan x="310.0" y="219.1">DNS: a785…elb.</tspan><tspan x="310.0" y="232.8">ap-south-1.amazonaws.com</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="735" y="100.0">worker node 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="600.0" y="152.5">nodePort</tspan><tspan x="600.0" y="167.5">(auto)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="860.0" y="152.5">javawebapppod</tspan><tspan x="860.0" y="167.5">:8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="735" y="270.0">worker node 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="600.0" y="322.5">nodePort</tspan><tspan x="600.0" y="337.5">(auto)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="400.0">URL: http://&lt;LB-DNS-name&gt;/java-web-app/  (takes 1–3 min for DNS to work)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="428.0">delete the Service → the LB is deleted too • LB and worker nodes are billable</tspan></text>
</g>
