<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="615" y="100.0">cluster network (private)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="440.0" y="171.2">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="440.0" y="187.2">192.168.19.209:8080</tspan><tspan x="440.0" y="201.0">(private, changes on restart)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e03131" font-weight="bold"><tspan x="235" y="240.0">✗ can&#x27;t reach</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="790.0" y="162.5">Service (LoadBalancer)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="790.0" y="179.1">stable entry point</tspan><tspan x="790.0" y="194.1">finds pods by label</tspan><tspan x="790.0" y="209.1">+ public URL</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="340.0">a Service exposes pods: ClusterIP (inside) • NodePort (node IP:port) • LoadBalancer (cloud LB URL)</tspan></text>
