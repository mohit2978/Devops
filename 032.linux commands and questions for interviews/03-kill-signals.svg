<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="92" width="250" height="56" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="187" width="250" height="56" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="282" width="250" height="56" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="110" width="360" height="220" rx="12" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M280,120 L600,160" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M587.7,164.2 L600,160 L589.1,152.9" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M280,215 L600,220" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M588.2,225.5 L600,220 L588.4,214.2" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M280,310 L600,280" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M588.9,286.7 L600,280 L587.8,275.5" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">kill signals — what the JVM does with each one</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="155.0" y="120.0">kill -15  (SIGTERM)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="155.0" y="215.0">kill -3  (SIGQUIT)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="155.0" y="310.0">kill -9  (SIGKILL)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="780" y="135.0">java  PID 8492  (order-service)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="385.0">always try -15 first • -9 only if the app is hung • -3 is a free, non-intrusive diagnostic</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="410.0">kill -l lists all signals  •  systemd stop sends SIGTERM, then SIGKILL after a timeout</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.03;0.12;0.13;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M280,120 L600,160" keyPoints="0;0;1;1" keyTimes="0;0.03;0.12;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-25.0" y="-13" width="50" height="26" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">-15</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.36;0.45;0.46;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M280,215 L600,220" keyPoints="0;0;1;1" keyTimes="0;0.36;0.45;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-25.0" y="-13" width="50" height="26" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">-3</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.69;0.78;0.79;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M280,310 L600,280" keyPoints="0;0;1;1" keyTimes="0;0.69;0.78;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-25.0" y="-13" width="50" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">-9</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.33;0.35;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="780" y="201.9">shutdown hooks run</tspan><tspan x="780" y="220.6">→ finish requests</tspan><tspan x="780" y="239.4">→ close DB pool</tspan><tspan x="780" y="258.1">→ exit cleanly ✓</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.66;0.68;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e8590c" font-weight="bold"><tspan x="780" y="201.9">prints a THREAD DUMP to</tspan><tspan x="780" y="220.6">stdout / journal</tspan><tspan x="780" y="239.4"></tspan><tspan x="780" y="258.1">app keeps running ✓</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.8;0.98;0.999;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="600" y="110" width="360" height="220" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="780" y="135.0">java  PID 8492  (order-service)</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="780" y="201.9">killed INSTANTLY ✗</tspan><tspan x="780" y="220.6">no hooks, no cleanup</tspan><tspan x="780" y="239.4">(half-written data,</tspan><tspan x="780" y="258.1">open connections)</tspan></text></g></g>
</svg>