<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="125" width="120" height="50" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="170" y="128" width="118.5" height="44" rx="6" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="288.5" y="128" width="118.5" height="44" rx="6" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="407.0" y="128" width="158.0" height="44" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="565.0" y="128" width="63.19999999999997" height="44" rx="6" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="235" width="120" height="50" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="170" y="238" width="458.2" height="44" rx="6" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="628.2" y="238" width="94.8" height="44" rx="6" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="723.0" y="238" width="79.00000000000007" height="44" rx="6" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="802.0" y="238" width="118.49999999999993" height="44" rx="6" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Fix: every thread takes the locks in the SAME order (A, then B)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="150.0">thread-1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="229.25" y="150.0">lock A</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="347.75" y="150.0">lock B</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="486.0" y="150.0">transfer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="596.6" y="150.0">release</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="260.0">thread-2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="399.1" y="260.0">waits for A (not deadlocked — just queued)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="675.6" y="260.0">lock A</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="762.5" y="260.0">lock B</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="861.25" y="260.0">transfer</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="170" y="310.0">time →</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="350.0">lock(min(id1, id2)) then lock(max(id1, id2))  — no circle can form</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="380.0">also: ReentrantLock.tryLock(timeout) to back off • keep synchronized blocks tiny (no DB / HTTP calls inside)</tspan></text>
</g>
<g><animateTransform attributeName="transform" type="translate" values="170 0;960 0" dur="9s" repeatCount="indefinite"/><line x1="0" y1="110" x2="0" y2="300" stroke="#e03131" stroke-width="3" stroke-linecap="round"/></g>
</svg>