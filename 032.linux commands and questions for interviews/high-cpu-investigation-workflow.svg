<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>

    <filter id="cardGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Container -->
  <rect width="1020" height="540" rx="16" fill="url(#bgCpu)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(0, 24)">
    <text class="sans" x="510" y="20" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700" letter-spacing="2">TOP JAVA &amp; DEVOPS INTERVIEW SCENARIO</text>
    <text class="sans" x="510" y="52" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">Pinpointing 100% CPU to the Exact Java Code Line</text>
    <text class="sans" x="510" y="74" text-anchor="middle" fill="#94a3b8" font-size="13">The 5-Step Diagnostic Pipeline: From Linux Process to Culprit Method &amp; Line Number</text>
  </g>

  <!-- ================= 5 STEPS PIPELINE ================= -->

  <!-- STEP 1 -->
  <g transform="translate(25, 115)">
    <rect width="180" height="280" rx="10" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardGlow)"/>
    <rect x="30" y="-12" width="120" height="24" rx="12" fill="#0284c7"/>
    <text class="sans" x="90" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STEP 1: PID</text>
    
    <text class="mono" x="15" y="38" fill="#38bdf8" font-size="13" font-weight="700">$ top</text>
    <text class="sans" x="15" y="58" fill="#94a3b8" font-size="11">Find Java process</text>
    <text class="sans" x="15" y="72" fill="#94a3b8" font-size="11">consuming high CPU</text>
    
    <!-- Mini Terminal Box -->
    <rect x="12" y="88" width="156" height="60" rx="6" fill="#050811" stroke="#1e293b"/>
    <text class="mono" x="20" y="110" fill="#ef4444" font-size="11" font-weight="700">PID: 8492</text>
    <text class="mono" x="20" y="130" fill="#f59e0b" font-size="11">%CPU: 98.4%</text>

    <text class="sans" x="15" y="172" fill="#cbd5e1" font-size="11">Locates active JVM</text>
    <text class="sans" x="15" y="188" fill="#cbd5e1" font-size="11">Process ID (PID)</text>
    
    <circle cx="90" cy="235" r="16" fill="#0369a1"/>
    <text class="mono" x="90" y="240" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">8492</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 207 255 L 223 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STEP 2 -->
  <g transform="translate(225, 115)">
    <rect width="180" height="280" rx="10" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardGlow)"/>
    <rect x="30" y="-12" width="120" height="24" rx="12" fill="#d97706"/>
    <text class="sans" x="90" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STEP 2: THREAD</text>
    
    <text class="mono" x="15" y="38" fill="#fbbf24" font-size="12" font-weight="700">$ top -H -p 8492</text>
    <text class="sans" x="15" y="58" fill="#94a3b8" font-size="11">Inspect threads inside</text>
    <text class="sans" x="15" y="72" fill="#94a3b8" font-size="11">the Java process</text>
    
    <!-- Mini Terminal Box -->
    <rect x="12" y="88" width="156" height="60" rx="6" fill="#050811" stroke="#1e293b"/>
    <text class="mono" x="20" y="110" fill="#ef4444" font-size="11" font-weight="700">TID: 8519</text>
    <text class="mono" x="20" y="130" fill="#ef4444" font-size="11">%CPU: 94.2%</text>

    <text class="sans" x="15" y="172" fill="#cbd5e1" font-size="11">Rogue decimal</text>
    <text class="sans" x="15" y="188" fill="#cbd5e1" font-size="11">Thread ID (TID)</text>
    
    <circle cx="90" cy="235" r="16" fill="#b45309"/>
    <text class="mono" x="90" y="240" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">8519</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 407 255 L 423 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STEP 3 -->
  <g transform="translate(425, 115)">
    <rect width="180" height="280" rx="10" fill="url(#stepGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardGlow)"/>
    <rect x="30" y="-12" width="120" height="24" rx="12" fill="#7e22ce"/>
    <text class="sans" x="90" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STEP 3: CONVERT</text>
    
    <text class="mono" x="15" y="38" fill="#c084fc" font-size="11" font-weight="700">printf "%x\n" 8519</text>
    <text class="sans" x="15" y="58" fill="#94a3b8" font-size="11">Convert thread ID</text>
    <text class="sans" x="15" y="72" fill="#94a3b8" font-size="11">to hexadecimal</text>
    
    <!-- Mini Terminal Box -->
    <rect x="12" y="88" width="156" height="60" rx="6" fill="#050811" stroke="#1e293b"/>
    <text class="sans" x="20" y="108" fill="#94a3b8" font-size="11">Decimal: 8519</text>
    <text class="mono" x="20" y="130" fill="#a855f7" font-size="13" font-weight="700">Hex: 2147</text>

    <text class="sans" x="15" y="172" fill="#cbd5e1" font-size="11">JVM thread dump</text>
    <text class="sans" x="15" y="188" fill="#cbd5e1" font-size="11">uses hex nid format</text>
    
    <circle cx="90" cy="235" r="16" fill="#6b21a8"/>
    <text class="mono" x="90" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">0x2147</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 607 255 L 623 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STEP 4 -->
  <g transform="translate(625, 115)">
    <rect width="180" height="280" rx="10" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardGlow)"/>
    <rect x="30" y="-12" width="120" height="24" rx="12" fill="#047857"/>
    <text class="sans" x="90" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STEP 4: JSTACK</text>
    
    <text class="mono" x="15" y="38" fill="#34d399" font-size="12" font-weight="700">jstack 8492</text>
    <text class="sans" x="15" y="58" fill="#94a3b8" font-size="11">Capture full JVM</text>
    <text class="sans" x="15" y="72" fill="#94a3b8" font-size="11">thread stack dump</text>
    
    <!-- Mini Terminal Box -->
    <rect x="12" y="88" width="156" height="60" rx="6" fill="#050811" stroke="#1e293b"/>
    <text class="mono" x="18" y="108" fill="#38bdf8" font-size="10">grep -A 10</text>
    <text class="mono" x="18" y="128" fill="#34d399" font-size="11" font-weight="700">nid=0x2147</text>

    <text class="sans" x="15" y="172" fill="#cbd5e1" font-size="11">Matches stack trace</text>
    <text class="sans" x="15" y="188" fill="#cbd5e1" font-size="11">to native ID</text>
    
    <circle cx="90" cy="235" r="16" fill="#065f46"/>
    <text class="mono" x="90" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STACK</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 807 255 L 823 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STEP 5 -->
  <g transform="translate(825, 115)">
    <rect width="170" height="280" rx="10" fill="url(#stepGrad)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.8" filter="url(#cardGlow)"/>
    <rect x="25" y="-12" width="120" height="24" rx="12" fill="url(#badgeGrad)"/>
    <text class="sans" x="85" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ROOT CAUSE</text>
    
    <text class="mono" x="12" y="36" fill="#f87171" font-size="10" font-weight="700">OrderCalculator</text>
    <text class="mono" x="12" y="52" fill="#fbbf24" font-size="11">Line: 142</text>
    
    <!-- Mini Terminal Box -->
    <rect x="10" y="70" width="150" height="78" rx="6" fill="#050811" stroke="#ef4444" stroke-width="1"/>
    <text class="mono" x="16" y="90" fill="#ef4444" font-size="10">while(true) {</text>
    <text class="mono" x="22" y="106" fill="#94a3b8" font-size="9">// infinite loop</text>
    <text class="mono" x="22" y="120" fill="#94a3b8" font-size="9">// condition bug</text>
    <text class="mono" x="16" y="136" fill="#ef4444" font-size="10">}</text>

    <text class="sans" x="12" y="172" fill="#fca5a5" font-size="11">Pinpoints exact</text>
    <text class="sans" x="12" y="188" fill="#fca5a5" font-size="11">buggy line of code!</text>
    
    <circle cx="85" cy="235" r="16" fill="#991b1b"/>
    <text class="mono" x="85" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">FIX</text>
  </g>

  <!-- ================= BOTTOM BANNER ================= -->
  <g transform="translate(25, 420)">
    <rect width="970" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text class="sans" x="25" y="28" fill="#f8fafc" font-size="13" font-weight="700">Production One-Liner Pipeline for Interviews:</text>
    
    <rect x="20" y="40" width="930" height="42" rx="6" fill="#050811" stroke="#334155"/>
    <text class="mono" x="35" y="66" fill="#38bdf8" font-size="12">
      top -H -p $(pgrep -f java) <tspan fill="#64748b">--&gt;</tspan> printf "%x\n" &lt;TID&gt; <tspan fill="#64748b">--&gt;</tspan> jstack &lt;PID&gt; | grep -A 25 "nid=0x&lt;HEX&gt;"
    </text>
  </g>
</svg>
