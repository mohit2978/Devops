<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="th1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="th2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="dlShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1020" height="540" rx="16" fill="url(#bgDl)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 24)">
    <text class="sans" x="510" y="20" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="2">JAVA DEADLOCK DIAGNOSTICS IN LINUX</text>
    <text class="sans" x="510" y="52" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">Circular Lock Contention &amp; "jstack" Detection</text>
    <text class="sans" x="510" y="74" text-anchor="middle" fill="#94a3b8" font-size="13">How JVM Thread Dumps Automatically Detect and Report Java-Level Deadlocks</text>
  </g>

  <!-- ================= LEFT: CIRCULAR DEADLOCK MECHANISM ================= -->
  <g transform="translate(35, 115)">
    <rect width="460" height="280" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" filter="url(#dlShadow)"/>
    <rect x="30" y="-12" width="220" height="24" rx="12" fill="url(#lockGrad)"/>
    <text class="sans" x="140" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1. CIRCULAR WAIT CONDITION</text>

    <!-- Thread 1 Box -->
    <g transform="translate(30, 45)">
      <rect width="160" height="70" rx="8" fill="#050811" stroke="#38bdf8" stroke-width="1.5"/>
      <text class="mono" x="80" y="28" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Thread-1</text>
      <text class="sans" x="80" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">State: BLOCKED</text>
    </g>

    <!-- Thread 2 Box -->
    <g transform="translate(270, 165)">
      <rect width="160" height="70" rx="8" fill="#050811" stroke="#ec4899" stroke-width="1.5"/>
      <text class="mono" x="80" y="28" text-anchor="middle" fill="#ec4899" font-size="12" font-weight="700">Thread-2</text>
      <text class="sans" x="80" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">State: BLOCKED</text>
    </g>

    <!-- Lock A Box -->
    <g transform="translate(270, 45)">
      <rect width="160" height="70" rx="8" fill="#050811" stroke="#f59e0b" stroke-width="1.5"/>
      <text class="mono" x="80" y="28" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">Lock A (Account 1)</text>
      <text class="sans" x="80" y="48" text-anchor="middle" fill="#38bdf8" font-size="11">Held by: Thread-1</text>
    </g>

    <!-- Lock B Box -->
    <g transform="translate(30, 165)">
      <rect width="160" height="70" rx="8" fill="#050811" stroke="#f59e0b" stroke-width="1.5"/>
      <text class="mono" x="80" y="28" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">Lock B (Account 2)</text>
      <text class="sans" x="80" y="48" text-anchor="middle" fill="#ec4899" font-size="11">Held by: Thread-2</text>
    </g>

    <!-- Arrows Showing Circular Wait -->
    <!-- Thread 1 holds Lock A (Right) -->
    <line x1="190" y1="80" x2="265" y2="80" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="268,80 260,76 260,84" fill="#38bdf8"/>

    <!-- Thread 1 waits for Lock B (Down) -->
    <line x1="110" y1="115" x2="110" y2="160" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="110,163 106,155 114,155" fill="#ef4444"/>

    <!-- Thread 2 holds Lock B (Left) -->
    <line x1="270" y1="200" x2="195" y2="200" stroke="#ec4899" stroke-width="2"/>
    <polygon points="192,200 200,196 200,204" fill="#ec4899"/>

    <!-- Thread 2 waits for Lock A (Up) -->
    <line x1="350" y1="165" x2="350" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="350,117 346,125 354,125" fill="#ef4444"/>

    <text class="sans" x="230" y="260" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">Circular Wait: Neither thread can ever proceed!</text>
  </g>

  <!-- ================= RIGHT: JSTACK TERMINAL AUDIT ================= -->
  <g transform="translate(520, 115)">
    <rect width="465" height="280" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#dlShadow)"/>
    <rect x="30" y="-12" width="220" height="24" rx="12" fill="#059669"/>
    <text class="sans" x="140" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2. JSTACK DETECTION LOG</text>

    <!-- Terminal Box -->
    <g transform="translate(20, 25)">
      <rect width="425" height="235" rx="8" fill="#050811" stroke="#1e293b"/>
      
      <!-- Command prompt -->
      <text class="mono" x="15" y="24" fill="#38bdf8" font-size="11">$ jstack 8492 | grep -A 15 -i "deadlock"</text>
      
      <!-- Output snippet -->
      <g transform="translate(15, 48)" class="mono" font-size="10">
        <text x="0" y="10" fill="#ef4444" font-weight="700">Found one Java-level deadlock:</text>
        <text x="0" y="24" fill="#64748b">=============================</text>
        
        <text x="0" y="40" fill="#38bdf8">"Thread-1":</text>
        <text x="12" y="54" fill="#94a3b8">waiting to lock monitor 0x0040 (Lock B),</text>
        <text x="12" y="68" fill="#f59e0b">which is held by "Thread-2"</text>
        
        <text x="0" y="90" fill="#ec4899">"Thread-2":</text>
        <text x="12" y="104" fill="#94a3b8">waiting to lock monitor 0x0030 (Lock A),</text>
        <text x="12" y="118" fill="#f59e0b">which is held by "Thread-1"</text>
        
        <line x1="0" y1="130" x2="395" y2="130" stroke="#1e293b"/>
        
        <text x="0" y="148" fill="#34d399">at com.bank.TransferService.pay(TransferService.java:45)</text>
        <text x="0" y="166" fill="#ef4444" font-weight="700">Found 1 deadlock.</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM TOOL SUMMARY BAR ================= -->
  <g transform="translate(35, 415)">
    <rect width="950" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <g transform="translate(25, 24)" class="sans" font-size="12">
      <text x="0" y="0" fill="#f8fafc" font-weight="700">3 FAST WAYS TO CHECK DEADLOCK ON LINUX:</text>
      
      <text x="0" y="26" fill="#cbd5e1">
        <tspan font-weight="700" fill="#38bdf8">1. jstack &lt;PID&gt;:</tspan> Prints full thread analysis &amp; automatically searches for thread lock cycles.
      </text>
      <text x="0" y="46" fill="#cbd5e1">
        <tspan font-weight="700" fill="#fbbf24">2. jcmd &lt;PID&gt; Thread.print:</tspan> Recommended modern HotSpot command to print thread dumps.
      </text>
      <text x="0" y="66" fill="#cbd5e1">
        <tspan font-weight="700" fill="#ec4899">3. kill -3 &lt;PID&gt;:</tspan> Sends SIGQUIT — JVM automatically detects deadlocks and writes diagnosis to stdout/journal.
      </text>
    </g>
  </g>
</svg>
