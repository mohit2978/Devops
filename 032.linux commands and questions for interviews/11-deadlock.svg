<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="500" y="111.2">🔒 Lock A</tspan><tspan x="500" y="128.8">(account 1)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="500" y="351.2">🔒 Lock B</tspan><tspan x="500" y="368.8">(account 2)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="330" y="150.0">HOLDS</tspan></text>
