<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold"><tspan x="500" y="231.2">circular wait</tspan><tspan x="500" y="248.8">→ nobody moves</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="500" y="430.0">symptoms: CPU ≈ 0%, Tomcat thread pool exhausted, health checks time out</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="458.0">jstack -l PID  →  &quot;Found one Java-level deadlock&quot;  + the exact line (TransferService.java:45)</tspan></text>
