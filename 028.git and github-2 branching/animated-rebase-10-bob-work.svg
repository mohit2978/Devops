<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Bob creates work from D2</title><desc id="d">Bob fetches feature at D2 and creates B1 whose parent is D2.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="620" rx="30" fill="url(#b)"/><text x="60" y="65" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">Bob builds B1 on the published D2</text><text x="60" y="103" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="20">git switch -c bob-work origin/feature  ·  git commit</text><g stroke="#64748b" stroke-width="5"><path d="M250 330H450M510 330H710M770 330H970"/><path d="M1030 330H1130" stroke="#ef4444" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" values="120;120;0;0" keyTimes="0;.3;.62;1" dur="5s" repeatCount="indefinite"/></path></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="100" y="290" width="150" height="80" rx="17" fill="#134e4a"/><text x="175" y="339">C2</text><rect x="360" y="290" width="150" height="80" rx="17" fill="#4c1d95"/><text x="435" y="339">D1</text><rect x="620" y="290" width="150" height="80" rx="17" fill="#5b21b6"/><text x="695" y="339">D2</text><g opacity="0"><rect x="970" y="290" width="150" height="80" rx="17" fill="#991b1b" stroke="#fca5a5" stroke-width="4"/><text x="1045" y="339">B1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.65;1" dur="5s" repeatCount="indefinite"/></g></g><g font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><rect x="620" y="410" width="150" height="48" rx="14" fill="#7c3aed"/><text x="695" y="442" fill="white">origin/feature</text><g opacity="0"><rect x="970" y="410" width="150" height="48" rx="14" fill="#b91c1c"/><text x="1045" y="442" fill="white">bob-work</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.4;.68;1" dur="5s" repeatCount="indefinite"/></g></g><text x="60" y="550" fill="#fca5a5" font-family="Inter,Segoe UI,sans-serif" font-size="20">B1 permanently records D2 as its parent.</text></svg>
