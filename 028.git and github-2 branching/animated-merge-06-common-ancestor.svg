<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Find the common ancestor</title><desc id="d">Git highlights f30ab as the common ancestor, then reads the master and develop snapshots.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="620" rx="30" fill="url(#b)"/><text x="60" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">6. Git compares three snapshots</text><text x="60" y="110" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="22">common ancestor + master tip + develop tip</text><g stroke="#64748b" stroke-width="5"><path d="M300 350H490M550 350H740"/><path d="M800 330L960 220M800 370L960 470"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="23" text-anchor="middle" fill="#e2e8f0"><rect x="150" y="310" width="150" height="80" rx="17" fill="#1e293b"/><text x="225" y="359">98ca9</text><rect x="400" y="310" width="150" height="80" rx="17" fill="#1e293b"/><text x="475" y="359">34ac2</text><rect x="650" y="310" width="150" height="80" rx="17" fill="#134e4a" stroke="#2dd4bf" stroke-width="5"/><text x="725" y="359">f30ab</text><rect x="885" y="170" width="150" height="80" rx="17" fill="#78350f" stroke="#fbbf24" stroke-width="5"/><text x="960" y="219">28bd1</text><rect x="885" y="430" width="150" height="80" rx="17" fill="#4c1d95" stroke="#c4b5fd" stroke-width="5"/><text x="960" y="479">43ef8</text></g><g font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700"><g opacity="0"><text x="620" y="430" fill="#5eead4">COMMON ANCESTOR</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.38;.48" dur="7s" repeatCount="indefinite"/></g><g opacity="0"><text x="1045" y="215" fill="#fde68a">MASTER SNAPSHOT</text><text x="1045" y="475" fill="#ddd6fe">DEVELOP SNAPSHOT</text>