<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Alice rebases locally</title><desc id="d">Alice's local feature becomes C3 D1 prime D2 prime while origin and Bob remain on the old D1 D2 history.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="660" rx="30" fill="url(#b)"/><text x="60" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="36" font-weight="700">After Alice's local rebase—before pushing</text><g font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><text x="220" y="135" fill="#c4b5fd">ALICE LOCAL</text><text x="600" y="135" fill="#38bdf8">ORIGIN</text><text x="980" y="135" fill="#fca5a5">BOB LOCAL</text></g><g font-family="ui-monospace,Consolas,monospace" font-size="19" text-anchor="middle" fill="#e2e8f0"><g><rect x="30" y="260" width="85" height="65" rx="13" fill="#134e4a"/><text x="72" y="300">C2</text><rect x="140" y="260" width="85" height="65" rx="13" fill="#075985"/><text x="182" y="300">C3</text><rect x="250" y="260" width="85" height="65" rx="13" fill="#4c1d95"/><text x="292" y="300">D1′</text><rect x="360" y="260" width="85" height="65" rx="13" fill="#5b21b6"/><text x="402" y="300">D2′</text><path d="M115 292H140M225 292H250M335 292H360" stroke="#64748b" stroke-width="4"/></g><g><rect x="455" y="260" width="85" height="65" rx="13" fill="#134e4a"/><text x="497" y="300">C2</text><rect x="565" y="260" width="85" height="65" rx="13" fill="#4c1d95"/><text x="607" y="300">D1</text><rect x="675" y="260" width="85" height="65" rx="13" fill="#5b21b6"/><text x="717" y="300">D2</text><path d="M540 292H565M650 292H675" stroke="#64748b" stroke-width="4"/></g><g><rect x="790" y="260" width="85" height="65" rx="13" fill="#134e4a"/><text x="832" y="300">C2</text><rect x="900" y="260" width="85" height="65" rx="13" fill="#4c1d95"/><text x="942" y="300">D1</text><rect x="1010" y="260" width="85" height="65" rx="13" fill="#5b21b6"/><text x="1052" y="300">D2</text><rect x="1110" y="390" width="80" height="65" rx="13" fill="#991b1b"/><text x="1150" y="430">B1</text><path d="M875 292H900M985 292H1010M1095 305L1140 390" stroke="#64748b" stroke-width="4"/></g></g><g font-family="Inter,Segoe UI,sans-serif" font-size="18" text-anchor="middle"><text x="220" y="380" fill="#ddd6fe">rewritten only here</text><text x="600" y="380" fill="#bae6fd">still old feature</text><text x="980" y="500" fill="#fecaca">still old ancestry</text></g><text x="600" y="585" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">A local rebase does not modify origin or Bob's computer.</text></svg>
