<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Replay D2 and finish rebase</title><desc id="d">D2 prime appears after D1 prime, leaving develop ahead of unchanged master in a linear history.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Step 5: replay D2 and finish</text><text x="60" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">The final history is linear; master still points to C3.</text><g stroke="#64748b" stroke-width="5"><path d="M220 320H370M430 320H580M640 320H790M850 320H1000M1060 320H1150"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="22" text-anchor="middle" fill="#e2e8f0"><rect x="80" y="282" width="140" height="76" rx="16" fill="#1e293b"/><text x="150" y="329">C0</text><rect x="290" y="282" width="140" height="76" rx="16" fill="#1e293b"/><text x="360" y="329">C1</text><rect x="500" y="282" width="140" height="76" rx="16" fill="#134e4a"/><text x="570" y="329">C2</text><rect x="710" y="282" width="140" height="76" rx="16" fill="#075985"/><text x="780" y="329">C3</text><rect x="920" y="282" width="140" height="76" rx="16" fill="#4c1d95"/><text x="990" y="329">D1′</text><g opacity="0"><rect x="1090" y="282" width="110" height="76" rx="16" fill="#5b21b6" stroke="#c4b5fd" stroke-width="4"/><text x="1145" y="329">D2′</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.32;.62;1" dur="5s" repeatCount="indefinite"/></g></g><g font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><rect x="710" y="195" width="140" height="48" rx="14" fill="#0284c7"/><text x="780" y="227" fill="white">master</text><g><rect x="920" y="410" width="140" height="48" rx="14" fill="#7c3aed"/><text x="990" y="442" fill="white">develop</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;150 0;150 0" keyTimes="0;.3;.65;1" dur="5s" repeatCount="indefinite"/></g><g><rect x="920" y="470" width="140" height="42" rx="13" fill="#f59e0b"/><text x="990" y="498" fill="#111827">HEAD</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;150 0;150 0" keyTimes="0;.3;.65;1" dur="5s" repeatCount="indefinite"/></g></g><text x="60" y="550" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">C0 → C1 → C2 → C3 → D1′ → D2′</text></svg>
