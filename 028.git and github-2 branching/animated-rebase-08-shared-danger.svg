<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Why rebasing a shared branch is dangerous</title><desc id="d">Alice rewrites D1 and D2 as D1 prime and D2 prime, while Bob's work remains attached to the original D2, producing two incompatible histories.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <text x="60" y="65" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">A shared rebase creates two histories</text>
  <text x="60" y="103" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="20">Same-looking changes do not mean the same commits: hashes and parents changed.</text>
  <line x1="600" y1="130" x2="600" y2="625" stroke="#334155" stroke-width="3"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-weight="700" text-anchor="middle">
    <text x="300" y="165" fill="#fca5a5" font-size="27">BOB STILL HAS THE OLD HISTORY</text>
    <text x="900" y="165" fill="#c4b5fd" font-size="27">ALICE FORCE-PUSHES NEW HISTORY</text>
  </g>
  <g stroke="#64748b" stroke-width="5"><path d="M100 350H220M280 350H400M460 350H540"/><path d="M400 390L500 505"/><path d="M680 350H800M860 350H980M1040 350H1140"/></g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="22" text-anchor="middle" fill="#e2e8f0">
    <rect x="40" y="312" width="120" height="76" rx="16" fill="#134e4a"/><text x="100" y="359">C2</text>
    <rect x="220" y="312" width="120" height="76" rx="16" fill="#4c1d95"/><text x="280" y="359">D1</text>
    <rect x="400" y="312" width="120" height="76" rx="16" fill="#5b21b6"/><text x="460" y="359">D2</text>
    <rect x="440" y="485" width="120" height="76" rx="16" fill="#991b1b"/><text x="500" y="532">B1</text>
    <rect x="620" y="312" width="120" height="76" rx="16" fill="#134e4a"/><text x="680" y="359">C2</text>
    <rect x="800" y="312" width="120" height="76" rx="16" fill="#075985"/><text x="860" y="359">C3</text>
    <g opacity="0"><rect x="980" y="312" width="120" height="76" rx="16" fill="#4c1d95" stroke="#c4b5fd" stroke-width="4"/><text x="1040" y="359">D1′</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.25;.48;1" dur="6s" repeatCount="indefinite"/></g>
    <g opacity="0"><rect x="1120" y="312" width="80" height="76" rx="16" fill="#5b21b6" stroke="#c4b5fd" stroke-width="4"/><text x="1160" y="359">D2′</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.72;1" dur="6s" repeatCount="indefinite"/></g>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="390" y="410" width="140" height="45" rx="13" fill="#7c3aed"/><text x="460" y="440" fill="white">old feature</text>
    <rect x="430" y="575" width="140" height="45" rx="13" fill="#b91c1c"/><text x="500" y="605" fill="white">bob-work</text>
    <g opacity="0"><rect x="1075" y="415" width="120" height="45" rx="13" fill="#7c3aed"/><text x="1135" y="445" fill="white">feature</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.55;.74;1" dur="6s" repeatCount="indefinite"/></g>
  </g>
  <path d="M575 250C610 205 655 205 690 250" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-88" dur="2s" repeatCount="indefinite"/></path>
  <text x="600" y="285" text-anchor="middle" fill="#fca5a5" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">HISTORIES DISAGREE</text>
  <text x="60" y="650" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">Bob's B1 still depends on old D2; Alice's remote branch now contains new D1′ and D2′.</text>
</svg>
