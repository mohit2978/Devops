<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Merge compared with rebase</title><desc id="d">The left side preserves diverging history with merge commit M, while the right side shows a rewritten linear rebase history.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="650" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Merge preserves; rebase rewrites</text><line x1="600" y1="105" x2="600" y2="585" stroke="#334155" stroke-width="3"/><g font-family="Inter,Segoe UI,sans-serif"><text x="300" y="130" text-anchor="middle" fill="#38bdf8" font-size="30" font-weight="700">MERGE</text><text x="900" y="130" text-anchor="middle" fill="#a78bfa" font-size="30" font-weight="700">REBASE</text><text x="300" y="565" text-anchor="middle" fill="#94a3b8" font-size="19">Existing commits stay unchanged; M records integration.</text><text x="900" y="565" text-anchor="middle" fill="#94a3b8" font-size="19">D1′ and D2′ are new commits in a linear history.</text></g><g stroke="#64748b" stroke-width="5"><path d="M100 360H210M270 360H380M440 340L510 260M440 380L500 465M550 465L535 280"/><path d="M675 360H765M825 360H915M975 360H1065M1125 360H1180"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="20" text-anchor="middle" fill="#e2e8f0"><g><rect x="55" y="325" width="100" height="70" rx="14" fill="#1e293b"/><text x="105" y="368">C1</text><rect x="210" y="325" width="100" height="70" rx="14" fill="#134e4a"/><text x="260" y="368">C2</text><rect x="365" y="225" width="100" height="70" rx="14" fill="#075985"/><text x="415" y="268">C3</text><rect x="450" y="430" width="100" height="70" rx="14" fill="#4c1d95"/><text x="500" y="473">D2</text><rect x="485" y="245" width="100" height="70" rx="14" fill="#78350f" stroke="#fbbf24" stroke-width="3"/><text x="535" y="288">M</text></g><g><rect x="625" y="325" width="100" height="70" rx="14" fill="#1e293b"/><text x="675" y="368">C1</text><rect x="765" y="325" width="100" height="70" rx="14" fill="#134e4a"/><text x="815" y="368">C2</text><rect x="915" y="325" width="100" height="70" rx="14" fill="#075985"/><text x="965" y="368">C3</text><rect x="1065" y="325" width="100" height="70" rx="14" fill="#4c1d95"/><text x="1115" y="368">D1′</text><rect x="1150" y="430" width="0" height="0" fill="none"/></g></g><circle cx="535" cy="280" r="50" fill="none" stroke="#fbbf24" stroke-width="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle><path d="M1115 410V480" stroke="#a78bfa" stroke-width="5"/><rect x="1045" y="480" width="140" height="65" rx="15" fill="#5b21b6"/><text x="1115" y="522" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace" font-size="20">D2′</text></svg>
