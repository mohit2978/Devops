<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Commit on develop</title><desc id="d">A new commit 87ab2 appears after f30ab and the develop pointer advances to it.</desc>
