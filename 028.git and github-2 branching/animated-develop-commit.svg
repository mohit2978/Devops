  <rect width="1200" height="560" rx="30" fill="url(#bg)"/><text x="62" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">3. Commit on develop</text><text x="62" y="110" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="23">develop advances; master stays at f30ab</text>
  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M790 300H570"/><path d="M570 300H350"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="240" y="260" width="160" height="80" rx="17" fill="#1e293b"/><text x="320" y="309">98ca9</text><rect x="460" y="260" width="160" height="80" rx="17" fill="#1e293b"/><text x="540" y="309">34ac2</text><rect x="680" y="260" width="160" height="80" rx="17" fill="#1e293b"/><text x="760" y="309">f30ab</text><g opacity="0"><path d="M1010 300H840" stroke="#8b5cf6" stroke-width="5"/><rect x="920" y="260" width="160" height="80" rx="17" fill="#5b21b6"/><text x="1000" y="309">87ab2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.3;.55;1" dur="5s" repeatCount="indefinite"/></g></g>
