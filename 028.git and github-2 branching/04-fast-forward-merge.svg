<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="150" cy="220" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="310" cy="220" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M284,220 L179,220" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M190.7,214.3 L179,220 L190.7,225.7" fill="none" stroke="#495057" stroke-width="2"/>
<ellipse cx="470" cy="220" rx="26" ry="26" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<path d="M444,220 L339,220" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M350.7,214.3 L339,220 L350.7,225.7" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="600" y="150" width="360" height="130" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Fast-forward merge</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="150" y="220.0">C1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="310" y="220.0">C2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="470" y="220.0">C3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="780.0" y="188.8">Why “fast-forward”?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="780.0" y="207.9">master has NO new commits since impfix</tspan><tspan x="780.0" y="225.4">branched off → Git just slides the</tspan><tspan x="780.0" y="242.9">master pointer forward. No new commit.</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.82;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="430.0" y="137" width="80" height="30" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><path d="M470,167 L470,183" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M464.3,171.3 L470,183 L475.7,171.3" fill="none" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="470" y="152.0">impfix</tspan></text></g></g>
<g ><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.47;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="270.0" y="273" width="80" height="30" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><path d="M310,273 L310,257" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M315.7,268.7 L310,257 L304.3,268.7" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="272.0" y="337" width="76" height="30" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><path d="M310,337 L310,318" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M315.7,329.7 L310,318 L304.3,329.7" fill="none" stroke="#e8590c" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="310" y="288.0">master</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="310" y="352.0">HEAD</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.97;0.99;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="430.0" y="273" width="80" height="30" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><path d="M470,273 L470,257" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M475.7,268.7 L470,257 L464.3,268.7" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="432.0" y="337" width="76" height="30" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><path d="M470,337 L470,318" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M475.7,329.7 L470,318 L464.3,329.7" fill="none" stroke="#e8590c" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="470" y="288.0">master</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="470" y="352.0">HEAD</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.4;0.6;0.62;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><path d="M345,288 L425,288" fill="none" stroke="#1971c2" stroke-width="3"/><path d="M413.3,293.7 L425,288 L413.3,282.3" fill="none" stroke="#1971c2" stroke-width="3"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.05;0.4;0.42;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="400.0">git checkout master</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.8;0.82;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="400.0">git merge impfix   → Fast-forward</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="400.0">git branch -d impfix   → delete the merged branch</tspan></text></g></g>
</svg>