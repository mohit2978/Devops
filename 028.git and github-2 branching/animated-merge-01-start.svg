<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Starting state before merging</title><desc id="d">Master points to f30ab and develop points to 87ab2.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="590" rx="30" fill="url(#b)"/><text x="60" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">1. Starting history</text><text x="60" y="110" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="22">master and develop already point to different commits.</text><g stroke="#64748b" stroke-width="5"><path d="M300 325H480M540 325H720M780 325L960 410"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="150" y="285" width="150" height="80" rx="17" fill="#1e293b"/><text x="225" y="334">98ca9</text><rect x="390" y="285" width="150" height="80" rx="17" fill="#1e293b"/><text x="465" y="334">34ac2</text><rect x="630" y="285" width="150" height="80" rx="17" fill="#1e293b"/><text x="705" y="334">f30ab</text><rect x="885" y="380" width="150" height="80" rx="17" fill="#4c1d95"/><text x="960" y="429">87ab2</text></g><g font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><rect x="635" y="395" width="140" height="50" rx="14" fill="#0284c7"/><text x="705" y="428" fill="white">master</text><rect x="885" y="480" width="150" height="50" rx="14" fill="#7c3aed"/><text x="960" y="513" fill="white">develop</text></g><circle cx="705" cy="325" r="57" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle></svg>
