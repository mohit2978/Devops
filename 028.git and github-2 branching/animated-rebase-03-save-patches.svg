<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Save develop patches</title><desc id="d">Git extracts the changes from D1 and D2 into ordered temporary patches.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Step 2: save develop's changes</text><text x="60" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">Git keeps the change introduced by each develop commit, in order.</text><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle"><g fill="#e2e8f0"><rect x="130" y="245" width="180" height="90" rx="18" fill="#4c1d95"/><text x="220" y="299">D1</text><rect x="130" y="385" width="180" height="90" rx="18" fill="#5b21b6"/><text x="220" y="439">D2</text></g><g opacity="0"><rect x="735" y="225" width="350" height="110" rx="20" fill="#172554" stroke="#818cf8" stroke-width="4"/><text x="910" y="270" fill="#c7d2fe">PATCH 1</text><text x="910" y="304" fill="#94a3b8" font-size="18">changes introduced by D1</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;.3;1" dur="5s" repeatCount="indefinite"/></g><g opacity="0"><rect x="735" y="375" width="350" height="110" rx="20" fill="#172554" stroke="#a78bfa" stroke-width="4"/><text x="910" y="420" fill="#ddd6fe">PATCH 2</text><text x="910" y="454" fill="#94a3b8" font-size="18">changes introduced by D2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.42;.68;1" dur="5s" repeatCount="indefinite"/></g></g><g fill="none" stroke-width="5" stroke-dasharray="10 9"><path d="M320 290H720" stroke="#818cf8" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0;0" keyTimes="0;.4;1" dur="5s" repeatCount="indefinite"/></path><path d="M320 430H720" stroke="#a78bfa" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;400;0;0" keyTimes="0;.42;.75;1" dur="5s" repeatCount="indefinite"/></path></g><text x="60" y="555" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">The changes survive; the old commit identities will not.</text></svg>
