  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M860 315H625"/><path d="M625 315H390"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="280" y="275" width="160" height="80" rx="17" fill="#1e293b"/><text x="360" y="324">98ca9</text><rect x="515" y="275" width="160" height="80" rx="17" fill="#1e293b"/><text x="595" y="324">34ac2</text><rect x="750" y="275" width="160" height="80" rx="17" fill="#1e293b"/><text x="830" y="324">f30ab</text></g>
