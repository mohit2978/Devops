<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Animated Git rebase</title><desc id="desc">A feature commit is lifted from a diverging branch and replayed after master as a new commit.</desc>
  <defs><linearGradient id="bgr" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#141827"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#64748b"/></marker><filter id="g"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="650" rx="30" fill="url(#bgr)"/>
  <text x="62" y="72" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">Rebase replays commits onto a new base</text>
  <text x="62" y="111" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">The original feature commit C4 becomes a new commit C4′ after master C3.</text>
  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#ar)"><path d="M965 370H785"/><path d="M785 370H605"/><path d="M605 370H425"/><path d="M425 370H245"/></g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="23" text-anchor="middle" fill="#e2e8f0"><g><rect x="170" y="335" width="150" height="72" rx="16" fill="#1e293b"/><text x="245" y="379">C0</text><rect x="350" y="335" width="150" height="72" rx="16" fill="#1e293b"/><text x="425" y="379">C1</text><rect x="530" y="335" width="150" height="72" rx="16" fill="#1e293b"/><text x="605" y="379">C2</text><rect x="710" y="335" width="150" height="72" rx="16" fill="#075985"/><text x="785" y="379">C3</text></g>
    <g><path d="M605 335C650 245 760 235 830 272" fill="none" stroke="#8b5cf6" stroke-width="5"/><rect x="755" y="202" width="150" height="72" rx="16" fill="#5b21b6"/><text x="830" y="246">C4</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.35;.48;.84;1" dur="9s" repeatCount="indefinite"/></g>
    <g opacity="0"><rect x="890" y="335" width="150" height="72" rx="16" fill="#5b21b6" stroke="#c4b5fd" stroke-width="4"/><text x="965" y="379">C4′</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.52;.65;.9;1" dur="9s" repeatCount="indefinite"/></g>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><rect x="715" y="440" width="140" height="50" rx="14" fill="#0284c7"/><text x="785" y="473" fill="white">master</text><g><rect x="760" y="133" width="140" height="50" rx="14" fill="#7c3aed"/><text x="830" y="166" fill="white">experiment</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;135 307;135 307;0 0" keyTimes="0;.38;.58;.9;1" dur="9s" repeatCount="indefinite"/></g></g>
  <circle cx="830" cy="238" r="52" fill="none" stroke="#c4b5fd" stroke-width="4" opacity="0" filter="url(#g)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.32;.42;.55;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M0 0 C80 -90 175 -30 135 133" dur="9s" repeatCount="indefinite" keyTimes="0;.38;.58;1" keyPoints="0;0;1;1" calcMode="linear"/></circle>
  <text x="62" y="565" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">Rebase gives a linear history, but it rewrites commit identity.</text>
</svg>
