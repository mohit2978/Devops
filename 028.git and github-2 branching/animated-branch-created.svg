<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Create develop branch from master</title><desc id="d">The develop pointer appears beside master at commit f30ab while HEAD remains on master.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/><text x="62" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">1. Create the develop branch</text><text x="62" y="110" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="23">git branch develop</text>
  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M860 315H625"/><path d="M625 315H390"/></g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="280" y="275" width="160" height="80" rx="17" fill="#1e293b"/><text x="360" y="324">98ca9</text><rect x="515" y="275" width="160" height="80" rx="17" fill="#1e293b"/><text x="595" y="324">34ac2</text><rect x="750" y="275" width="160" height="80" rx="17" fill="#1e293b"/><text x="830" y="324">f30ab</text></g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><rect x="760" y="385" width="140" height="50" rx="14" fill="#0284c7"/><text x="830" y="418" fill="white">master</text><g opacity="0"><rect x="920" y="275" width="150" height="50" rx="14" fill="#7c3aed"/><text x="995" y="308" fill="white">develop</text><path d="M920 300H910" stroke="#a78bfa" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.55;1" dur="5s" repeatCount="indefinite"/></g><rect x="760" y="456" width="140" height="48" rx="14" fill="#f59e0b"/><text x="830" y="488" fill="#111827">HEAD</text></g>
  <circle cx="830" cy="315" r="57" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.38;.58;1" dur="5s" repeatCount="indefinite"/></circle>
</svg>
