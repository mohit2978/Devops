<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Bob recovers his work</title><desc id="d">Bob replays only B1 after the new D2 prime, creating B1 prime on the rewritten feature history.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="630" rx="30" fill="url(#b)"/><text x="60" y="65" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">Bob moves only his own work</text><text x="60" y="103" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="19">git rebase --onto origin/feature &lt;old-D2-hash&gt; bob-work</text><g stroke="#64748b" stroke-width="5"><path d="M210 340H360M420 340H570M630 340H780M840 340H990M1050 340H1140"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="21" text-anchor="middle" fill="#e2e8f0"><rect x="70" y="302" width="140" height="76" rx="16" fill="#134e4a"/><text x="140" y="349">C2</text><rect x="280" y="302" width="140" height="76" rx="16" fill="#075985"/><text x="350" y="349">C3</text><rect x="490" y="302" width="140" height="76" rx="16" fill="#4c1d95"/><text x="560" y="349">D1′</text><rect x="700" y="302" width="140" height="76" rx="16" fill="#5b21b6"/><text x="770" y="349">D2′</text><g opacity="0"><rect x="980" y="302" width="140" height="76" rx="16" fill="#991b1b" stroke="#fca5a5" stroke-width="4"/><text x="1050" y="349">B1′</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.65;1" dur="5s" repeatCount="indefinite"/></g></g><g font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><rect x="700" y="215" width="140" height="48" rx="14" fill="#7c3aed"/><text x="770" y="247" fill="white">origin/feature</text><g opacity="0"><rect x="980" y="420" width="140" height="48" rx="14" fill="#b91c1c"/><text x="1050" y="452" fill="white">bob-work</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.4;.68;1" dur="5s" repeatCount="indefinite"/></g></g><path d="M1050 500C900 590 660 560 560 450" fill="none" stroke="#fca5a5" stroke-width="4" stroke-dasharray="12 10" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></path><text x="60" y="560" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">Old D1 and D2 are excluded; only Bob's B1 is replayed as B1′.</text></svg>
