<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d">
  <title id="t">Commit on master after develop diverged</title><desc id="d">A new master commit c2b9e grows upward from f30ab while develop remains on 87ab2.</desc>
