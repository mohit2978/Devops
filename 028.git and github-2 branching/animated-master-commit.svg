  <rect width="1200" height="590" rx="30" fill="url(#bg)"/><text x="62" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">5. Commit on master</text><text x="62" y="110" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="22">The histories now diverge from their common ancestor, f30ab.</text>
  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M700 335H470"/><path d="M470 335H240"/><path d="M970 410L780 350"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="130" y="295" width="160" height="80" rx="17" fill="#1e293b"/><text x="210" y="344">98ca9</text><rect x="360" y="295" width="160" height="80" rx="17" fill="#1e293b"/><text x="440" y="344">34ac2</text><rect x="590" y="295" width="160" height="80" rx="17" fill="#1e293b"/><text x="670" y="344">f30ab</text><rect x="890" y="385" width="160" height="80" rx="17" fill="#4c1d95"/><text x="970" y="434">87ab2</text><g opacity="0"><path d="M670 295L890 218" stroke="#38bdf8" stroke-width="5"/><rect x="850" y="160" width="160" height="80" rx="17" fill="#075985"/><text x="930" y="209">c2b9e</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.3;.58;1" dur="5s" repeatCount="indefinite"/></g></g>
