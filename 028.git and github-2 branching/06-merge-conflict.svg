<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="420" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="95" width="290" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="255" width="290" height="80" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M320,135 L385,175" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M372.1,173.7 L385,175 L378.0,164.0" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M320,295 L385,255" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M378.0,266.0 L385,255 L372.1,256.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="385" y="100" width="300" height="230" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<path d="M685,215 L720,215" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M708.3,220.7 L720,215 L708.3,209.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="720" y="100" width="255" height="230" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Merge conflict — both branches changed the SAME line</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="126.2">master changed line 5 to:</tspan><tspan x="175.0" y="143.8">&lt;h1&gt;Welcome&lt;/h1&gt;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="286.2">develop changed line 5 to:</tspan><tspan x="175.0" y="303.8">&lt;h1&gt;Hello&lt;/h1&gt;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="535" y="122.0">index.html after git merge</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="405" y="187.5">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</tspan><tspan x="405" y="206.2">&lt;h1&gt;Welcome&lt;/h1&gt;</tspan><tspan x="405" y="225.0">=======</tspan><tspan x="405" y="243.8">&lt;h1&gt;Hello&lt;/h1&gt;</tspan><tspan x="405" y="262.5">&gt;&gt;&gt;&gt;&gt;&gt;&gt; develop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="847.5" y="145.0">How to resolve</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="847.5" y="164.2">1. open the file</tspan><tspan x="847.5" y="181.7">2. keep the right text,</tspan><tspan x="847.5" y="199.2">    delete the markers</tspan><tspan x="847.5" y="216.7">3. git add index.html</tspan><tspan x="847.5" y="234.2">4. git commit</tspan><tspan x="847.5" y="251.7"></tspan><tspan x="847.5" y="269.1">or give up:</tspan><tspan x="847.5" y="286.6">git merge --abort</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="375.0">Git can merge different lines automatically — it only stops when the SAME lines were changed differently</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="400.0">git branch --merged  /  git branch --no-merged  → list branches already merged / not yet merged</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="385" y="100" width="300" height="230" rx="12" fill="none" stroke="#e03131" stroke-width="4"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"></g></g>
</svg>