<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Find common ancestor C2</title><desc id="d">Git walks master and develop backwards until both histories meet at C2.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Step 1: find the common ancestor</text><text x="60" y="108" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="21">git merge-base develop master  →  C2</text><g stroke="#64748b" stroke-width="5"><path d="M270 330H450M510 330H690"/><path d="M750 310L930 210M750 350L900 445M1000 445H1090"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="23" text-anchor="middle" fill="#e2e8f0"><rect x="120" y="290" width="150" height="80" rx="17" fill="#1e293b"/><text x="195" y="339">C0</text><rect x="360" y="290" width="150" height="80" rx="17" fill="#1e293b"/><text x="435" y="339">C1</text><rect x="600" y="290" width="150" height="80" rx="17" fill="#134e4a" stroke="#2dd4bf" stroke-width="5"/><text x="675" y="339">C2</text><rect x="855" y="165" width="150" height="80" rx="17" fill="#075985"/><text x="930" y="214">C3</text><rect x="825" y="405" width="150" height="80" rx="17" fill="#4c1d95"/><text x="900" y="454">D1</text><rect x="1040" y="405" width="150" height="80" rx="17" fill="#5b21b6"/><text x="1115" y="454">D2</text></g><g fill="none" stroke="#2dd4bf" stroke-width="5" stroke-dasharray="12 10"><path d="M930 255C900 320 820 350 740 330" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" values="300;0;0" dur="4s" repeatCount="indefinite"/></path><path d="M1115 395C1000 330 850 350 740 330" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" values="420;420;0;0" keyTimes="0;.25;.75;1" dur="4s" repeatCount="indefinite"/></path></g><text x="535" y="420" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">LAST COMMIT SHARED BY BOTH</text></svg>
