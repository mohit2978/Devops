<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Animated branch lifecycle</title><desc id="desc">A develop branch is created, HEAD checks it out, a commit is added, and HEAD returns to master.</desc>
  <defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#94a3b8"/></marker></defs>
  <rect width="1200" height="620" rx="30" fill="url(#b)"/>
  <text x="65" y="75" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">Create → checkout → commit → switch</text>
  <text x="65" y="116" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="22">git branch develop   ·   git checkout develop   ·   git commit   ·   git checkout master</text>
  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M975 360H755"/><path d="M755 360H535"/><path d="M535 360H315"/></g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle"><g fill="#e2e8f0"><rect x="205" y="320" width="150" height="78" rx="17" fill="#1e293b"/><text x="280" y="368">98ca9</text><rect x="425" y="320" width="150" height="78" rx="17" fill="#1e293b"/><text x="500" y="368">34ac2</text><rect x="645" y="320" width="150" height="78" rx="17" fill="#1e293b"/><text x="720" y="368">f30ab</text></g>
    <g opacity="0"><path d="M945 320C930 245 870 222 795 238" fill="none" stroke="#a78bfa" stroke-width="5"/><rect x="870" y="200" width="150" height="78" rx="17" fill="#5b21b6"/><text x="945" y="248" fill="#f5f3ff">87ab2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.43;.52;1" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g><rect x="650" y="425" width="140" height="50" rx="14" fill="#0284c7"/><text x="720" y="458" fill="white">master</text></g>
    <g opacity="0"><rect x="875" y="120" width="140" height="50" rx="14" fill="#7c3aed"/><text x="945" y="153" fill="white">develop</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.2;.28;1" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700"><rect x="60" y="505" width="158" height="54" rx="15" fill="#f59e0b"/><text x="139" y="539" text-anchor="middle" fill="#111827">HEAD</text><animateTransform attributeName="transform" type="translate" values="660,-52;880,-363;880,-363;660,-52" keyTimes="0;.28;.72;1" dur="8s" repeatCount="indefinite"/></g>
  <text x="65" y="580" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">HEAD moves between branch pointers; the commits remain in the graph.</text>
</svg>
