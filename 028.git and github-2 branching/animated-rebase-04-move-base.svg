<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Move develop to master tip</title><desc id="d">The develop pointer moves from D2 to C3 while master stays on C3 and the patches wait for replay.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Step 3: move develop to the new base</text><text x="60" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">Current branch: develop  ·  New base: master C3</text><g stroke="#64748b" stroke-width="5"><path d="M290 320H510M570 320H790M850 320H1050"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="23" text-anchor="middle" fill="#e2e8f0"><rect x="140" y="280" width="150" height="80" rx="17" fill="#1e293b"/><text x="215" y="329">C0</text><rect x="420" y="280" width="150" height="80" rx="17" fill="#1e293b"/><text x="495" y="329">C1</text><rect x="700" y="280" width="150" height="80" rx="17" fill="#134e4a"/><text x="775" y="329">C2</text><rect x="980" y="280" width="150" height="80" rx="17" fill="#075985"/><text x="1055" y="329">C3</text></g><g font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><rect x="980" y="195" width="150" height="48" rx="14" fill="#0284c7"/><text x="1055" y="227" fill="white">master</text><g><rect x="810" y="455" width="150" height="48" rx="14" fill="#7c3aed"/><text x="885" y="487" fill="white">develop</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;170 -65;170 -65" keyTimes="0;.25;.62;1" dur="5s" repeatCount="indefinite"/></g><g><rect x="810" y="515" width="150" height="42" rx="13" fill="#f59e0b"/><text x="885" y="543" fill="#111827">HEAD</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;170 -65;170 -65" keyTimes="0;.25;.62;1" dur="5s" repeatCount="indefinite"/></g></g><path d="M885 440C900 380 960 350 1040 350" fill="none" stroke="#a78bfa" stroke-width="5" stroke-dasharray="210" stroke-dashoffset="210"><animate attributeName="stroke-dashoffset" values="210;210;0;0" keyTimes="0;.25;.62;1" dur="5s" repeatCount="indefinite"/></path><text x="60" y="550" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">master does not move; develop temporarily points to the same C3 commit.</text></svg>
