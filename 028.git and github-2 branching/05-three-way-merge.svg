<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="480.0">3 snapshots are used: ancestor + tip 1 + tip 2  →  “3-way merge”  (Git&#x27;s ort / recursive strategy)</tspan></text>
</g>
