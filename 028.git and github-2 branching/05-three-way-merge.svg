<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.52;0.54;1" dur="13s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="440.0">② compare BOTH tips with the ancestor</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.66;0.68;1" dur="13s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="440.0">③ combine the changes in a new merge commit M</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.97;0.99;1" dur="13s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="440.0">④ master moves to M  (develop stays where it was)</tspan></text></g></g>
