<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Fast-forward master to impfix</title><desc id="d">The master pointer moves from f30ab to 28bd1 without creating a merge commit.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="590" rx="30" fill="url(#b)"/><text x="60" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">3. Fast-forward master</text><text x="60" y="110" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="22">git checkout master  ·  git merge impfix</text><g stroke="#64748b" stroke-width="5"><path d="M300 310H520M580 310H800M860 310H1030"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="150" y="270" width="150" height="80" rx="17" fill="#1e293b"/><text x="225" y="319">98ca9</text><rect x="430" y="270" width="150" height="80" rx="17" fill="#1e293b"/><text x="505" y="319">34ac2</text><rect x="710" y="270" width="150" height="80" rx="17" fill="#1e293b"/><text x="785" y="319">f30ab</text><rect x="970" y="270" width="150" height="80" rx="17" fill="#78350f"/><text x="1045" y="319">28bd1</text></g><g font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><rect x="715" y="395" width="140" height="50" rx="14" fill="#0284c7"/><text x="785" y="428" fill="white">master</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;260 0;260 0" keyTimes="0;.25;.58;1" dur="5s" repeatCount="indefinite"/><rect x="715" y="465" width="140" height="48" rx="14" fill="#f59e0b"/><text x="785" y="497" fill="#111827">HEAD</text></g><rect x="970" y="185" width="150" height="50" rx="14" fill="#d97706"/><text x="1045" y="218" fill="white">impfix</text></g><path d="M785 382H1045" stroke="#38bdf8" stroke-width="5" stroke-dasharray="260" stroke-dashoffset="260"><animate attributeName="stroke-dashoffset" values="260;260;0;0" keyTimes="0;.25;.58;1" dur="5s" repeatCount="indefinite"/></path><text x="60" y="550" fill="#bae6fd" font-family="Inter,Segoe UI,sans-serif" font-size="21">No new commit—only the master pointer moves forward.</text></svg>
