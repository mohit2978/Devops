<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Replay D1 after C3</title><desc id="d">Git applies patch 1 after C3 and creates new commit D1 prime.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="600" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Step 4: replay D1</text><text x="60" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">PATCH 1 is applied after C3, producing the new commit D1′.</text><g stroke="#64748b" stroke-width="5"><path d="M250 320H430M490 320H670M730 320H910"/><path d="M970 320H1100" stroke="#8b5cf6" stroke-dasharray="150" stroke-dashoffset="150"><animate attributeName="stroke-dashoffset" values="150;150;0;0" keyTimes="0;.3;.6;1" dur="5s" repeatCount="indefinite"/></path></g><g font-family="ui-monospace,Consolas,monospace" font-size="23" text-anchor="middle" fill="#e2e8f0"><rect x="100" y="280" width="150" height="80" rx="17" fill="#1e293b"/><text x="175" y="329">C0</text><rect x="340" y="280" width="150" height="80" rx="17" fill="#1e293b"/><text x="415" y="329">C1</text><rect x="580" y="280" width="150" height="80" rx="17" fill="#134e4a"/><text x="655" y="329">C2</text><rect x="820" y="280" width="150" height="80" rx="17" fill="#075985"/><text x="895" y="329">C3</text><g opacity="0"><rect x="1050" y="280" width="140" height="80" rx="17" fill="#5b21b6" stroke="#c4b5fd" stroke-width="4"/><text x="1120" y="329">D1′</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.62;1" dur="5s" repeatCount="indefinite"/></g></g><g font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><rect x="820" y="195" width="150" height="48" rx="14" fill="#0284c7"/><text x="895" y="227" fill="white">master</text><g><rect x="820" y="420" width="150" height="48" rx="14" fill="#7c3aed"/><text x="895" y="452" fill="white">develop</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;225 0;225 0" keyTimes="0;.3;.65;1" dur="5s" repeatCount="indefinite"/></g></g><text x="60" y="540" fill="#ddd6fe" font-family="Inter,Segoe UI,sans-serif" font-size="20">D1′ has D1's changes, but a new parent and therefore a new hash.</text></svg>
