<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Alice publishes feature</title><desc id="d">Alice pushes D1 and D2 to origin while Bob has not fetched them.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="620" rx="30" fill="url(#b)"/><text x="60" y="65" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">Alice pushes feature to origin</text><text x="60" y="103" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="20">git push -u origin feature</text><g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><text x="230" y="175" fill="#c4b5fd" font-size="26" font-weight="700">ALICE</text><text x="600" y="175" fill="#38bdf8" font-size="26" font-weight="700">ORIGIN</text><text x="970" y="175" fill="#94a3b8" font-size="26" font-weight="700">BOB</text></g><g stroke="#64748b" stroke-width="5"><path d="M100 340H200M260 340H360"/><path d="M470 340H570M630 340H730" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.65;1" dur="5s" repeatCount="indefinite"/></path></g><g font-family="ui-monospace,Consolas,monospace" font-size="22" text-anchor="middle" fill="#e2e8f0"><rect x="40" y="302" width="120" height="76" rx="15" fill="#134e4a"/><text x="100" y="349">C2</text><rect x="200" y="302" width="120" height="76" rx="15" fill="#4c1d95"/><text x="260" y="349">D1</text><rect x="360" y="302" width="120" height="76" rx="15" fill="#5b21b6"/><text x="420" y="349">D2</text><g opacity="0"><rect x="410" y="302" width="120" height="76" rx="15" fill="#134e4a"/><text x="470" y="349">C2</text><rect x="570" y="302" width="120" height="76" rx="15" fill="#4c1d95"/><text x="630" y="349">D1</text><rect x="730" y="302" width="120" height="76" rx="15" fill="#5b21b6"/><text x="790" y="349">D2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.65;1" dur="5s" repeatCount="indefinite"/></g><rect x="910" y="302" width="120" height="76" rx="15" fill="#134e4a"/><text x="970" y="349">C2</text></g><path d="M430 250H730" stroke="#a78bfa" stroke-width="6" stroke-dasharray="14 10" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" values="300;0;0" dur="5s" repeatCount="indefinite"/></path><text x="970" y="420" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="19">feature not fetched yet</text></svg>
