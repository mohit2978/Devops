<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="90" width="180" height="170" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="216" y="90" width="180" height="170" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="412" y="90" width="180" height="170" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="608" y="90" width="180" height="170" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="804" y="90" width="180" height="170" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M110,275 Q205,320 300,275" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M291.8,285.1 L300,275 L287.0,274.9" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M502,275 Q407,320 312,275" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M325.0,274.9 L312,275 L320.2,285.1" fill="none" stroke="#1971c2" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Resources that create &amp; manage pods</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="110.0" y="160.0">ReplicationController</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="110.0" y="177.2">outdated: equality</tspan><tspan x="110.0" y="192.2">labels only</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="306.0" y="160.0">ReplicaSet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="306.0" y="177.2">keeps N pods running;</tspan><tspan x="306.0" y="192.2">set-based selectors</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="502.0" y="152.5">Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="502.0" y="169.8">manages ReplicaSets:</tspan><tspan x="502.0" y="184.8">rolling update, rollback</tspan><tspan x="502.0" y="199.8">← use this for apps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="698.0" y="160.0">DaemonSet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="698.0" y="177.2">1 pod on EVERY node</tspan><tspan x="698.0" y="192.2">(log / monitoring agents)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="894.0" y="160.0">StatefulSet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="894.0" y="177.2">stable names + own</tspan><tspan x="894.0" y="192.2">volume (databases)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="205" y="318.0">replaced by</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1971c2" font-weight="normal"><tspan x="407" y="318.0">creates &amp; manages</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="360.0">all of them give self-healing: if a pod dies, the controller creates a new one</tspan></text>
</g>
</svg>