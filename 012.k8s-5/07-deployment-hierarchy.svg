<path d="M780,257 L730,257" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M741.7,251.3 L730,257 L741.7,262.7" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M800,315 Q620,345 445,305" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M457.7,302.1 L445,305 L455.2,313.1" fill="none" stroke="#e8590c" stroke-width="2"/>
<rect x="780" y="80" width="200" height="60" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
