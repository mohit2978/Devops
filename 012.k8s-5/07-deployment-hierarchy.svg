<path d="M348.3,262.7 L360,257 L348.3,251.3" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="560" y="210" width="170" height="95" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M280,257 L560,257" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M548.3,262.7 L560,257 L548.3,251.3" fill="none" stroke="#495057" stroke-width="2"/>
