</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Deployment → ReplicaSet → Pods  (+ Service in front)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="155.0" y="112.5">Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="155.0" y="131.7">javawebdeploy</tspan><tspan x="155.0" y="146.7">strategy, rollout history</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="155.0" y="242.5">ReplicaSet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="155.0" y="261.7">javawebdeploy-7c9f…</tspan><tspan x="155.0" y="276.7">keeps replicas = 2</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="165" y="192.0">creates &amp; manages</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="445.0" y="243.8">Pod 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="445.0" y="260.4">label app=javawebapp</tspan><tspan x="445.0" y="274.1">container :8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="645.0" y="243.8">Pod 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="645.0" y="260.4">label app=javawebapp</tspan><tspan x="645.0" y="274.1">container :8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="880.0" y="236.9">Service javawebsvc</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="880.0" y="253.5">type LoadBalancer</tspan><tspan x="880.0" y="267.2">selector app=javawebapp</tspan><tspan x="880.0" y="281.0">port 80 → 8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="880.0" y="110.0">users → AWS LB URL</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="355.0">you create ONLY the Deployment; it creates the ReplicaSet, which creates the pods</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="385.0">Deployment adds on top of ReplicaSet: rolling updates, rollback (revision history), pause/resume</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="413.0">the Service finds pods by LABEL, so it doesn&#x27;t care which ReplicaSet / version created them</tspan></text>
</g>
</svg>