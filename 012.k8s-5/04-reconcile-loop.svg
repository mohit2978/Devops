<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="60" y="150" width="220" height="100" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="390" y="130" width="220" height="140" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="720" y="150" width="220" height="100" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M280,200 L390,200" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M378.3,205.7 L390,200 L378.3,194.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M720,200 L610,200" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M621.7,194.3 L610,200 L621.7,205.7" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M500,130 C500,80 830,80 830,145" fill="none" stroke="#495057" stroke-width="1.8" stroke-dasharray="8 6"/>
<path d="M824.3,136.3 L830,148 L835.7,136.3" fill="none" stroke="#495057" stroke-width="1.8"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">How a ReplicaSet works: desired state vs actual state</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="170.0" y="183.8">desired</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="170.0" y="203.6">replicas: 2</tspan><tspan x="170.0" y="219.8">(from your YAML)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="177.5">ReplicaSet controller</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="194.8">counts pods with</tspan><tspan x="500.0" y="209.8">label app=javawebapp</tspan><tspan x="500.0" y="224.8">and compares</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="830.0" y="191.9">actual</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="830.0" y="211.7">pods running now</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="315.0">fewer than desired → create pods   •   more than desired → delete pods   •   equal → do nothing</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="345.0">this loop never stops: deleting a pod, a node crash, or kubectl scale all just change one side</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="bold"><tspan x="665" y="75.0">create / delete pods</tspan></text>
</g>
</svg>