<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="460" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="75" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="116" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="157" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="198" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="239" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="280" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="321" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="362" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="403" width="460" height="34" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Helm commands you&#x27;ll use</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="92.0">helm repo add &lt;name&gt; &lt;url&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="92.0">register a chart repository</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="133.0">helm repo update</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="133.0">refresh the list of charts</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="174.0">helm search repo grafana</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="174.0">find charts</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="215.0">helm install &lt;release&gt; &lt;repo/chart&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="215.0">install a chart → creates a release</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="256.0">helm upgrade --install &lt;release&gt; &lt;chart&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="256.0">install if missing, otherwise upgrade</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="297.0">helm list  (-A)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="297.0">list releases</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="338.0">helm rollback &lt;release&gt; &lt;revision&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="338.0">go back to an older revision</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="379.0">helm uninstall &lt;release&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="379.0">delete everything the release created</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="420.0">helm show values &lt;chart&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="510" y="420.0">see the settings you can override</tspan></text>
</g>
</svg>