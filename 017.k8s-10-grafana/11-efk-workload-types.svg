<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="90" width="310" height="170" rx="12" fill="#96f2d7" stroke="#1e1e1e" stroke-width="2"/>
<rect x="345" y="90" width="310" height="170" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="90" width="310" height="170" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Why each EFK part uses a different workload type</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="175.0" y="150.6">Fluentd → DaemonSet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="169.2">must run on EVERY node, because</tspan><tspan x="175.0" y="185.4">each node has its own log files;</tspan><tspan x="175.0" y="201.7">new node → new Fluentd pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="150.6">Elasticsearch → StatefulSet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="169.2">it&#x27;s a database: needs stable</tspan><tspan x="500.0" y="185.4">names (es-0, es-1) and its own</tspan><tspan x="500.0" y="201.7">persistent disk (PVC) per pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="825.0" y="150.6">Kibana → Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="825.0" y="169.2">stateless web UI: any replica</tspan><tspan x="825.0" y="185.4">can serve, easy to scale and</tspan><tspan x="825.0" y="201.7">update</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="300.0">ELK = Elasticsearch + Logstash + Kibana • EFK swaps Logstash for Fluentd (lighter, K8s-native; Fluent Bit even lighter)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="330.0">commercial alternatives: Splunk, Datadog • Grafana&#x27;s own: Loki + Promtail</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="365.0">EFK = application LOGS • Prometheus + Grafana = METRICS</tspan></text>
</g>
</svg>