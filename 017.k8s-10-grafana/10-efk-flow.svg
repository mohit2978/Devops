<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">EFK — centralized logging</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="bold"><tspan x="170" y="100.0">worker node 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="95.0" y="132.1">microservice 1</tspan><tspan x="95.0" y="145.9">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="245.0" y="132.1">Fluentd</tspan><tspan x="245.0" y="145.9">(DaemonSet)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="bold"><tspan x="170" y="205.0">worker node 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="95.0" y="237.1">microservice 2</tspan><tspan x="95.0" y="250.9">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="245.0" y="237.1">Fluentd</tspan><tspan x="245.0" y="250.9">(DaemonSet)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="bold"><tspan x="170" y="310.0">worker node 3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="95.0" y="342.1">microservice 3</tspan><tspan x="95.0" y="355.9">pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="245.0" y="342.1">Fluentd</tspan><tspan x="245.0" y="355.9">(DaemonSet)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="240" y="425.0">reads /var/log/containers/*.log on its node</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="540.0" y="212.5">Elasticsearch</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="540.0" y="229.1">(StatefulSet + PVC)</tspan><tspan x="540.0" y="242.9">stores &amp; INDEXES logs</tspan><tspan x="540.0" y="256.6">= the log lake,</tspan><tspan x="540.0" y="270.4">searchable</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="850.0" y="212.5">Kibana</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="850.0" y="229.1">(Deployment)</tspan><tspan x="850.0" y="242.9">web UI: search, filter</tspan><tspan x="850.0" y="256.6">by pod / namespace,</tspan><tspan x="850.0" y="270.4">charts</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="860.0" y="370.0">you</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e8590c" font-weight="bold"><tspan x="370" y="200.0">index</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="455.0">20 pods → 20 × kubectl logs is impossible; EFK puts every pod&#x27;s logs in ONE searchable place</tspan></text>
