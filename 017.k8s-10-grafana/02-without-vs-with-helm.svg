<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="470" height="280" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="45" y="125" width="200" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="260" y="125" width="200" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="175" width="200" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="260" y="175" width="200" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="45" y="225" width="200" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="260" y="225" width="200" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="75" width="470" height="280" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="540" y="125" width="410" height="85" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="540" y="225" width="410" height="85" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Without Helm vs with Helm</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="255" y="98.0">✗ without Helm</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="145.0" y="144.0">deployment.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="360.0" y="144.0">service.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="145.0" y="194.0">configmap.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="360.0" y="194.0">serviceaccount.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="145.0" y="244.0">clusterrole.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="360.0" y="244.0">… 15 more</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="normal"><tspan x="255" y="291.9">write / download each YAML, kubectl apply</tspan><tspan x="255" y="308.1">them one by one, delete them one by one</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="745" y="98.0">✓ with Helm</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="745.0" y="160.0">chart = all those YAMLs as templates</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="745.0" y="176.6">+ values.yaml with the settings you can change</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="556" y="253.0">$ helm install grafana grafana/grafana</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="556" y="279.0">$ helm uninstall grafana</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="395.0">like apt / yum for Linux — but the “packages” are sets of Kubernetes manifests</tspan></text>
</g>
</svg>