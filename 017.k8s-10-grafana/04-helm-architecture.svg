</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Helm architecture (Helm 3)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="160" y="121.2">chart repository</tspan><tspan x="160" y="138.8">(internet)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="160.0" y="262.5">helm client</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="160.0" y="279.8">on the EKS host VM</tspan><tspan x="160.0" y="294.8">uses ~/.kube/config</tspan><tspan x="160.0" y="309.8">(same as kubectl)</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="150" y="205.0">helm repo add / pull</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="675" y="100.0">Kubernetes cluster</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="510.0" y="165.0">API server</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal"><tspan x="300" y="323.1">renders templates</tspan><tspan x="300" y="336.9">→ sends manifests</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="147.5">Deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="207.5">Service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="267.5">ConfigMap</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="510.0" y="287.5">release record</tspan><tspan x="510.0" y="302.5">(a Secret)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="675" y="385.0">Helm 3 has no server part (Helm 2&#x27;s &#x27;Tiller&#x27; is gone) — the client talks straight to the API server</tspan></text>
</g>
</svg>