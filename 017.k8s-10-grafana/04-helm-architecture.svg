<path d="M280,285 L410,170" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M405.0,182.0 L410,170 L397.5,173.5" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
