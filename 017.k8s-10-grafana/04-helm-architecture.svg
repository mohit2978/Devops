<path d="M154.3,218.3 L160,230 L165.7,218.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="380" y="80" width="590" height="280" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
