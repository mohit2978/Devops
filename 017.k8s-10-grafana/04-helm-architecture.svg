<path d="M689.6,154.8 L700,147 L687.4,143.8" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="700" y="185" width="240" height="45" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M610,165 L700,207" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M687.0,207.2 L700,207 L691.8,196.9" fill="none" stroke="#495057" stroke-width="2"/>
