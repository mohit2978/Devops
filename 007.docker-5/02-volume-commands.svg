<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="75" width="520" height="38" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="122" width="520" height="38" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="169" width="520" height="38" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="216" width="520" height="38" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="263" width="520" height="38" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="310" width="520" height="38" rx="6" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker volume commands</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="94.0">docker volume ls</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="570" y="94.0">list volumes</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="141.0">docker volume create dbdata</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="570" y="141.0">create a named volume</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="188.0">docker volume inspect dbdata</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="570" y="188.0">shows Mountpoint: /var/lib/docker/volumes/dbdata/_data</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="235.0">docker run -d -v dbdata:/var/lib/mysql mysql:8.0</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="570" y="235.0">use it (created automatically if missing)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="282.0">docker volume rm dbdata</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="570" y="282.0">delete (only when no container uses it)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12.5" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="45" y="329.0">docker volume prune  /  docker system prune --volumes</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="normal"><tspan x="570" y="329.0">delete ALL unused volumes ⚠ data gone</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="375.0">removing a container never deletes its named volume — you delete volumes explicitly</tspan></text>
</g>
</svg>