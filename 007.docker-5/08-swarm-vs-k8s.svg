<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="420" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="220" y="75" width="370" height="38" rx="6" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="75" width="370" height="38" rx="6" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="120" width="190" height="38" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="120" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="120" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="164" width="190" height="38" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="164" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="164" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="208" width="190" height="38" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="208" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="208" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="252" width="190" height="38" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="252" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="252" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="296" width="190" height="38" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="296" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="296" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="340" width="190" height="38" rx="6" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="340" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="340" width="370" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker Swarm vs Kubernetes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="405.0" y="94.0">Docker Swarm</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="785.0" y="94.0">Kubernetes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="139.0">setup</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="139.0">very easy (swarm init / join)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="139.0">more complex (EKS makes it easier)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="183.0">unit</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="183.0">service → tasks (containers)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="183.0">Deployment → ReplicaSet → pods</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="227.0">scaling</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="227.0">manual: docker service scale</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="227.0">manual + AUTOMATIC (HPA)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="271.0">self-healing</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="271.0">✓ replaces failed tasks</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="271.0">✓ + probes, rolling updates, rollback</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="315.0">ecosystem</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="315.0">small</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="315.0">huge: Helm, Prometheus, ingress…</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="115.0" y="359.0">industry use</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="359.0">rare</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="359.0">the standard (EKS, AKS, GKE)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="400.0">Swarm&#x27;s big drawback: no automatic scaling based on load — that&#x27;s why we move to Kubernetes</tspan></text>
</g>
</svg>