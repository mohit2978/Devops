<path d="M294.2,138.6 L300,127 L287.3,129.7" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="300" y="200" width="420" height="105" rx="14" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="240" width="170" height="50" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M160,235 L300,252" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M287.7,256.2 L300,252 L289.1,245.0" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="300" y="325" width="420" height="105" rx="14" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="330" y="365" width="170" height="50" rx="12" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M160,235 L300,377" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M287.8,372.6 L300,377 L295.8,364.7" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M560,365 Q640,330 560,295" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M573.0,294.5 L560,295 L568.5,304.9" fill="none" stroke="#e8590c" stroke-width="2"/>
<rect x="750" y="80" width="230" height="170" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">A swarm service: replicas spread over nodes + routing mesh</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="227.5">browser</tspan><tspan x="90.0" y="242.5">any-node-ip:8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="510" y="93.0">manager  •  port 8080 open (routing mesh)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="415.0" y="140.0">java-web-app.1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="510" y="218.0">worker 1  •  port 8080 open (routing mesh)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="415.0" y="265.0">java-web-app.2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="510" y="343.0">worker 2  •  port 8080 open (routing mesh)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="415.0" y="390.0">no replica here</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#e8590c" font-weight="normal"><tspan x="735" y="323.1">mesh forwards to a</tspan><tspan x="735" y="336.9">node with a replica</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#adb5bd" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="104.0">service java-web-app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="125.0">mode: replicated</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="146.0">replicas: 2</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="167.0"></tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#adb5bd" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="188.0">scale:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="209.0">docker service scale</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="766" y="230.0">  java-web-app=4</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="440.0">service = one or more containers (tasks) of the SAME image • a dead container is replaced automatically</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="465.0">http://&lt;any-node-public-ip&gt;:8080/java-web-app/ works — not only the manager&#x27;s IP</tspan></text>
</g>
</svg>