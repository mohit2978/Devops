<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="80" width="420" height="190" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="500" y="75" width="480" height="300" rx="16" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="530" y="120" width="200" height="110" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="530" y="260" width="420" height="90" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M630,230 L630,260" fill="none" stroke="#e8590c" stroke-width="3"/>
<path d="M624.3,248.3 L630,260 L635.7,248.3" fill="none" stroke="#e8590c" stroke-width="3"/>
<path d="M635.7,241.7 L630,230 L624.3,241.7" fill="none" stroke="#e8590c" stroke-width="3"/>
<rect x="770" y="120" width="180" height="110" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Making MySQL stateful in docker-compose (bind mount)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="106.0">  mysqldb:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="129.0">    image: mysql:5.7</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="152.0">    environment:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="175.0">      - MYSQL_ROOT_PASSWORD=root</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="198.0">      - MYSQL_DATABASE=sbms</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="221.0">    volumes:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="244.0">      - ./app:/var/lib/mysql</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="740" y="95.0">EC2 host</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="630.0" y="160.0">mysqldb container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="630.0" y="176.6">writes DB files to</tspan><tspan x="630.0" y="191.6">/var/lib/mysql</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="740.0" y="290.0">/home/ec2-user/app   ( ./app )</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="740.0" y="306.6">host folder created with mkdir app —</tspan><tspan x="740.0" y="321.6">the REAL location of the DB files</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="860.0" y="152.5">after down + up</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="860.0" y="169.1">new container,</tspan><tspan x="860.0" y="184.1">same folder →</tspan><tspan x="860.0" y="199.1">data still there ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="240" y="305.0">host path : container path</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="240" y="327.5">./app = &#x27;app&#x27; folder next to</tspan><tspan x="240" y="342.5">the docker-compose.yml</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="415.0">⚠ the notes had  .app:/var/lib/mysql  — a relative host path must start with ./  (./app)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="445.0">named-volume alternative:  - dbdata:/var/lib/mysql   + top-level  volumes: { dbdata: }</tspan></text>
</g>
</svg>