<ellipse cx="234" cy="95" rx="15" ry="15" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M198,170 L216,170" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M204.3,175.7 L216,170 L204.3,164.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="412" y="95" width="178" height="150" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="430" cy="95" rx="15" ry="15" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
