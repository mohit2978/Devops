<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="500" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="190" width="150" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="260" y="160" width="240" height="130" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M180,225 L260,225" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M248.3,230.7 L260,225 L248.3,219.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="620" y="80" width="350" height="150" rx="14" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="645" y="130" width="140" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="800" y="130" width="140" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M500,225 L620,155" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M612.7,165.8 L620,155 L607.0,156.0" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<rect x="620" y="280" width="350" height="150" rx="14" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<rect x="645" y="330" width="140" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="800" y="330" width="140" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M500,225 L620,355" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M607.9,350.2 L620,355 L616.2,342.6" fill="none" stroke="#1971c2" stroke-width="2.5"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker Swarm cluster: 1 manager + 2 workers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="105.0" y="216.9">you</tspan><tspan x="105.0" y="233.1">(docker service …)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="380.0" y="197.5">manager (master)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="380.0" y="214.1">EC2 #1</tspan><tspan x="380.0" y="227.9">docker swarm init</tspan><tspan x="380.0" y="241.6">schedules tasks, keeps</tspan><tspan x="380.0" y="255.4">desired state</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="795" y="100.0">worker 1  (EC2 #2)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="715.0" y="157.5">container</tspan><tspan x="715.0" y="172.5">(task)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="870.0" y="157.5">container</tspan><tspan x="870.0" y="172.5">(task)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="795" y="300.0">worker 2  (EC2 #3)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="715.0" y="357.5">container</tspan><tspan x="715.0" y="372.5">(task)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="870.0" y="357.5">container</tspan><tspan x="870.0" y="372.5">(task)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="560" y="160.0">TCP 2377</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="455.0">manager receives the task and assigns containers to workers (the manager can run containers too)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="normal"><tspan x="500" y="482.0">with ONE manager the manager is a single point of failure → production uses 3 or 5 managers</tspan></text>
</g>
</svg>