<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker + Jenkins + Kubernetes — how the 3 work together</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="80.0" y="226.9">developer</tspan><tspan x="80.0" y="243.1">git push</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="240.0" y="226.2">GitHub</tspan><tspan x="240.0" y="243.8">(code)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e8590c" font-weight="bold"><tspan x="505" y="102.0">JENKINS — CI/CD (the automation robot)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="139.0">1. checkout code</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="189.0">2. build + test (Maven)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="239.0">3. docker build → image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="289.0">4. docker push → registry</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="339.0">5. kubectl apply → deploy</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="847.5" y="112.5">DOCKER — containerization</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="847.5" y="129.1">packs app + dependencies into</tspan><tspan x="847.5" y="144.1">an IMAGE; runs it as a</tspan><tspan x="847.5" y="159.1">CONTAINER anywhere</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="847.5" y="287.5">KUBERNETES — orchestration</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="847.5" y="304.1">runs MANY containers on many</tspan><tspan x="847.5" y="319.1">servers: scaling, load balancing,</tspan><tspan x="847.5" y="334.1">self-healing, rolling updates</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="415.0">Docker = HOW the app is packaged • Jenkins = WHEN/HOW it&#x27;s built &amp; shipped • Kubernetes = WHERE/HOW it runs at scale</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="443.0">together they automate the full path: code commit → tested build → container image → running in production</tspan></text>
</g>
</svg>