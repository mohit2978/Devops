<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker architecture: Dockerfile → image → registry → container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="105.0" y="189.4">Dockerfile</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="105.0" y="206.7">recipe: base image,</tspan><tspan x="105.0" y="220.4">copy code, install deps,</tspan><tspan x="105.0" y="234.2">start command</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="355.0" y="189.4">Docker image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="355.0" y="206.7">read-only package:</tspan><tspan x="355.0" y="220.4">code + dependencies</tspan><tspan x="355.0" y="234.2">(in layers)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="230" y="195.0">build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="230" y="235.0">docker build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="355" y="366.9">Docker Hub / registry</tspan><tspan x="355" y="383.1">(ECR, Nexus…)</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#e8590c" font-weight="bold"><tspan x="320" y="295.0">push</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#6741d9" font-weight="bold"><tspan x="395" y="295.0">pull</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="655.0" y="111.2">container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="655.0" y="127.9">running on</tspan><tspan x="655.0" y="141.6">laptop (Mac/Windows)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="655.0" y="216.2">container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="655.0" y="232.9">running on</tspan><tspan x="655.0" y="246.6">test server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="655.0" y="321.2">container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="655.0" y="337.9">running on</tspan><tspan x="655.0" y="351.6">AWS EC2 (Linux)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="500" y="160.0">run</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="885.0" y="177.5">on any machine</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="885.0" y="194.8"></tspan><tspan x="885.0" y="209.8">1. install Docker</tspan><tspan x="885.0" y="224.8">2. docker pull image</tspan><tspan x="885.0" y="239.8">3. docker run image</tspan><tspan x="885.0" y="254.8"></tspan><tspan x="885.0" y="269.8">no Java / Python</tspan><tspan x="885.0" y="284.8">install needed!</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="440.0">image = class (template) • container = object (running instance): one image → many containers</tspan></text>
</g>
</svg>