<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="75" width="270" height="280" rx="14" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
<path d="M30,120 L300,120" fill="none" stroke="#e03131" stroke-width="2"/>
<rect x="540" y="75" width="430" height="125" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="560" y="115" width="120" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="695" y="115" width="120" height="60" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="830" y="115" width="120" height="60" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="540" y="225" width="430" height="125" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="560" y="265" width="120" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="695" y="265" width="120" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="830" y="265" width="120" height="60" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">The dependency problem Docker solves</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#e03131" font-weight="bold"><tspan x="165" y="100.0">Application Code</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="normal"><tspan x="165" y="150.0">Tomcat 9</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="normal"><tspan x="165" y="188.0">Java 17</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="normal"><tspan x="165" y="226.0">Angular 16</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="normal"><tspan x="165" y="264.0">MySQL 8</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="normal"><tspan x="165" y="302.0">OS (Linux)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold"><tspan x="320" y="242.5">} dependencies:</tspan><tspan x="320" y="260.0">software needed to</tspan><tspan x="320" y="277.5">RUN the software</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold"><tspan x="755" y="95.0">✗ without Docker</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="620.0" y="136.9">DEV</tspan><tspan x="620.0" y="153.1">Java 17 ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="755.0" y="136.9">SIT</tspan><tspan x="755.0" y="153.1">Java 11 ✗</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="890.0" y="136.9">PROD</tspan><tspan x="890.0" y="153.1">Java 21 ✗</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="755" y="245.0">✓ with Docker: one image, same versions</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="620.0" y="286.9">DEV</tspan><tspan x="620.0" y="303.1">image v1 ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="755.0" y="286.9">SIT</tspan><tspan x="755.0" y="303.1">image v1 ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="890.0" y="286.9">PROD</tspan><tspan x="890.0" y="303.1">image v1 ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="395.0">the image carries its dependencies with it → no “but it worked on my machine”</tspan></text>
</g>
</svg>