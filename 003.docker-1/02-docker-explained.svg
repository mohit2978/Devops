<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="380" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="90" width="260" height="200" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="350" y="90" width="260" height="200" rx="14" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="375" y="128" width="210" height="32" rx="6" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="375" y="166" width="210" height="32" rx="6" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="375" y="204" width="210" height="32" rx="6" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="375" y="242" width="210" height="32" rx="6" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M610,190 L660,190" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M648.3,195.7 L660,190 L648.3,184.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="660" y="95" width="140" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="660" y="160" width="140" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="660" y="225" width="140" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="820" y="95" width="160" height="180" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Docker — package once, run anywhere</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="160.0" y="141.2">without Docker</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="160.0" y="159.8"></tspan><tspan x="160.0" y="176.0">install Java 17, Tomcat, MySQL…</tspan><tspan x="160.0" y="192.3">on EVERY machine by hand</tspan><tspan x="160.0" y="208.5"></tspan><tspan x="160.0" y="224.8">✗ version mismatches</tspan><tspan x="160.0" y="241.0">✗ “works on my machine”</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold"><tspan x="480" y="110.0">Docker IMAGE</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="480.0" y="144.0">your app (jar)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="480.0" y="182.0">Java 17 + Tomcat</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="480.0" y="220.0">libraries</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="480.0" y="258.0">base OS files</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="635" y="175.0">run</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="730.0" y="113.5">container</tspan><tspan x="730.0" y="128.5">on laptop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="730.0" y="178.5">container</tspan><tspan x="730.0" y="193.5">on test server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="730.0" y="243.5">container</tspan><tspan x="730.0" y="258.5">on AWS EC2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="900.0" y="147.5">same result</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="900.0" y="164.8">identical everywhere</tspan><tspan x="900.0" y="179.8"></tspan><tspan x="900.0" y="194.8">only Docker needs</tspan><tspan x="900.0" y="209.8">to be installed</tspan><tspan x="900.0" y="224.8">on the machine</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="330.0">container = running image: an isolated process with its own files, network and limits, sharing the host&#x27;s kernel</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="358.0">Docker = containerization software: it BUILDS images and RUNS containers on one machine</tspan></text>
</g>
</svg>