<rect x="180" y="140" width="140" height="100" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="338" y="140" width="140" height="100" rx="12" fill="#96f2d7" stroke="#1e1e1e" stroke-width="2"/>
<path d="M320,190 L338,190" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M326.3,195.7 L338,190 L326.3,184.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="496" y="140" width="140" height="100" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M478,190 L496,190" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M484.3,195.7 L496,190 L484.3,184.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="654" y="140" width="140" height="100" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M636,190 L654,190" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M642.3,195.7 L654,190 L642.3,184.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="812" y="140" width="140" height="100" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M794,190 L812,190" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M800.3,195.7 L812,190 L800.3,184.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M180,128 L180,115 L654,115 L654,128" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M656,128 L656,115 L956,115 L956,128" fill="none" stroke="#2f9e44" stroke-width="2.5"/>
<rect x="180" y="265" width="770" height="44" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Jenkins — the CI/CD automation server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="80.0" y="190.0">git push</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="250.0" y="182.5">Build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="250.0" y="200.4">mvn package</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="408.0" y="182.5">Test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="408.0" y="200.4">unit tests</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="566.0" y="182.5">Quality</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="566.0" y="200.4">SonarQube</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="724.0" y="175.0">Image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="724.0" y="192.9">docker build</tspan><tspan x="724.0" y="207.9">&amp; push</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="882.0" y="175.0">Deploy</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="882.0" y="192.9">DEV → SIT →</tspan><tspan x="882.0" y="207.9">UAT → PROD</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="417" y="100.0">CI — Continuous Integration</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="806" y="100.0">CD — Continuous Delivery</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="565.0" y="287.0">any stage fails → pipeline stops, team gets notified, nothing broken reaches users</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="345.0">Jenkins = CI/CD software: on every commit it runs the same steps automatically, instead of a human doing them</tspan></text>
</g>
</svg>