<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="25" y="90" width="170" height="130" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="220" y="90" width="170" height="130" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M195,155 L220,155" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M208.3,160.7 L220,155 L208.3,149.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="415" y="90" width="170" height="130" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M390,155 L415,155" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M403.3,160.7 L415,155 L403.3,149.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="90" width="170" height="130" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M585,155 L610,155" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M598.3,160.7 L610,155 L598.3,149.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="805" y="90" width="170" height="130" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M780,155 L805,155" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M793.3,160.7 L805,155 L793.3,149.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="25" y="250" width="950" height="50" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Application environments — the road to production</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="110.0" y="125.0">DEV</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="110.0" y="145.5">developers</tspan><tspan x="110.0" y="160.5"></tspan><tspan x="110.0" y="175.5">code integration</tspan><tspan x="110.0" y="190.5">testing</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="305.0" y="125.0">SIT</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="305.0" y="145.5">testers (QA)</tspan><tspan x="305.0" y="160.5"></tspan><tspan x="305.0" y="175.5">system integration</tspan><tspan x="305.0" y="190.5">testing</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="125.0">UAT</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="145.5">client team</tspan><tspan x="500.0" y="160.5"></tspan><tspan x="500.0" y="175.5">acceptance testing</tspan><tspan x="500.0" y="190.5">→ Go / No-Go</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="695.0" y="125.0">PILOT</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="695.0" y="145.5">ops / client</tspan><tspan x="695.0" y="160.5"></tspan><tspan x="695.0" y="175.5">pre-production</tspan><tspan x="695.0" y="190.5">final check</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="890.0" y="125.0">PROD</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="890.0" y="145.5">end users</tspan><tspan x="890.0" y="160.5"></tspan><tspan x="890.0" y="175.5">LIVE application</tspan><tspan x="890.0" y="190.5">(real customers)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="275.0">every environment needs the SAME dependencies (Java, Tomcat, DB client…) with the SAME versions</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="335.0">installing them by hand 5 times → mistakes &amp; version mismatches  →  ship ONE Docker image to every environment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="365.0">SIT = System Integration Testing • UAT = User Acceptance Testing</tspan></text>
</g>
</svg>