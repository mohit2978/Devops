<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="110" width="145" height="80" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="205" y="110" width="145" height="80" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M175,150 L205,150" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M193.3,155.7 L205,150 L193.3,144.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="380" y="110" width="145" height="80" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M350,150 L380,150" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M368.3,155.7 L380,150 L368.3,144.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="80" width="410" height="250" rx="16" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="585" y="125" width="360" height="40" rx="6" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="585" y="175" width="360" height="135" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="610" y="210" width="310" height="85" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="680" y="240" width="170" height="40" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M495,150 L680,255" fill="none" stroke="#e8590c" stroke-width="2.5"/>
<path d="M667.0,254.1 L680,255 L672.6,244.3" fill="none" stroke="#e8590c" stroke-width="2.5"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Dockerizing a Java web app (.war on Tomcat)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="102.5" y="141.9">java source</tspan><tspan x="102.5" y="158.1">(src/)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="277.5" y="141.9">byte code</tspan><tspan x="277.5" y="158.1">.class files</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="452.5" y="141.9">app.war</tspan><tspan x="452.5" y="158.1">(target/)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="190" y="168.0">javac</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="205" y="90.0">mvn clean package does both steps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="765" y="100.0">Docker image  (FROM tomcat)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="145.0">Linux base + Java (comes with tomcat image)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="765" y="193.0">Tomcat  /usr/local/tomcat  :8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="765" y="225.0">webapps/</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="765.0" y="260.0">app.war</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="560" y="345.0">COPY target/app.war /usr/local/tomcat/webapps/</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="385.0">putting the war into webapps = DEPLOYMENT; Tomcat unpacks it and serves it at /&lt;war-name&gt;/</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="410.0">URL: http://&lt;ec2-public-ip&gt;:9090/maven-web-app/   (container 8080 mapped to host 9090)</tspan></text>
</g>
</svg>