<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="480" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="85" width="290" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="215" width="290" height="110" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M175,195 L175,215" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M169.3,203.3 L175,215 L180.7,203.3" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M180.7,206.7 L175,195 L169.3,206.7" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="360" y="85" width="380" height="240" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="770" y="85" width="200" height="70" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="770" y="175" width="200" height="150" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Dockerizing a Python Flask app</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="175.0" y="117.5">Java (Maven)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="134.8">pom.xml lists dependencies</tspan><tspan x="175.0" y="149.8">mvn BUILDS + downloads</tspan><tspan x="175.0" y="164.8">→ target/app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="175.0" y="247.5">Python (pip)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="264.8">requirements.txt lists libraries</tspan><tspan x="175.0" y="279.8">pip only DOWNLOADS</tspan><tspan x="175.0" y="294.8">(no build step — interpreted)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ffd43b" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="115.0">FROM python:3.12-slim</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="143.0">WORKDIR /usr/app/</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="171.0">COPY . /usr/app/</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#74c0fc" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="199.0">RUN pip install \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#74c0fc" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="227.0">    -r requirements.txt</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="255.0">EXPOSE 5000</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="376" y="283.0">ENTRYPOINT [&quot;python&quot;, &quot;app.py&quot;]</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#adb5bd" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="786" y="109.0">requirements.txt</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="786" y="131.0">flask</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="870.0" y="220.0">container</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="870.0" y="236.6">Python + Flask</tspan><tspan x="870.0" y="251.6">installed INSIDE</tspan><tspan x="870.0" y="266.6">the image</tspan><tspan x="870.0" y="281.6">app listens :5000</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="365.0">COPY . copies the whole project folder • RUN pip install runs at BUILD time • -r = read the list from a FILE</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="395.0">docker build -t flask-app .  →  docker run -d -p 5000:5000 flask-app  →  http://&lt;public-ip&gt;:5000/</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e03131" font-weight="normal"><tspan x="500" y="425.0">Flask must listen on 0.0.0.0 (not 127.0.0.1) inside the container, or -p can&#x27;t reach it</tspan></text>
</g>
</svg>