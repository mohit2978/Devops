<rect x="200" y="208" width="250" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="460" y="208" width="250" height="38" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
