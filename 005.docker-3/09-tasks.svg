<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="430" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="75" width="310" height="40" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="125" width="310" height="200" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="345" y="75" width="310" height="40" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="345" y="125" width="310" height="200" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="75" width="310" height="40" rx="8" fill="#96f2d7" stroke="#1e1e1e" stroke-width="2"/>
<rect x="670" y="125" width="310" height="200" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Practice tasks — solutions sketch</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="175.0" y="95.0">Task 1: Jenkins</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="149.0">docker run -d -p 8080:8080 \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="173.0">  --name jenkins \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="197.0">  jenkins/jenkins:lts</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#adb5bd" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="221.0"># admin password:</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="245.0">docker exec jenkins cat \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="269.0">  /var/jenkins_home/secrets/\</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="36" y="293.0">  initialAdminPassword</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="95.0">Task 2: MySQL</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="149.0">docker run -d -p 3306:3306 \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="173.0">  --name mysql \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="197.0">  -e MYSQL_ROOT_PASSWORD=root \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="221.0">  -e MYSQL_DATABASE=shop \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="245.0">  mysql:8.0</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="269.0">docker exec -it mysql \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="361" y="293.0">  mysql -uroot -proot</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="825.0" y="95.0">Task 3: React app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="149.0">FROM node:20 AS build</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="173.0">WORKDIR /app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="197.0">COPY . .</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="221.0">RUN npm ci &amp;&amp; npm run build</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="245.0">FROM nginx:1.27</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="269.0">COPY --from=build /app/build \</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11.5" fill="#69db7c" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="686" y="293.0">  /usr/share/nginx/html</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="365.0">add -v &lt;volume&gt;:&lt;path&gt; to keep Jenkins / MySQL data when the container is removed (Docker volumes, later)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="395.0">React: build with Node, serve the static files with nginx (multi-stage build) → docker run -p 80:80</tspan></text>
</g>
</svg>