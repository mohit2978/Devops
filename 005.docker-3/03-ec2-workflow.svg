<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="100" width="178" height="130" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="216" y="100" width="178" height="130" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M198,165 L216,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M204.3,170.7 L216,165 L204.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="412" y="100" width="178" height="130" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M394,165 L412,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M400.3,170.7 L412,165 L400.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="608" y="100" width="178" height="130" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M590,165 L608,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M596.3,170.7 L608,165 L596.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="804" y="100" width="178" height="130" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M786,165 L804,165" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<path d="M792.3,170.7 L804,165 L792.3,159.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">From Git repo to running container — the same 5 steps for every app</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="109.0" y="157.5">git clone</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="109.0" y="173.5">get the code</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="305.0" y="150.0">mvn clean package</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="305.0" y="166.0">build → target/</tspan><tspan x="305.0" y="181.0">(skip for Python)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="501.0" y="142.5">vi Dockerfile</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="501.0" y="158.5">in the project</tspan><tspan x="501.0" y="173.5">folder (or use the</tspan><tspan x="501.0" y="188.5">repo&#x27;s one)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="697.0" y="157.5">docker build -t name .</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="697.0" y="173.5">create the image</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="893.0" y="150.0">docker run -d -p H:C name</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="893.0" y="166.0">start container,</tspan><tspan x="893.0" y="181.0">open H in the SG</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="280.0">then:  docker ps  →  docker logs &lt;id&gt;  →  http://&lt;public-ip&gt;:&lt;host-port&gt;/</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="320.0">install once on Amazon Linux:  sudo yum install git -y  •  sudo yum install maven -y  (pulls in a Java JDK)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="350.0">a t2.micro (1 GB RAM) fills up fast — remove old containers/images:  docker system prune -a</tspan></text>
</g>
</svg>