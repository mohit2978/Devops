<rect x="20" y="238" width="140" height="44" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="170" y="240" width="197.5" height="40" rx="4" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="367.5" y="240" width="395.0" height="40" rx="4" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="762.5" y="240" width="118.50000000000001" height="40" rx="4" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="881.0" y="240" width="78.99999999999999" height="40" rx="4" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="308" width="140" height="44" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="170" y="310" width="197.5" height="40" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="367.5" y="310" width="158.0" height="40" rx="4" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="525.5" y="310" width="118.49999999999997" height="40" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="644.0" y="310" width="118.50000000000001" height="40" rx="4" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="762.5" y="310" width="118.50000000000001" height="40" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="881.0" y="310" width="78.99999999999999" height="40" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">The 3 probes over a pod&#x27;s life</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="120.0">startupProbe</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="268.75" y="120.0">checking… (others disabled)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="663.75" y="120.0">passed once → done ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="190.0">readinessProbe</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="268.75" y="190.0">off</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="446.5" y="190.0">✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="584.75" y="190.0">✗ DB blip</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="703.25" y="190.0">✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="821.75" y="190.0">✗ timeout</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="920.5" y="190.0"></tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="260.0">livenessProbe</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="268.75" y="260.0">off</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="565.0" y="260.0">✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="821.75" y="260.0">✗ ×3 timeout</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="920.5" y="260.0">restart</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="330.0">gets traffic?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="268.75" y="330.0">no</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="446.5" y="330.0">yes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="584.75" y="330.0">no — removed</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="703.25" y="330.0">yes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="821.75" y="330.0">no — unready</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="920.5" y="330.0">no</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="440.0">startup → /actuator/health/liveness   readiness → /actuator/health/readiness   liveness → /actuator/health/liveness</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="470.0">readiness fails → stop traffic   •   liveness fails → restart   •   startup → protects slow boots</tspan></text>
</g>
<g><animateTransform attributeName="transform" type="translate" values="170 0;960 0" dur="16s" repeatCount="indefinite"/><line x1="0" y1="90" x2="0" y2="355" stroke="#e03131" stroke-width="3" stroke-linecap="round"/></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.25;0.27;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="395.0">starting: startupProbe gives slow Spring Boot up to 70 s — no kills yet</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.45;0.47;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="395.0">ready: readiness ✓ → pod IP added to the Service, traffic flows</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.6;0.62;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="395.0">DB blip: readiness ✗ → pulled OUT of the Service, NOT restarted</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.75;0.77;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="395.0">DB back: readiness ✓ → traffic returns automatically</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.9;0.92;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="395.0">app frozen (threads deadlocked): probes time out, liveness fails 3× …</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.92;0.99;0.999;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="395.0">… kubelet KILLS &amp; restarts the container</tspan></text></g></g>
</svg>