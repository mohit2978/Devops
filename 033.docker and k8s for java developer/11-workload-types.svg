<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="395.0">Deployment → ReplicaSet → Pods  •  StatefulSet uses a headless Service for stable DNS (kafka-0.kafka)</tspan></text>
