<path d="M255,155 L255,195" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M249.3,183.3 L255,195 L260.7,183.3" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M255,243 L255,300" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
