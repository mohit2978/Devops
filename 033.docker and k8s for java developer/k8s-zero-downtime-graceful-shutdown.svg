<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="gShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1020" height="540" rx="16" fill="url(#bgGrace)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 24)">
    <text class="sans" x="510" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">ZERO-DOWNTIME SPRING BOOT DEPLOYMENTS IN KUBERNETES</text>
    <text class="sans" x="510" y="52" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">Pod Termination Lifecycle &amp; "preStop" Sleep Hook</text>
    <text class="sans" x="510" y="74" text-anchor="middle" fill="#94a3b8" font-size="13">Why Plain SIGTERM Causes 502 Bad Gateway &amp; How "preStop: sleep 15" Solves It</text>
  </g>

  <!-- ================= TIMELINE SEQUENCE (4 STAGES) ================= -->

  <!-- STAGE 1: EVENT TRIGGER -->
  <g transform="translate(35, 115)">
    <rect width="215" height="280" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" filter="url(#gShadow)"/>
    <rect x="25" y="-12" width="165" height="24" rx="12" fill="#d97706"/>
    <text class="sans" x="107" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1. DEPLOYMENT ROLLOUT</text>

    <g transform="translate(16, 28)" class="sans" font-size="11">
      <text x="0" y="14" fill="#fbbf24" font-weight="700">Kube-Controller Action:</text>
      <text x="0" y="32" fill="#cbd5e1">• New Pod v2 is created</text>
      <text x="0" y="48" fill="#cbd5e1">• Old Pod v1 marked as</text>
      <text class="mono" x="0" y="66" fill="#ef4444" font-weight="700">Terminating</text>

      <rect x="0" y="80" width="183" height="75" rx="6" fill="#050811" stroke="#1e293b"/>
      <text x="10" y="100" fill="#f87171" font-weight="700">The 502 Hazard:</text>
      <text x="10" y="116" fill="#94a3b8">If app stops immediately,</text>
      <text x="10" y="132" fill="#94a3b8">in-flight calls fail with 502!</text>

      <text x="0" y="180" fill="#94a3b8">Endpoints controller</text>
      <text x="0" y="196" fill="#94a3b8">starts removing Pod IP.</text>
      <circle cx="91" cy="235" r="15" fill="#b45309"/>
      <text class="mono" x="91" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">0s</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 252 255 L 273 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STAGE 2: PRESTOP HOOK -->
  <g transform="translate(275, 115)">
    <rect width="220" height="280" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" filter="url(#gShadow)"/>
    <rect x="25" y="-12" width="170" height="24" rx="12" fill="#0284c7"/>
    <text class="sans" x="110" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2. preStop SLEEP (15s)</text>

    <g transform="translate(16, 28)" class="sans" font-size="11">
      <text x="0" y="14" fill="#38bdf8" font-weight="700">K8s Pod Manifest Hook:</text>
      
      <rect x="0" y="26" width="188" height="50" rx="6" fill="#050811" stroke="#38bdf8"/>
      <text class="mono" x="10" y="46" fill="#38bdf8" font-size="11">preStop: ["sleep","15"]</text>

      <text x="0" y="96" fill="#cbd5e1" font-weight="700">What happens during sleep:</text>
      <text x="0" y="114" fill="#cbd5e1">• Ingress/kube-proxy removes</text>
      <text x="0" y="130" fill="#cbd5e1">  Pod IP from cluster routing</text>
      <text x="0" y="146" fill="#cbd5e1">• NO new traffic is sent here</text>
      <text x="0" y="166" fill="#34d399">• Active requests finish smoothly</text>

      <circle cx="94" cy="235" r="15" fill="#0369a1"/>
      <text class="mono" x="94" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">+15s</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 497 255 L 518 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STAGE 3: SIGTERM & SPRING GRACEFUL -->
  <g transform="translate(520, 115)">
    <rect width="220" height="280" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#gShadow)"/>
    <rect x="25" y="-12" width="170" height="24" rx="12" fill="#047857"/>
    <text class="sans" x="110" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3. SPRING SHUTDOWN</text>

    <g transform="translate(16, 28)" class="sans" font-size="11">
      <text x="0" y="14" fill="#34d399" font-weight="700">Kubelet Sends SIGTERM:</text>
      
      <rect x="0" y="26" width="188" height="50" rx="6" fill="#050811" stroke="#10b981"/>
      <text class="mono" x="10" y="46" fill="#34d399" font-size="10">server.shutdown=graceful</text>

      <text x="0" y="96" fill="#cbd5e1" font-weight="700">Spring Boot Actions:</text>
      <text x="0" y="114" fill="#cbd5e1">• Stops accepting new requests</text>
      <text x="0" y="130" fill="#cbd5e1">• Allows running tasks to finish</text>
      <text x="0" y="146" fill="#cbd5e1">• Closes HikariCP DB pools</text>
      <text x="0" y="166" fill="#34d399">• Flushes disk &amp; log buffers</text>

      <circle cx="94" cy="235" r="15" fill="#065f46"/>
      <text class="mono" x="94" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">+35s</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 742 255 L 763 255" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- STAGE 4: CLEAN POD EXIT -->
  <g transform="translate(765, 115)">
    <rect width="220" height="280" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" filter="url(#gShadow)"/>
    <rect x="25" y="-12" width="170" height="24" rx="12" fill="#7e22ce"/>
    <text class="sans" x="110" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4. ZERO-DOWNTIME EXIT</text>

    <g transform="translate(16, 28)" class="sans" font-size="11">
      <text x="0" y="14" fill="#c084fc" font-weight="700">Clean Process Exit:</text>
      
      <rect x="0" y="26" width="188" height="50" rx="6" fill="#050811" stroke="#a855f7"/>
      <text class="mono" x="10" y="46" fill="#c084fc" font-size="11">Exit Code: 0 (or 143)</text>

      <text x="0" y="96" fill="#cbd5e1" font-weight="700">Results achieved:</text>
      <text x="0" y="114" fill="#34d399">✓ 0 dropped HTTP packets</text>
      <text x="0" y="130" fill="#34d399">✓ 0 interrupted transactions</text>
      <text x="0" y="146" fill="#34d399">✓ 0 client-facing 502 errors</text>
      <text x="0" y="166" fill="#cbd5e1">Pod deleted cleanly from cluster.</text>

      <circle cx="94" cy="235" r="15" fill="#6b21a8"/>
      <text class="mono" x="94" y="240" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">DONE</text>
    </g>
  </g>

  <!-- ================= BOTTOM MANIFEST SNIPPET ================= -->
  <g transform="translate(35, 415)">
    <rect width="950" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <g transform="translate(25, 24)" class="sans" font-size="12">
      <text x="0" y="0" fill="#f8fafc" font-weight="700">PRODUCTION K8S POD SPECIFICATION FORMULA:</text>
      <text class="mono" x="0" y="24" fill="#38bdf8" font-size="11">
        terminationGracePeriodSeconds: 45 <tspan fill="#64748b">|</tspan> lifecycle.preStop.exec.command: ["sleep", "15"]
      </text>
      <text x="0" y="46" fill="#cbd5e1">
        Formula: <tspan fill="#34d399" font-weight="700">terminationGracePeriodSeconds (45s)</tspan> &gt; <tspan fill="#fbbf24">preStop sleep (15s)</tspan> + <tspan fill="#38bdf8">Spring graceful timeout (20s)</tspan>.
      </text>
    </g>
  </g>
</svg>
