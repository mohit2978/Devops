<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="440" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="242" width="300.0" height="44" rx="0" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="340.0" y="242" width="72.0" height="44" rx="0" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M440,90 L440,300" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="40" y="320" width="920" height="90" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">JVM inside a container: which memory does it see?</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold"><tspan x="40" y="92.0">✗ old JVM (Java 8 &lt; u191): sees the 64 GB HOST → default heap = 64/4 = 16 GB</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="40" y="228.0">✓ Java 11/17: reads the cgroup limit (1 GB) + -XX:MaxRAMPercentage=75 → heap ≈ 768 MB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="190.0" y="264.0">heap 768 MB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="376.0" y="264.0">native</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="448" y="300.0">container limit 1 GiB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="348.8">java -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError -jar app.jar</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="366.0">why 75%, not 100%? the JVM also needs native memory: metaspace, thread stacks, JIT code cache, direct buffers</tspan><tspan x="500.0" y="382.2">(UseContainerSupport is ON by default since Java 10 / 8u191)</tspan></text>
</g>
<g ><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="105" width="0" height="44" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"><animate attributeName="width" values="0;920;920;0" keyTimes="0;0.45;0.97;1" dur="10s" repeatCount="indefinite"/></rect></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.17;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="240" y="127.0">heap keeps growing…</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;0.3;1;1;0" keyTimes="0;0.2;0.23;0.27;0.3;0.95;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="480" y="158" width="260" height="38" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="610.0" y="177.0">OOMKilled  (exit 137) ⚡</tspan></text></g></g>
</svg>