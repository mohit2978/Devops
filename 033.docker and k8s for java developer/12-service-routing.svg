<path d="M530,195 L740,275" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M727.0,276.1 L740,275 L731.1,265.5" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">How a Service reaches a pod (ClusterIP + kube-proxy)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="110.0" y="180.0">order-service pod</tspan><tspan x="110.0" y="195.0">calls</tspan><tspan x="110.0" y="210.0">http://payment-service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="410.0" y="165.0">payment-service</tspan><tspan x="410.0" y="180.0">ClusterIP 10.96.0.15</tspan><tspan x="410.0" y="195.0">(a VIRTUAL IP)</tspan><tspan x="410.0" y="210.0"></tspan><tspan x="410.0" y="225.0">kube-proxy: iptables / IPVS</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="855.0" y="115.0">payment pod  10.244.1.5</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="855.0" y="195.0">payment pod  10.244.2.7</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="855.0" y="275.0">payment pod  10.244.3.9</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="335.0">the kernel rewrites the destination IP to one healthy (ready) pod — a different one each time</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="365.0">DNS (CoreDNS): payment-service  =  payment-service.default.svc.cluster.local</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="395.0">headless Service (clusterIP: None) → DNS returns every pod IP instead of one virtual IP</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.03;0.25;0.26;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M200,195 L530,195 L740,115" keyPoints="0;0;1;1" keyTimes="0;0.03;0.25;1" calcMode="linear" dur="9s" repeatCount="indefinite"/><rect x="-22.0" y="-13" width="44" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">req</text></g>
