<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Interview trap: never check the database in the liveness probe</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e03131" font-weight="bold"><tspan x="255" y="98.0">✗ liveness checks the DB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="255" y="311.9">all pods restart at once → restart storm,</tspan><tspan x="255" y="328.1">slow boots, outage gets WORSE</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#2f9e44" font-weight="bold"><tspan x="745" y="98.0">✓ readiness checks the DB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="745" y="311.9">pods leave the Service but keep running;</tspan><tspan x="745" y="328.1">they come back the moment the DB does</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="400.0">liveness = “is THIS JVM healthy?” (no external deps)  •  readiness = “can I serve traffic right now?”</tspan></text>
</g>
