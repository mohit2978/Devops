<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgProbes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="readyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="pShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1020" height="540" rx="16" fill="url(#bgProbes)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 24)">
    <text class="sans" x="510" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">KUBERNETES HEALTH &amp; LIFECYCLE FOR SPRING BOOT</text>
    <text class="sans" x="510" y="52" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">The 3-Probe Health Check Architecture</text>
    <text class="sans" x="510" y="74" text-anchor="middle" fill="#94a3b8" font-size="13">Startup vs Readiness vs Liveness: What Kubelet Does on Failure</text>
  </g>

  <!-- ================= 3 PROBE PILLARS ================= -->

  <!-- 1. STARTUP PROBE -->
  <g transform="translate(35, 115)">
    <rect width="295" height="275" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" filter="url(#pShadow)"/>
    <rect x="35" y="-12" width="225" height="24" rx="12" fill="url(#startGrad)"/>
    <text class="sans" x="147" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1. STARTUP PROBE</text>

    <g transform="translate(20, 25)" class="sans" font-size="12">
      <text x="0" y="16" fill="#fbbf24" font-weight="700">Goal: Protect Slow Bootstrapping</text>
      
      <rect x="0" y="28" width="255" height="120" rx="6" fill="#050811" stroke="#1e293b"/>
      <g transform="translate(12, 42)" class="sans" font-size="11">
        <text x="0" y="12" fill="#cbd5e1">• Endpoint: /actuator/health/liveness</text>
        <text x="0" y="32" fill="#cbd5e1">• Handles heavy Spring startup (30-60s)</text>
        <text x="0" y="52" fill="#cbd5e1">• Disables other probes until it passes</text>
        <line x1="0" y1="62" x2="230" y2="62" stroke="#1e293b"/>
        <text x="0" y="78" fill="#f87171" font-weight="700">If it fails after max retries:</text>
        <text x="0" y="94" fill="#ef4444">Kubelet kills &amp; restarts pod</text>
      </g>

      <g transform="translate(0, 170)">
        <text x="0" y="0" fill="#f8fafc" font-weight="700">K8s Configuration:</text>
        <text class="mono" x="0" y="18" fill="#fbbf24" font-size="11">failureThreshold: 30 (period 2s)</text>
        <text class="sans" x="0" y="36" fill="#94a3b8" font-size="11">Gives app up to 60s to boot!</text>
      </g>
    </g>
  </g>

  <!-- 2. READINESS PROBE -->
  <g transform="translate(365, 115)">
    <rect width="295" height="275" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#pShadow)"/>
    <rect x="35" y="-12" width="225" height="24" rx="12" fill="url(#readyGrad)"/>
    <text class="sans" x="147" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2. READINESS PROBE</text>

    <g transform="translate(20, 25)" class="sans" font-size="12">
      <text x="0" y="16" fill="#34d399" font-weight="700">Goal: Traffic Routing Control</text>
      
      <rect x="0" y="28" width="255" height="120" rx="6" fill="#050811" stroke="#1e293b"/>
      <g transform="translate(12, 42)" class="sans" font-size="11">
        <text x="0" y="12" fill="#cbd5e1">• Endpoint: /actuator/health/readiness</text>
        <text x="0" y="32" fill="#cbd5e1">• Checks DB/Kafka/Cache connections</text>
        <text x="0" y="52" fill="#cbd5e1">• Pod ready to accept traffic?</text>
        <line x1="0" y1="62" x2="230" y2="62" stroke="#1e293b"/>
        <text x="0" y="78" fill="#f59e0b" font-weight="700">If it fails (e.g. DB down):</text>
        <text x="0" y="94" fill="#fbbf24">Removes pod from Service IP (NO kill)</text>
      </g>

      <g transform="translate(0, 170)">
        <text x="0" y="0" fill="#f8fafc" font-weight="700">Crucial Interview Detail:</text>
        <text class="sans" x="0" y="18" fill="#34d399" font-weight="600" font-size="11">DOES NOT restart the container!</text>
        <text class="sans" x="0" y="36" fill="#94a3b8" font-size="11">Temporarily isolates pod from traffic.</text>
      </g>
    </g>
  </g>

  <!-- 3. LIVENESS PROBE -->
  <g transform="translate(695, 115)">
    <rect width="290" height="275" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" filter="url(#pShadow)"/>
    <rect x="35" y="-12" width="220" height="24" rx="12" fill="url(#liveGrad)"/>
    <text class="sans" x="145" y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3. LIVENESS PROBE</text>

    <g transform="translate(20, 25)" class="sans" font-size="12">
      <text x="0" y="16" fill="#38bdf8" font-weight="700">Goal: Deadlock Recovery</text>
      
      <rect x="0" y="28" width="250" height="120" rx="6" fill="#050811" stroke="#1e293b"/>
      <g transform="translate(12, 42)" class="sans" font-size="11">
        <text x="0" y="12" fill="#cbd5e1">• Endpoint: /actuator/health/liveness</text>
        <text x="0" y="32" fill="#cbd5e1">• Checks JVM process responsiveness</text>
        <text x="0" y="52" fill="#cbd5e1">• Catches deadlocks &amp; frozen threads</text>
        <line x1="0" y1="62" x2="225" y2="62" stroke="#1e293b"/>
        <text x="0" y="78" fill="#ef4444" font-weight="700">If it fails (app frozen):</text>
        <text x="0" y="94" fill="#f87171">Kubelet kills &amp; restarts pod</text>
      </g>

      <g transform="translate(0, 170)">
        <text x="0" y="0" fill="#f8fafc" font-weight="700">Golden SDE-2 Rule:</text>
        <text class="sans" x="0" y="18" fill="#f87171" font-size="11" font-weight="600">NEVER check DB in Liveness!</text>
        <text class="sans" x="0" y="36" fill="#94a3b8" font-size="11">If DB blips, all pods restart together!</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM SUMMARY BAR ================= -->
  <g transform="translate(35, 415)">
    <rect width="950" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <g transform="translate(25, 24)" class="sans" font-size="12">
      <text x="0" y="0" fill="#f8fafc" font-weight="700">SPRING BOOT 2.3+ ACTUATOR INTEGRATION:</text>
      <text x="0" y="24" fill="#cbd5e1">
        In <tspan class="mono" fill="#38bdf8">application.properties</tspan>: <tspan class="mono" fill="#34d399">management.endpoint.health.probes.enabled=true</tspan> automatically publishes:
      </text>
      <text x="0" y="46" fill="#e2e8f0">
        • <tspan class="mono" fill="#fbbf24">/actuator/health/liveness</tspan> (Internal JVM state) and <tspan class="mono" fill="#34d399">/actuator/health/readiness</tspan> (Traffic readiness state).
      </text>
    </g>
  </g>
</svg>
