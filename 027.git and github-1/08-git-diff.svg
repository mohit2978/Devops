<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="380" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="60" y="150" width="220" height="80" rx="12" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="390" y="150" width="220" height="80" rx="12" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
<rect x="720" y="150" width="220" height="80" rx="12" fill="#ebfbee" stroke="#1e1e1e" stroke-width="2"/>
<rect x="60" y="310" width="880" height="52" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">git diff  vs  git diff --staged</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">see exactly WHAT changed, not just which files</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="170.0" y="190.0">Working directory</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="190.0">Staging area</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="830.0" y="190.0">Last commit</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="80" y="336.0">-  color: red;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="300" y="336.0">+  color: blue;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="530" y="336.0">← - removed line   + added line</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><path d="M170,140 L170,115 L500,115 L500,140" fill="none" stroke="#1971c2" stroke-width="3"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold"><tspan x="335" y="98.0">git diff  → changes NOT staged yet</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><path d="M500,240 L500,265 L830,265 L830,240" fill="none" stroke="#2f9e44" stroke-width="3"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="665" y="284.0">git diff --staged  → what goes into the next commit</tspan></text></g></g>
</svg>