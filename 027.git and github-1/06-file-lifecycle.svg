<rect x="545" y="82" width="170" height="40" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M880,122 L880,430" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/>
<rect x="795" y="82" width="170" height="40" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
