<path d="M380,270 L630,270" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M618.3,275.7 L630,270 L618.3,264.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M630,325 L880,325" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<path d="M868.3,330.7 L880,325 L868.3,319.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
