<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Distributed VCS — how Git works</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">every PC has its own full repository; one central repository (GitHub) holds the final shared code</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="105.6">central repo</tspan><tspan x="500.0" y="124.4">(GitHub server)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="bold"><tspan x="170" y="555.0">PC #1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="170.0" y="274.2">local repo</tspan><tspan x="170.0" y="291.8">(.git — full history)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="170.0" y="449.2">working copy</tspan><tspan x="170.0" y="466.8">(your files)</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="125" y="370.0">commit</tspan></text>
