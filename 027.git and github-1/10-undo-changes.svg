<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="170" width="250" height="90" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="375" y="170" width="250" height="90" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="710" y="170" width="250" height="90" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M500,170 Q332,85 165,170" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M172.9,159.7 L165,170 L178.0,169.7" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M835,260 Q500,380 165,260" fill="none" stroke="#e03131" stroke-width="2"/>
<path d="M177.9,258.6 L165,260 L174.1,269.3" fill="none" stroke="#e03131" stroke-width="2"/>
<rect x="40" y="405" width="920" height="50" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Undo changes: unstage &amp; discard</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="165.0" y="206.9">Working directory</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="165.0" y="226.0">your edited file</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="206.9">Staging area</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="226.0">after git add</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="835.0" y="206.9">Last commit</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="835.0" y="226.0">safe saved version</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="332" y="72.0">git restore --staged file</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e8590c" font-weight="normal"><tspan x="332" y="96.0">unstage — your edits are KEPT</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="348.0">git checkout -- file   (or git restore file)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="normal"><tspan x="500" y="374.0">discard edits → file goes back to the last commit ⚠</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold"><tspan x="500.0" y="430.0">git checkout -f  → throw away ALL uncommitted changes in every file — dangerous, cannot be undone ⚠</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.06;0.42;0.45;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M500,170 Q332,85 165,170" keyPoints="0;0;1;1" keyTimes="0;0.08;0.35;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-41.5" y="-13" width="83" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">unstage</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.88;0.91;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M835,260 Q500,380 165,260" keyPoints="0;0;1;1" keyTimes="0;0.5;0.8;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-64.0" y="-13" width="128" height="26" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">last version</text></g>
</svg>