<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="320" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Git features</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="295.0">Git was created by Linus Torvalds in 2005 to manage the Linux kernel source code</tspan></text>
</g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.15;1" dur="5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 20;0 20;0 0;0 0" keyTimes="0;0.05;0.15;1" dur="5s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="95" width="180" height="170" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="110.0" y="153.8">Distributed</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="110.0" y="174.2">every developer has</tspan><tspan x="110.0" y="191.7">the FULL repo +</tspan><tspan x="110.0" y="209.2">history = backup</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.17;0.27;1" dur="5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 20;0 20;0 0;0 0" keyTimes="0;0.17;0.27;1" dur="5s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="216" y="95" width="180" height="170" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="306.0" y="153.8">Mostly local</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="306.0" y="174.2">commit, log, diff</tspan><tspan x="306.0" y="191.7">work offline —</tspan><tspan x="306.0" y="209.2">no server needed</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.39;1" dur="5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 20;0 20;0 0;0 0" keyTimes="0;0.29;0.39;1" dur="5s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="412" y="95" width="180" height="170" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="502.0" y="153.8">Branching</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="502.0" y="174.2">non-linear: try</tspan><tspan x="502.0" y="191.7">ideas on branches,</tspan><tspan x="502.0" y="209.2">merge them later</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.41;0.51;1" dur="5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 20;0 20;0 0;0 0" keyTimes="0;0.41;0.51;1" dur="5s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="608" y="95" width="180" height="170" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="698.0" y="153.8">Integrity</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="698.0" y="174.2">every commit has a</tspan><tspan x="698.0" y="191.7">SHA-1 hash → any</tspan><tspan x="698.0" y="209.2">tampering is detected</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.53;0.63;1" dur="5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 20;0 20;0 0;0 0" keyTimes="0;0.53;0.63;1" dur="5s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="804" y="95" width="180" height="170" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="894.0" y="162.5">Speed</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="894.0" y="183.0">local operations</tspan><tspan x="894.0" y="200.5">take milliseconds</tspan></text></g></g>
</svg>