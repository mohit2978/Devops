<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="300" width="920" height="200" rx="12" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Commits = snapshots  →  git log shows the history</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="272.0">each commit points back to its parent (newer → older)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="60" y="325.0">$ git log</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="60" y="355.0">commit 67c833e3…ecb7df62f (HEAD -&gt; master)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="600" y="355.0">← SHA-1 hash = unique id + where HEAD points</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="60" y="383.0">Author: John Doe &lt;john@doe&gt;</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="600" y="383.0">← WHO</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="60" y="411.0">Date:   Sun Jun 14 14:45:07 2020 -0700</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="600" y="411.0">← WHEN</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="60" y="439.0">    Added first story</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="600" y="439.0">← WHAT / WHY (commit message)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#6741d9" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="60" y="478.0">$ git log --oneline   →   67c833e (HEAD -&gt; master) Added first story</tspan></text>
</g>
<g ><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="150" cy="190" rx="34" ry="34" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="150" y="190.0">c1</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="150" y="242.0">“init project”</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.26;0.95;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="370" cy="190" rx="34" ry="34" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><path d="M336,190 L184,190" fill="none" stroke="#495057" stroke-width="2"/><path d="M195.7,184.3 L184,190 L195.7,195.7" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="370" y="190.0">c2</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="370" y="242.0">“add login”</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.48;0.95;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="590" cy="190" rx="34" ry="34" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><path d="M556,190 L404,190" fill="none" stroke="#495057" stroke-width="2"/><path d="M415.7,184.3 L404,190 L415.7,195.7" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="590" y="190.0">c3</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="590" y="242.0">“fix bug”</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.95;1" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="810" cy="190" rx="34" ry="34" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><path d="M776,190 L624,190" fill="none" stroke="#495057" stroke-width="2"/><path d="M635.7,184.3 L624,190 L635.7,195.7" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="810" y="190.0">c4</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="810" y="242.0">“Added first story”</tspan></text></g></g>
<g ><animateTransform attributeName="transform" type="translate" values="150 120;370 120;590 120;810 120" keyTimes="0;0.22;0.44;0.66" calcMode="discrete" dur="9s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="-70" y="-20" width="140" height="34" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><path d="M0,14 L0,50" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M-5.7,38.3 L0,50 L5.7,38.3" fill="none" stroke="#e8590c" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="0.0" y="-3.0">HEAD → master</tspan></text></g></g>
</svg>