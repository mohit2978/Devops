<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Apply F2 as P1 on master</title><desc id="d">The changes from F2 are copied to a new P1 commit after M1 while feature remains unchanged.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="620" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Apply F2 on the current master branch</text><text x="60" y="108" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="21">git switch master  ·  git cherry-pick f2a9c71</text><g stroke="#64748b" stroke-width="5"><path d="M260 360H430M490 360H660M720 360H900"/><path d="M470 320L690 205M750 205H960"/><path d="M960 360H1080" stroke="#f59e0b" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" values="140;140;0;0" keyTimes="0;.3;.62;1" dur="5s" repeatCount="indefinite"/></path></g><g font-family="ui-monospace,Consolas,monospace" font-size="23" text-anchor="middle" fill="#e2e8f0"><rect x="110" y="322" width="150" height="76" rx="16" fill="#1e293b"/><text x="185" y="369">C0</text><rect x="340" y="322" width="150" height="76" rx="16" fill="#134e4a"/><text x="415" y="369">C1</text><rect x="570" y="322" width="150" height="76" rx="16" fill="#075985"/><text x="645" y="369">M1</text><rect x="615" y="167" width="150" height="76" rx="16" fill="#4c1d95"/><text x="690" y="214">F1</text><rect x="900" y="167" width="150" height="76" rx="16" fill="#5b21b6"/><text x="975" y="214">F2</text><g opacity="0"><rect x="1010" y="322" width="150" height="76" rx="16" fill="#78350f" stroke="#fbbf24" stroke-width="4"/><text x="1085" y="369">P1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.65;1" dur="5s" repeatCount="indefinite"/></g></g><g font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><g><rect x="570" y="440" width="150" height="48" rx="14" fill="#0284c7"/><text x="645" y="472" fill="white">master + HEAD</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;440 0;440 0" keyTimes="0;.3;.68;1" dur="5s" repeatCount="indefinite"/></g><rect x="900" y="95" width="150" height="48" rx="14" fill="#7c3aed"/><text x="975" y="127" fill="white">feature</text></g><text x="60" y="560" fill="#fde68a" font-family="Inter,Segoe UI,sans-serif" font-size="20">P1 copies F2's change but has a new parent, M1, so P1 gets a different hash.</text></svg>
