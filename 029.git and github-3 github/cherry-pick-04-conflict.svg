<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Cherry-pick conflict workflow</title><desc id="d">A conflict pauses cherry-pick, then the user can resolve and continue or abort and restore the prior state.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="640" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">If cherry-pick conflicts</text><g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><rect x="70" y="220" width="240" height="105" rx="20" fill="#172554"/><text x="190" y="263" fill="#bae6fd" font-size="21" font-weight="700">1 · CHECK</text><text x="190" y="298" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace" font-size="18">git status</text><rect x="390" y="220" width="240" height="105" rx="20" fill="#451a03"/><text x="510" y="263" fill="#fde68a" font-size="21" font-weight="700">2 · RESOLVE</text><text x="510" y="298" fill="#e2e8f0" font-size="18">edit files + git add</text><rect x="710" y="150" width="420" height="105" rx="20" fill="#064e3b"/><text x="920" y="193" fill="#a7f3d0" font-size="21" font-weight="700">3A · CONTINUE</text><text x="920" y="228" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace" font-size="18">git cherry-pick --continue</text><rect x="710" y="330" width="420" height="105" rx="20" fill="#7f1d1d"/><text x="920" y="373" fill="#fecaca" font-size="21" font-weight="700">3B · CANCEL</text><text x="920" y="408" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace" font-size="18">git cherry-pick --abort</text></g><g fill="none" stroke-width="6"><path d="M310 272H380" stroke="#38bdf8"/><path d="M630 250L700 205" stroke="#10b981"/><path d="M630 295L700 380" stroke="#ef4444"/></g><circle cx="510" cy="272" r="145" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle><text x="60" y="555" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">Continue creates the selected commit after resolution. Abort returns to the exact pre-cherry-pick state.</text></svg>
