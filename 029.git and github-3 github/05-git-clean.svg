<rect x="690" y="120" width="240" height="190" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">git clean — delete UNTRACKED files</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="205" y="108.0">working directory</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="145.0">app.js</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#2f9e44" font-weight="normal"><tspan x="275" y="145.0">tracked</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="175.0" y="229.0">index.html</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#2f9e44" font-weight="normal"><tspan x="275" y="229.0">tracked</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="810" y="140.0">deleted for good ✗</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e03131" font-weight="normal"><tspan x="810" y="295.0">NOT recoverable — no stash, no commit</tspan></text>
</g>
<g><animate attributeName="opacity" values="1;1;0.3;0.3;1" keyTimes="0;0.63;0.69;0.97;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M175,187 L810,170" keyPoints="0;0;1;1" keyTimes="0;0.43;0.63;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-75.0" y="-13" width="150" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">temp.txt</text></g>
<g><animate attributeName="opacity" values="1;1;0.3;0.3;1" keyTimes="0;0.69;0.75;0.97;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M175,271 L810,210" keyPoints="0;0;1;1" keyTimes="0;0.49;0.69;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-75.0" y="-13" width="150" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">debug.log</text></g>
<g><animate attributeName="opacity" values="1;1;0.3;0.3;1" keyTimes="0;0.72;0.78;0.97;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M175,313 L810,250" keyPoints="0;0;1;1" keyTimes="0;0.52;0.72;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-75.0" y="-13" width="150" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">build/</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.35;0.37;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="370.0">git clean -n   → dry run: only LISTS what would be deleted</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.37;0.97;0.99;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="370.0">git clean -f -d   → delete untracked files (-f) and folders (-d)</tspan></text></g></g>
</svg>