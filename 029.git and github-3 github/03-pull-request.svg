<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Pull Request (PR) — ask to merge your branch into main</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="115.0" y="109.2">1. create branch</tspan><tspan x="115.0" y="126.8">patch-1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="310.0" y="109.2">2. commit &amp; push</tspan><tspan x="310.0" y="126.8">the branch</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="109.2">3. open a PR</tspan><tspan x="505.0" y="126.8">main ← patch-1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="700.0" y="109.2">4. review + checks</tspan><tspan x="700.0" y="126.8">comments, CI ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="895.0" y="109.2">5. merge the PR</tspan><tspan x="895.0" y="126.8">→ delete branch</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="120" y="350.0">C1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="260" y="350.0">C2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="832.5" y="263.8">What is a PR?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="832.5" y="282.3">a request to the repo owner:</tspan><tspan x="832.5" y="298.5">“please MERGE my branch”</tspan><tspan x="832.5" y="314.8"></tspan><tspan x="832.5" y="331.0">team discusses, reviews the</tspan><tspan x="832.5" y="347.3">code, CI runs tests — only</tspan><tspan x="832.5" y="363.5">then it lands in main</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="465.0">on GitHub: Pull requests → New → base: main ← compare: patch-1 → Create → Merge pull request</tspan></text>
</g>
