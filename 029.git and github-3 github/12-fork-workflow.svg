</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Forking a repository — contribute to a project you don&#x27;t own</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="bold"><tspan x="500" y="90.0">GitHub.com</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="205.0" y="136.2">original repo (upstream)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="205.0" y="154.1">github.com/owner/project</tspan><tspan x="205.0" y="170.4">you can only READ it</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="795.0" y="136.2">your fork (origin)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="795.0" y="154.1">github.com/YOU/project</tspan><tspan x="795.0" y="170.4">your own copy — you can push</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="401.2">your laptop (local clone)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="419.1">remotes: origin → your fork</tspan><tspan x="500.0" y="435.4">upstream → original repo</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold"><tspan x="500" y="122.0">① Fork (button on GitHub)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6741d9" font-weight="bold"><tspan x="500" y="196.0">⑤ Pull Request: “please merge my branch”</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="668" y="262.0">② git clone</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="735" y="325.0">④ git push origin</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="735" y="345.0">fix-typo</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="250" y="291.2">⑥ git fetch upstream</tspan><tspan x="250" y="308.8">(keep in sync)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="490.0">③ on the laptop:  git switch -c fix-typo  →  edit  →  git commit</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.14;0.16;1" dur="16s" repeatCount="indefinite"/><animateMotion path="M350,135 L650,135" keyPoints="0;0;1;1" keyTimes="0;0.04;0.14;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="-28.0" y="-13" width="56" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">copy</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.32;0.34;1" dur="16s" repeatCount="indefinite"/><animateMotion path="M784,188 L589,358" keyPoints="0;0;1;1" keyTimes="0;0.2;0.32;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="-32.5" y="-13" width="65" height="26" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">clone</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.5;0.52;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="335" y="365" width="330" height="105" rx="14" fill="none" stroke="#e8590c" stroke-width="4"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"></g></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.66;0.68;1" dur="16s" repeatCount="indefinite"/><animateMotion path="M611,382 L806,212" keyPoints="0;0;1;1" keyTimes="0;0.54;0.66;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="-46.0" y="-13" width="92" height="26" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">fix-typo</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.82;0.84;1" dur="16s" repeatCount="indefinite"/><animateMotion path="M650,175 L350,175" keyPoints="0;0;1;1" keyTimes="0;0.7;0.82;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="-37.0" y="-13" width="74" height="26" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">PR #12</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.86;0.97;0.99;1" dur="16s" repeatCount="indefinite"/><animateMotion path="M205,200 L400,370" keyPoints="0;0;1;1" keyTimes="0;0.86;0.97;1" calcMode="linear" dur="16s" repeatCount="indefinite"/><rect x="-59.5" y="-13" width="119" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">new commits</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.18;0.2;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="525.0">① Fork: GitHub copies the repo into YOUR account</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.36;0.38;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="525.0">② git clone https://github.com/YOU/project.git</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.52;0.54;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="525.0">③ create a branch, make changes, commit</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.68;0.7;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="525.0">④ git push origin fix-typo   (to YOUR fork)</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.84;0.86;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="525.0">⑤ open a Pull Request: YOU:fix-typo → owner:main</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.86;0.97;0.99;1" dur="16s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="525.0">⑥ git fetch upstream → get the owner&#x27;s new commits</tspan></text></g></g>
</svg>