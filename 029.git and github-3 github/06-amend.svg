<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="410" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="150" cy="170" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="300" cy="170" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<path d="M274,170 L179,170" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M190.7,164.3 L179,170 L190.7,175.7" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="700" y="110" width="270" height="130" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">git commit --amend — fix the LAST commit</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="150" y="170.0">C1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="300" y="170.0">C2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="835.0" y="137.5">two uses</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="835.0" y="154.8">git commit --amend -m &quot;new msg&quot;</tspan><tspan x="835.0" y="169.8">→ change the message</tspan><tspan x="835.0" y="184.8"></tspan><tspan x="835.0" y="199.8">git add file  →  git commit --amend</tspan><tspan x="835.0" y="214.8">→ change the content</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="392.0">⚠ don&#x27;t amend a commit you already pushed — it rewrites history others may have</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;1;0.2;0.2" keyTimes="0;0.4;0.42;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="450" cy="170" rx="26" ry="26" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><path d="M424,170 L329,170" fill="none" stroke="#495057" stroke-width="2"/><path d="M340.7,164.3 L329,170 L340.7,175.7" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="450" y="170.0">C3</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="450" y="120.0">“fix tpyo”</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="450" cy="280" rx="26" ry="26" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><path d="M429,265 L323,187" fill="none" stroke="#495057" stroke-width="2"/><path d="M335.8,189.4 L323,187 L329.1,198.5" fill="none" stroke="#495057" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="450" y="280.0">C3′</tspan></text><text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="560" y="271.9">“fix typo”</tspan><tspan x="560" y="288.1">+ forgotten file</tspan></text></g></g>
<g ><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.42;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="508.0" y="155" width="76" height="30" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/><path d="M508.0,170 L480.0,170" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M491.7,164.3 L480.0,170 L491.7,175.7" fill="none" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="546.0" y="170.0">main</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="412.0" y="330" width="76" height="30" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/><path d="M450,330 L450,305" fill="none" stroke="#1e1e1e" stroke-width="2"/><path d="M455.7,316.7 L450,305 L444.3,316.7" fill="none" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="450" y="345.0">main</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.4;0.42;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="80.0">last commit has a typo / missed a file</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.97;0.99;1" dur="8s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="80.0">--amend REPLACES C3 with C3′ (new hash)</tspan></text></g></g>
</svg>