<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="380" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Fork vs Clone vs Branch</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="352.0">typical open-source flow: FORK on GitHub → CLONE your fork → create a BRANCH → push → Pull Request</tspan></text>
</g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.15;1" dur="4s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="85" width="300" height="140" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><rect x="30" y="235" width="300" height="85" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="180.0" y="126.9">FORK</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="180.0" y="150.6">a copy of a repo</tspan><tspan x="180.0" y="169.3">on GitHub, under</tspan><tspan x="180.0" y="188.1">YOUR account</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="180.0" y="260.0">where: GitHub (server)</tspan><tspan x="180.0" y="277.5">why: contribute without</tspan><tspan x="180.0" y="295.0">write access</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.30;1" dur="4s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="350" y="85" width="300" height="140" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><rect x="350" y="235" width="300" height="85" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="126.9">CLONE</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="150.6">a copy of a repo</tspan><tspan x="500.0" y="169.3">on your COMPUTER</tspan><tspan x="500.0" y="188.1">(full history)</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="260.0">where: your laptop</tspan><tspan x="500.0" y="277.5">why: work locally,</tspan><tspan x="500.0" y="295.0">commit, run code</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.45;1" dur="4s" fill="freeze"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="670" y="85" width="300" height="140" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><rect x="670" y="235" width="300" height="85" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="820.0" y="136.2">BRANCH</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="159.9">a movable pointer</tspan><tspan x="820.0" y="178.7">INSIDE one repo</tspan></text><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="820.0" y="260.0">where: any repo</tspan><tspan x="820.0" y="277.5">why: separate line of</tspan><tspan x="820.0" y="295.0">work, then merge</tspan></text></g></g>
</svg>