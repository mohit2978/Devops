<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Cherry-pick conflict — what to do</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="130.0" y="171.2">git cherry-pick</tspan><tspan x="130.0" y="188.8">&lt;hash&gt;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1e1e1e" font-weight="bold"><tspan x="355.0" y="180.0">conflict?</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="600.0" y="81.2">no → new commit</tspan><tspan x="600.0" y="98.8">created ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="600.0" y="266.2">yes → Git PAUSES</tspan><tspan x="600.0" y="283.8">(conflict markers)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="867.5" y="266.2">fix the files</tspan><tspan x="867.5" y="283.8">git add &lt;file&gt;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="867.5" y="151.2">git cherry-pick</tspan><tspan x="867.5" y="168.8">--continue ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="415.0" y="367.0">--abort → cancel everything, back to start</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="802.5" y="367.0">--skip → drop this commit (its changes are lost)</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.88;0.9;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M130,180 L355,180 L600,275 L867,275 L867,160" keyPoints="0;0;0.21;0.21;0.55;0.55;0.82;0.82;1;1" keyTimes="0;0.05;0.2;0.25;0.4;0.5;0.65;0.72;0.85;1" calcMode="linear" dur="9s" repeatCount="indefinite"/><rect x="-15.0" y="-13" width="30" height="26" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive" fill="#1e1e1e">●</text></g>
</svg>