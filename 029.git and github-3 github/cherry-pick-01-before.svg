<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="t d"><title id="t">Repository before cherry-pick</title><desc id="d">Master ends at M1 while feature contains F1 and F2 after C1.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="610" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Before cherry-pick</text><text x="60" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">Goal: copy only F2 to master without bringing unfinished F1.</text><g stroke="#64748b" stroke-width="5"><path d="M290 360H510M570 360H790"/><path d="M550 320L760 205M820 205H1010"/></g><g font-family="ui-monospace,Consolas,monospace" font-size="24" text-anchor="middle" fill="#e2e8f0"><rect x="140" y="320" width="150" height="80" rx="17" fill="#1e293b"/><text x="215" y="369">C0</text><rect x="420" y="320" width="150" height="80" rx="17" fill="#134e4a"/><text x="495" y="369">C1</text><rect x="700" y="320" width="150" height="80" rx="17" fill="#075985"/><text x="775" y="369">M1</text><rect x="685" y="165" width="150" height="80" rx="17" fill="#4c1d95"/><text x="760" y="214">F1</text><rect x="950" y="165" width="150" height="80" rx="17" fill="#5b21b6"/><text x="1025" y="214">F2</text></g><g font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><rect x="700" y="430" width="150" height="48" rx="14" fill="#0284c7"/><text x="775" y="462" fill="white">master + HEAD</text><rect x="950" y="95" width="150" height="48" rx="14" fill="#7c3aed"/><text x="1025" y="127" fill="white">feature</text></g><circle cx="1025" cy="205" r="60" fill="none" stroke="#fbbf24" stroke-width="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle></svg>
