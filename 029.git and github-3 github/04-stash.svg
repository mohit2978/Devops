<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="95" width="330" height="230" rx="12" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="630" y="95" width="330" height="230" rx="12" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
<path d="M650,200 L940,200" fill="none" stroke="#495057" stroke-width="1.2" stroke-dasharray="8 6"/>
<path d="M650,240 L940,240" fill="none" stroke="#495057" stroke-width="1.2" stroke-dasharray="8 6"/>
<path d="M650,280 L940,280" fill="none" stroke="#495057" stroke-width="1.2" stroke-dasharray="8 6"/>
<path d="M370,175 L630,175" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M618.3,180.7 L630,175 L618.3,169.3" fill="none" stroke="#e8590c" stroke-width="2"/>
<path d="M630,290 L370,290" fill="none" stroke="#2f9e44" stroke-width="2"/>
<path d="M381.7,284.3 L370,290 L381.7,295.7" fill="none" stroke="#2f9e44" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">git stash — park unfinished work, switch, come back</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="205" y="118.0">working directory</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="795" y="118.0">stash (a stack)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="795" y="305.0">newest entry = stash@{0}</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e8590c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="160.0">git stash</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="310.0">git stash apply</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="420.0">git stash list  •  git stash show -p stash@{0}  •  git stash pop = apply + drop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="448.0">stashes modified tracked + staged files (add -u to include untracked files)</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.32;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6741d9" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="205" y="145.0">on: new_branch</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.48;0.5;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="205" y="145.0">on: master</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.5;0.97;0.99;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#6741d9" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="205" y="145.0">on: new_branch</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.62;0.64;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="205" y="230.0">clean ✓ (no changes)</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.86;0.88;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="655" y="250" width="280" height="34" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="795.0" y="267.0">stash@{0}: WIP on new_branch</tspan></text></g></g>
<g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.26;1" dur="14s" repeatCount="indefinite"/><animateMotion path="M205,200 L795,267" keyPoints="0;0;1;1" keyTimes="0;0.1;0.25;1" calcMode="linear" dur="14s" repeatCount="indefinite"/><rect x="-65.0" y="-13" width="130" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">file1.txt ✎</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.55;0.97;1" dur="14s" repeatCount="indefinite"/><animateMotion path="M795,267 L205,200" keyPoints="0;0;1;1" keyTimes="0;0.55;0.68;1" calcMode="linear" dur="14s" repeatCount="indefinite"/><rect x="-65.0" y="-13" width="130" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">file1.txt ✎</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.1;0.12;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="375.0">file1.txt modified — not ready to commit</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.3;0.32;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="375.0">① git stash  → changes saved, folder clean</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.48;0.5;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="375.0">② git checkout master  … do the urgent work …</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.5;0.55;0.57;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="375.0">③ git checkout new_branch</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.75;0.77;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="375.0">④ git stash apply  → changes are back (entry kept)</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.97;0.99;1" dur="14s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="375.0">⑤ git stash drop stash@{0}  → remove the entry</tspan></text></g></g>
</svg>