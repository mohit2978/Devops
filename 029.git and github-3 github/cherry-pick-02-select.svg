<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="t d"><title id="t">Select F2 from feature</title><desc id="d">Git show inspects F2 while F1 is deliberately excluded.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="610" rx="30" fill="url(#b)"/><text x="60" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700">Select one source commit</text><text x="60" y="108" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="21">git log feature --oneline  ·  git show f2a9c71</text><g font-family="ui-monospace,Consolas,monospace" text-anchor="middle"><rect x="140" y="245" width="270" height="120" rx="22" fill="#4c1d95"/><text x="275" y="295" fill="#e2e8f0" font-size="27">F1</text><text x="275" y="332" fill="#c4b5fd" font-size="18">unfinished redesign</text><rect x="500" y="245" width="270" height="120" rx="22" fill="#5b21b6" stroke="#fbbf24" stroke-width="5"/><text x="635" y="295" fill="#e2e8f0" font-size="27">F2 · f2a9c71</text><text x="635" y="332" fill="#ddd6fe" font-size="18">payment validation fix</text></g><g opacity="0"><rect x="860" y="215" width="280" height="180" rx="24" fill="#172554" stroke="#38bdf8" stroke-width="4"/><text x="1000" y="260" text-anchor="middle" fill="#bae6fd" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">SELECTED PATCH</text><text x="1000" y="307" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace" font-size="21">changes from F2</text><text x="1000" y="345" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="18">F1 is not selected</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.35;.65;1" dur="5s" repeatCount="indefinite"/></g><path d="M780 305H850" stroke="#fbbf24" stroke-width="6" stroke-dasharray="12 9" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" values="80;0;0" dur="5s" repeatCount="indefinite"/></path><text x="60" y="535" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="20">Inspection is read-only: no branch pointer moves during git log or git show.</text></svg>
