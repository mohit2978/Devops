<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="330" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="440" height="180" rx="12" fill="#212529" stroke="#1e1e1e" stroke-width="2"/>
<rect x="520" y="80" width="450" height="180" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Why “No resources found in default namespace”?</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="50" y="105.0">$ kubectl get pod</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#ff8787" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="50" y="135.0">No resources found in default namespace.</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#69db7c" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="50" y="180.0">$ kubectl get pods -n kube-system</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#e9ecef" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="50" y="210.0">coredns-…   aws-node-…   kube-proxy-…</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="745.0" y="129.4">what this means</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="745.0" y="147.9">kubectl looks in the &#x27;default&#x27; namespace unless</tspan><tspan x="745.0" y="164.2">you pass -n &lt;namespace&gt;</tspan><tspan x="745.0" y="180.4"></tspan><tspan x="745.0" y="196.7">a brand-new cluster has nothing there yet —</tspan><tspan x="745.0" y="212.9">system pods live in kube-system</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="300.0">change the default:  kubectl config set-context --current --namespace=backend-ns</tspan></text>
</g>
</svg>