<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">NodePort — open a port on every worker node</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="216.2">user</tspan><tspan x="90.0" y="233.8">browser</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1971c2" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="90" y="290.0">http://13.233.x.x:30080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="645" y="103.0">worker node 1  •  public IP 13.233.10.5  •  port 30080 open</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="410.0" y="156.9">NodePort</tspan><tspan x="410.0" y="173.1">:30080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="640.0" y="165.0">app pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="830.0" y="165.0">app pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="645" y="278.0">worker node 2  •  public IP 3.110.22.8  •  port 30080 open</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="410.0" y="331.9">NodePort</tspan><tspan x="410.0" y="348.1">:30080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="640.0" y="340.0">app pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="830.0" y="340.0">app pod</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e8590c" font-weight="bold"><tspan x="250" y="164.5">ALL requests</tspan><tspan x="250" y="179.5">hit node 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#495057" font-weight="normal"><tspan x="640" y="247.0">kube-proxy can forward to pods on other nodes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="440.0">port range 30000–32767 • users must know a node IP • that node dies → users break • no real load balancer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="465.0">good for testing / demos, not for production traffic</tspan></text>
</g>
</svg>