<rect x="785" y="295" width="165" height="105" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">What eksctl builds for you on AWS</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="140.0" y="105.0">IAM role: eksrole</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="11" fill="#e8590c" font-weight="normal"><tspan x="150" y="148.0">attached to</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="140.0" y="202.5">EKS host VM (t2.micro)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="140.0" y="219.1">1) kubectl  → K8s commands</tspan><tspan x="140.0" y="234.1">2) aws cli  → talk to AWS</tspan><tspan x="140.0" y="249.1">3) eksctl   → create cluster</tspan><tspan x="140.0" y="264.1"></tspan><tspan x="140.0" y="279.1">~/.kube/config ← kubeconfig</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#495057" font-weight="bold"><tspan x="285" y="218.1">eksctl create</tspan><tspan x="285" y="231.9">cluster</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="405.0" y="219.4">CloudFormation</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="405.0" y="235.3">stacks create the</tspan><tspan x="405.0" y="249.1">VPC, subnets, roles,</tspan><tspan x="405.0" y="262.9">control plane, nodes</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="760" y="100.0">control plane — managed by AWS (you can&#x27;t log in)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="660.0" y="147.5">API server</tspan><tspan x="660.0" y="162.5">scheduler, controllers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="865.0" y="155.0">etcd</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="760" y="250.0">managed node group = Auto Scaling Group (min 2, max 2)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="bold"><tspan x="657" y="282.0">ap-south-1a</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="657.5" y="326.9">worker node 1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="657.5" y="342.2">EC2 t2.medium</tspan><tspan x="657.5" y="355.9">kubelet • kube-proxy</tspan><tspan x="657.5" y="369.7">container runtime</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="bold"><tspan x="867" y="282.0">ap-south-1b</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="867.5" y="326.9">worker node 2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="867.5" y="342.2">EC2 t2.medium</tspan><tspan x="867.5" y="355.9">kubelet • kube-proxy</tspan><tspan x="867.5" y="369.7">container runtime</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold"><tspan x="500" y="470.0">billing: control plane (≈ $0.10 / hour) + every worker EC2 instance — a cluster can&#x27;t be stopped, only deleted</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="498.0">eksctl delete cluster --name ashokit-cluster4 --region ap-south-1   ← always run after practice</tspan></text>
</g>
</svg>