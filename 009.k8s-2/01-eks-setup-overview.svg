<path d="M537.8,172.8 L540,160 L528.6,166.2" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M490,255 L540,330" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M528.8,323.4 L540,330 L538.2,317.1" fill="none" stroke="#495057" stroke-width="2"/>
<rect x="540" y="80" width="440" height="130" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="565" y="120" width="190" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="775" y="120" width="180" height="70" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="540" y="230" width="440" height="200" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="560" y="265" width="195" height="150" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<rect x="575" y="295" width="165" height="105" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
