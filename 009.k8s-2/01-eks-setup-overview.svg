<path d="M308.3,245.7 L320,240 L308.3,234.3" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
<rect x="320" y="190" width="170" height="100" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
