<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="515.0" y="201.2">ClusterIP Service</tspan><tspan x="515.0" y="217.5">mysql-svc</tspan><tspan x="515.0" y="233.8">10.100.12.7 (fixed)</tspan></text>
