<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="160" width="210" height="80" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="760" y="160" width="210" height="80" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="470" y="110" width="30" height="180" rx="4" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<path d="M240,200 L760,200" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M748.3,205.7 L760,200 L748.3,194.3" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Can my service reach the database?  nc -zv host port</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="135.0" y="190.6">order-service</tspan><tspan x="135.0" y="209.4">(pod / VM)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="865.0" y="190.6">MySQL</tspan><tspan x="865.0" y="209.4">10.0.1.45 : 3306</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="485" y="95.0">firewall / security group</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="370.0">-z = just test, send no data  •  -v = verbose  •  HTTP APIs: curl -Iv https://service/health  •  DNS: nslookup / dig</tspan></text>
</g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="470" y="110" width="30" height="180" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"></g></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.4;0.41;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M240,200 L745,200" keyPoints="0;0;1;1" keyTimes="0;0.05;0.25;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><rect x="-45.0" y="-13" width="90" height="26" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">TCP 3306</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.55;0.93;0.94;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M240,200 L445,200" keyPoints="0;0;1;1" keyTimes="0;0.55;0.68;1" calcMode="linear" dur="10s" repeatCount="indefinite"/><rect x="-45.0" y="-13" width="90" height="26" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">TCP 3306</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.45;0.47;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="270.0">Connection to mysql-database.internal 3306 port [tcp/mysql] succeeded!</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="270.0">nc: connect to … port 3306 (tcp) timed out</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.45;0.47;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="330.0">$ nc -zv mysql-database.internal 3306   → port open ✓</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.97;0.99;1" dur="10s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="330.0">port blocked → fix the security group / firewall rule, not the code</tspan></text></g></g>
</svg>