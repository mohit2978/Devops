<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="440" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="110" width="220" height="75" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="270" y="110" width="220" height="75" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="510" y="110" width="220" height="75" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<rect x="750" y="110" width="220" height="75" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="40" y="230" width="220" height="100" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="720" y="230" width="240" height="100" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M260,255 L720,255" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M708.3,260.7 L720,255 L708.3,249.3" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<path d="M260,305 L720,305" fill="none" stroke="#e03131" stroke-width="2.5"/>
<path d="M708.3,310.7 L720,305 L708.3,299.3" fill="none" stroke="#e03131" stroke-width="2.5"/>
<rect x="330" y="360" width="340" height="50" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M330,385 L260,330" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M272.7,332.8 L260,330 L265.7,341.7" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">nohup … &gt; order.log 2&gt;&amp;1 &amp;  — run in the background, keep all output</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="19" fill="#1e1e1e" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="85.0">nohup java -jar order-service.jar &gt; order.log 2&gt;&amp;1 &amp;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="140.0" y="132.5">nohup</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="140.0" y="149.8">keep running after</tspan><tspan x="140.0" y="164.8">you log out (SIGHUP)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="380.0" y="132.5">&gt; order.log</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="380.0" y="149.8">stdout (fd 1)</tspan><tspan x="380.0" y="164.8">→ the file</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="620.0" y="132.5">2&gt;&amp;1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="620.0" y="149.8">stderr (fd 2) → same</tspan><tspan x="620.0" y="164.8">place as stdout</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="860.0" y="132.5">&amp;</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="860.0" y="149.8">run in background,</tspan><tspan x="860.0" y="164.8">give the prompt back</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="150.0" y="270.6">java process</tspan><tspan x="150.0" y="289.4">(order-service)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="840.0" y="262.5">order.log</tspan><tspan x="840.0" y="280.0">(one file with</tspan><tspan x="840.0" y="297.5">logs + errors)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="490" y="242.0">fd 1  stdout</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#e03131" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="490" y="325.0">fd 2  stderr  (via 2&gt;&amp;1)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="385.0">SSH session closed → SIGHUP</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="150" y="371.9">ignored thanks</tspan><tspan x="150" y="388.1">to nohup ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="830" y="371.9">tail -f order.log</tspan><tspan x="830" y="388.1">to watch it</tspan></text>
</g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.35;0.36;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M260,255 L705,255" keyPoints="0;0;1;1" keyTimes="0;0.05;0.35;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-30.0" y="-13" width="60" height="26" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">INFO</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.8;0.81;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M260,255 L705,255" keyPoints="0;0;1;1" keyTimes="0;0.5;0.8;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-30.0" y="-13" width="60" height="26" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">INFO</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.55;0.56;1" dur="8s" repeatCount="indefinite"/><animateMotion path="M260,305 L705,305" keyPoints="0;0;1;1" keyTimes="0;0.25;0.55;1" calcMode="linear" dur="8s" repeatCount="indefinite"/><rect x="-35.0" y="-13" width="70" height="26" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">ERROR</text></g>
</svg>