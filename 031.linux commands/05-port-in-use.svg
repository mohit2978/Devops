<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs>
<rect width="1000" height="400" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="150" width="210" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="420" y="140" width="160" height="90" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<path d="M240,185 L420,185" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M408.3,190.7 L420,185 L408.3,179.3" fill="none" stroke="#495057" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">“Port 8080 was already in use” — find it and free it</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="135.0" y="176.2">new app starting</tspan><tspan x="135.0" y="193.8">order-service v2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="172.5">port</tspan><tspan x="500.0" y="197.5">8080</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500" y="375.0">lsof output:  java  18204  appuser  58u  IPv6  TCP *:http-alt (LISTEN)</tspan></text>
</g>
<g ><animate attributeName="opacity" values="1;1;0.15;0.15" keyTimes="0;0.6;0.62;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="760" y="150" width="210" height="70" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><path d="M760,185 L580,185" fill="none" stroke="#e8590c" stroke-width="4"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="865.0" y="175.6">old java</tspan><tspan x="865.0" y="194.4">PID 18204</tspan></text></g></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.03;0.27;0.28;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M240,185 L405,185" keyPoints="0;0;1;1" keyTimes="0;0.03;0.12;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-25.0" y="-13" width="50" height="26" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">bind</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.3;0.32;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#e03131" font-weight="bold"><tspan x="330" y="255.0">✗ Address already in use</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.5;0.52;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><rect x="752" y="142" width="226" height="86" rx="14" fill="none" stroke="#e03131" stroke-width="4"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"></g></g>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.68;0.96;0.97;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M240,185 L500,185" keyPoints="0;0;1;1" keyTimes="0;0.68;0.8;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><rect x="-25.0" y="-13" width="50" height="26" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"></rect><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace" fill="#1e1e1e">bind</text></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"><path d="M240,185 L420,185" fill="none" stroke="#2f9e44" stroke-width="4"/></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="500" y="255.0">✓ Tomcat started on port 8080</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.3;0.32;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="330.0">Spring Boot: Web server failed to start. Port 8080 was already in use.</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.5;0.52;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="330.0">lsof -i :8080    (or ss -tulpn | grep 8080)  →  PID 18204</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.68;0.7;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="330.0">kill -15 18204   → old process stops gracefully</tspan></text></g></g>
<g ><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.97;0.99;1" dur="12s" repeatCount="indefinite"/><g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round"></g><g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive"><text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold" font-family="'Cascadia Code', Consolas, monospace"><tspan x="500.0" y="330.0">start the app again → it gets the port</tspan></text></g></g>
</svg>