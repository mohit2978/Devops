<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Production troubleshooting map — symptom → commands</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="120.0" y="106.2">100% CPU</tspan><tspan x="120.0" y="123.8">slow app</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="338.5" y="106.9">jps -lv</tspan><tspan x="338.5" y="123.1">find PID</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="520.5" y="106.9">top -H -p PID</tspan><tspan x="520.5" y="123.1">hot thread</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="702.5" y="106.9">printf &quot;%x&quot; TID</tspan><tspan x="702.5" y="123.1">→ hex nid</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="884.5" y="106.9">jstack PID</tspan><tspan x="884.5" y="123.1">find the line</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="120.0" y="206.2">Port 8080</tspan><tspan x="120.0" y="223.8">already in use</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="338.5" y="206.9">lsof -i :8080</tspan><tspan x="338.5" y="223.1">who owns it</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="520.5" y="206.9">ss -tulpn</tspan><tspan x="520.5" y="223.1">all listeners</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="702.5" y="206.9">kill -15 PID</tspan><tspan x="702.5" y="223.1">graceful stop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="884.5" y="206.9">restart the</tspan><tspan x="884.5" y="223.1">new app ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="120.0" y="306.2">Java process</tspan><tspan x="120.0" y="323.8">vanished</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="338.5" y="306.9">dmesg -T |</tspan><tspan x="338.5" y="323.1">grep -i oom</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="520.5" y="306.9">free -h</tspan><tspan x="520.5" y="323.1">real memory</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="702.5" y="306.9">journalctl -k</tspan><tspan x="702.5" y="323.1">kernel log</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="884.5" y="306.9">fix -Xmx /</tspan><tspan x="884.5" y="323.1">memory limit ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="120.0" y="415.0">Disk full</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="338.5" y="406.9">df -h</tspan><tspan x="338.5" y="423.1">which disk</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="520.5" y="406.9">du -sh * |</tspan><tspan x="520.5" y="423.1">sort -rh</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="702.5" y="406.9">zgrep old .gz</tspan><tspan x="702.5" y="423.1">logs if needed</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="884.5" y="406.9">rotate / delete</tspan><tspan x="884.5" y="423.1">old logs ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="505.0">each row is covered in detail below</tspan></text>
