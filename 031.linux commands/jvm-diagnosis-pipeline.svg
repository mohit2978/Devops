<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Pillar 1: Process & Threads (Indigo/Cyan) -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.15)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.03)"/>
    </linearGradient>

    <!-- Pillar 2: JVM Diagnostics (Amber/Orange) -->
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.15)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.03)"/>
    </linearGradient>

    <!-- Pillar 3: Network & Ports (Emerald/Green) -->
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.03)"/>
    </linearGradient>

    <!-- Pillar 4: Logs & Storage (Rose/Pink) -->
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.15)"/>
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.03)"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Container -->
  <rect width="1020" height="500" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(0, 24)">
    <text class="sans" x="510" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">ESSENTIAL LINUX TOOLKIT FOR JAVA &amp; DEVOPS ENGINEERS</text>
    <text class="sans" x="510" y="52" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">Full-Stack Linux Diagnostic Ecosystem</text>
    <text class="sans" x="510" y="74" text-anchor="middle" fill="#94a3b8" font-size="13">The 4 Core Pillars Every Java Developer Must Master in Production</text>
  </g>

  <!-- ================= PILLAR 1: PROCESS & THREADS ================= -->
  <g transform="translate(25, 115)">
    <rect width="225" height="340" rx="12" fill="url(#p1Grad)" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)"/>
    <rect x="22" y="-12" width="180" height="26" rx="13" fill="#0ea5e9"/>
    <text class="sans" x="112" y="5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">1. PROCESS &amp; CPU</text>

    <g transform="translate(16, 28)">
      <!-- Item 1 -->
      <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text class="mono" x="12" y="22" fill="#38bdf8" font-size="12" font-weight="700">ps aux | grep java</text>
      <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Find PID, Heap limits, Args</text>

      <!-- Item 2 -->
      <g transform="translate(0, 66)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#38bdf8" font-size="12" font-weight="700">top -H -p &lt;pid&gt;</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Thread-level CPU monitor</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 132)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#38bdf8" font-size="12" font-weight="700">kill -3 &lt;pid&gt;</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Dump Java thread stack</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 198)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#38bdf8" font-size="12" font-weight="700">kill -15 vs -9</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">SIGTERM (graceful) vs -9</text>
      </g>

      <!-- Badge / Footer -->
      <g transform="translate(0, 268)">
        <text class="sans" x="96" y="16" text-anchor="middle" fill="#64748b" font-size="10">Target: High CPU &amp; Freezes</text>
      </g>
    </g>
  </g>

  <!-- ================= PILLAR 2: JVM DIAGNOSTICS ================= -->
  <g transform="translate(275, 115)">
    <rect width="225" height="340" rx="12" fill="url(#p2Grad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)"/>
    <rect x="22" y="-12" width="180" height="26" rx="13" fill="#f59e0b"/>
    <text class="sans" x="112" y="5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">2. JVM PROFILING</text>

    <g transform="translate(16, 28)">
      <!-- Item 1 -->
      <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text class="mono" x="12" y="22" fill="#fbbf24" font-size="12" font-weight="700">jps -lv</text>
      <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">List active JVMs &amp; flags</text>

      <!-- Item 2 -->
      <g transform="translate(0, 66)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#fbbf24" font-size="12" font-weight="700">jstack &lt;pid&gt;</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Capture thread locks</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 132)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#fbbf24" font-size="12" font-weight="700">jstat -gcutil 1s</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Garbage Collection stats</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 198)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#fbbf24" font-size="12" font-weight="700">jmap -dump:live</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Generate Heap Dump (.hprof)</text>
      </g>

      <!-- Footer -->
      <g transform="translate(0, 268)">
        <text class="sans" x="96" y="16" text-anchor="middle" fill="#64748b" font-size="10">Target: Memory Leaks &amp; OOM</text>
      </g>
    </g>
  </g>

  <!-- ================= PILLAR 3: NETWORK & PORTS ================= -->
  <g transform="translate(525, 115)">
    <rect width="225" height="340" rx="12" fill="url(#p3Grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)"/>
    <rect x="22" y="-12" width="180" height="26" rx="13" fill="#10b981"/>
    <text class="sans" x="112" y="5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">3. PORTS &amp; NETWORK</text>

    <g transform="translate(16, 28)">
      <!-- Item 1 -->
      <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text class="mono" x="12" y="22" fill="#34d399" font-size="12" font-weight="700">lsof -i :8080</text>
      <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Find process blocking port</text>

      <!-- Item 2 -->
      <g transform="translate(0, 66)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#34d399" font-size="12" font-weight="700">ss -tulpn</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">All listening TCP sockets</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 132)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#34d399" font-size="12" font-weight="700">curl -Iv &lt;url&gt;</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Inspect HTTP headers &amp; SSL</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 198)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#34d399" font-size="12" font-weight="700">nc -zv &lt;host&gt; 3306</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Test DB / Redis port ping</text>
      </g>

      <!-- Footer -->
      <g transform="translate(0, 268)">
        <text class="sans" x="96" y="16" text-anchor="middle" fill="#64748b" font-size="10">Target: Port Conflicts &amp; Remote API</text>
      </g>
    </g>
  </g>

  <!-- ================= PILLAR 4: LOGS & STORAGE ================= -->
  <g transform="translate(775, 115)">
    <rect width="220" height="340" rx="12" fill="url(#p4Grad)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)"/>
    <rect x="20" y="-12" width="180" height="26" rx="13" fill="#ec4899"/>
    <text class="sans" x="110" y="5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">4. LOGS &amp; STORAGE</text>

    <g transform="translate(14, 28)">
      <!-- Item 1 -->
      <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text class="mono" x="12" y="22" fill="#f472b6" font-size="12" font-weight="700">tail -f | grep -i</text>
      <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Stream filtered live logs</text>

      <!-- Item 2 -->
      <g transform="translate(0, 66)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#f472b6" font-size="12" font-weight="700">zgrep / zless</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Search inside .gz logs</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 132)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#f472b6" font-size="12" font-weight="700">du -sh * | sort -rh</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Find top disk consumers</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 198)">
        <rect width="193" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
        <text class="mono" x="12" y="22" fill="#f472b6" font-size="12" font-weight="700">dmesg -T | grep oom</text>
        <text class="sans" x="12" y="42" fill="#94a3b8" font-size="11">Detect OOM-Killer events</text>
      </g>

      <!-- Footer -->
      <g transform="translate(0, 268)">
        <text class="sans" x="96" y="16" text-anchor="middle" fill="#64748b" font-size="10">Target: Disk Full &amp; Crash Audits</text>
      </g>
    </g>
  </g>
</svg>
