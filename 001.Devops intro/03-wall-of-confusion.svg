<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Dev vs Ops — the Wall of Confusion</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="19" fill="#e03131" font-weight="bold"><tspan x="500" y="85.0">BEFORE DevOps: two separate teams blaming each other</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="190.0" y="132.0">DEV TEAM</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="190.0" y="191.6">“It works on my machine!</tspan><tspan x="190.0" y="210.4">Your deployment is wrong.”</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="810.0" y="132.0">OPS TEAM</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="810.0" y="191.6">“I deployed exactly what</tspan><tspan x="810.0" y="210.4">you gave me. Code is wrong!”</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#e03131" font-weight="bold"><tspan x="500" y="238.0">WALL OF</tspan><tspan x="500" y="258.0">CONFUSION</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="500.0" y="395.0">Real cause: Dev never told Ops “install Java first” → no shared knowledge</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="19" fill="#2f9e44" font-weight="bold"><tspan x="500" y="475.0">AFTER: break the wall  →  DevOps = Dev + Ops working as ONE team</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="normal"><tspan x="500" y="542.0">Dev + Ops = one team</tspan><tspan x="500" y="562.0">shared goals • shared tools • automation (CI/CD)</tspan><tspan x="500" y="582.0">same environment everywhere (Docker)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="500" y="645.0">DevOps is a methodology (a culture + practices) to deliver applications speedily</tspan></text>
</g>
</svg>