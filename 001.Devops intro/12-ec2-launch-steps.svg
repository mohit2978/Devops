<path d="M849.3,243.3 L855,255 L860.7,243.3" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<rect x="750" y="255" width="210" height="115" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
