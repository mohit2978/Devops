<rect x="30" y="270" width="210" height="85" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Launching an EC2 instance — 7 steps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">in AWS a server is called an EC2 (Elastic Compute Cloud) instance • server = just a computer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="135.0" y="135.0">1. Name &amp; Tags</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="135.0" y="154.2">label your server</tspan><tspan x="135.0" y="171.7">e.g. web-server-1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="375.0" y="126.2">2. AMI</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="375.0" y="145.4">OS + software packages</tspan><tspan x="375.0" y="162.9">(Amazon Machine Image)</tspan><tspan x="375.0" y="180.4">pick stable n-1 version</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="615.0" y="126.2">3. Instance type</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="615.0" y="145.4">CPU &amp; RAM</tspan><tspan x="615.0" y="162.9">e.g. t2.micro =</tspan><tspan x="615.0" y="180.4">1 vCPU, 1 GiB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="855.0" y="126.2">4. Key pair</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="855.0" y="145.4">your login</tspan><tspan x="855.0" y="162.9">public key → AWS</tspan><tspan x="855.0" y="180.4">private .pem → you</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="855.0" y="295.0">5. Network</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="855.0" y="314.2">VPC + Security group</tspan><tspan x="855.0" y="331.7">(which ports are open)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="615.0" y="286.2">6. Storage</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="615.0" y="305.4">disk (EBS volume)</tspan><tspan x="615.0" y="322.9">default 8 GiB</tspan><tspan x="615.0" y="340.4">up to 16 TiB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="375.0" y="295.0">7. Summary</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="375.0" y="314.2">review everything</tspan><tspan x="375.0" y="331.7">then click Launch</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="135.0" y="301.2">Instance</tspan><tspan x="135.0" y="323.8">RUNNING ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="500" y="405.0">AMI tip: the newest version may still have bugs → prefer the stable previous (n-1) version</tspan></text>
</g>
</svg>