<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="330" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<path d="M40,150 L960,150" fill="none" stroke="#495057" stroke-width="2"/>
<path d="M948.3,155.7 L960,150 L948.3,144.3" fill="none" stroke="#495057" stroke-width="2"/>
<ellipse cx="150" cy="150" rx="10" ry="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<rect x="40" y="185" width="220" height="110" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="390" cy="150" rx="10" ry="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="280" y="185" width="220" height="110" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="630" cy="150" rx="10" ry="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="520" y="185" width="220" height="110" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<ellipse cx="860" cy="150" rx="10" ry="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="750" y="185" width="220" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">DevOps history</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">“father of DevOps” = Patrick Debois  •  2008 also kicked off the cloud boom (Netflix moves to AWS)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="150" y="120.0">2008</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="150.0" y="213.8">Andrew Clay Shafer &amp;</tspan><tspan x="150.0" y="231.2">Patrick Debois discuss</tspan><tspan x="150.0" y="248.8">“Agile Infrastructure”</tspan><tspan x="150.0" y="266.2">(Agile conf, Toronto)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="390" y="120.0">2009</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="390.0" y="213.8">First DevOpsDays in</tspan><tspan x="390.0" y="231.2">Ghent, Belgium —</tspan><tspan x="390.0" y="248.8">the word “DevOps”</tspan><tspan x="390.0" y="266.2">is born</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="630" y="120.0">2014</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="630.0" y="213.8">annual “State of</tspan><tspan x="630.0" y="231.2">DevOps” report: research</tspan><tspan x="630.0" y="248.8">shows DevOps teams</tspan><tspan x="630.0" y="266.2">ship faster &amp; safer</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="20" fill="#1e1e1e" font-weight="bold"><tspan x="860" y="120.0">today</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="860.0" y="222.5">Docker, Kubernetes,</tspan><tspan x="860.0" y="240.0">CI/CD, cloud —</tspan><tspan x="860.0" y="257.5">standard practice</tspan></text>
</g>
</svg>