<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="95" width="170" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M210,120 Q250,120 250,160" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M244.3,148.3 L250,160 L255.7,148.3" fill="none" stroke="#1971c2" stroke-width="2"/>
<rect x="190" y="160" width="170" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M360,185 Q400,185 400,225" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M394.3,213.3 L400,225 L405.7,213.3" fill="none" stroke="#1971c2" stroke-width="2"/>
<rect x="340" y="225" width="170" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M510,250 Q550,250 550,290" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M544.3,278.3 L550,290 L555.7,278.3" fill="none" stroke="#1971c2" stroke-width="2"/>
<rect x="490" y="290" width="170" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M660,315 Q700,315 700,355" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M694.3,343.3 L700,355 L705.7,343.3" fill="none" stroke="#1971c2" stroke-width="2"/>
<rect x="640" y="355" width="170" height="50" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M486,322 Q415,335 405,282" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M412.7,292.5 L405,282 L401.6,294.6" fill="none" stroke="#e03131" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Waterfall model (before Agile &amp; DevOps)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">sequential: finish one stage completely, then move to the next — like water falling down steps</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="125.0" y="120.0">Requirements</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="275" y="120.0">requirement docs</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="275.0" y="185.0">Design</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="425" y="185.0">software architecture</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="425.0" y="250.0">Implementation</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="575" y="250.0">construct the software</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="575.0" y="315.0">Verification</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="725" y="315.0">install, test &amp; debug</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="725.0" y="380.0">Maintenance</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="725" y="427.0">fix errors, optimize</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="normal"><tspan x="290" y="341.2">✗ bug found in testing?</tspan><tspan x="290" y="358.8">going back is slow &amp; costly</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="250" y="445.0">one stage at a time • client sees the product only at the very end</tspan></text>
</g>
</svg>