<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Network: VPC + Security Group + Key pair</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1e1e1e" font-weight="normal"><tspan x="85.0" y="290.9">my-key.pem</tspan><tspan x="85.0" y="307.1">(private key)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="255" y="245.0">internet</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#1971c2" font-weight="bold"><tspan x="380" y="115.0">VPC (Virtual Private Cloud) — your own private network in AWS, like a VPN</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e03131" font-weight="bold"><tspan x="505" y="145.0">Security Group (firewall)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="208.0">22  SSH  ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="273.0">80  HTTP  ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="338.0">443  HTTPS  ✓</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="505.0" y="403.0">3306 MySQL ✗</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="825.0" y="238.8">EC2 instance</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="825.0" y="259.2">(your server)</tspan><tspan x="825.0" y="276.7"></tspan><tspan x="825.0" y="294.2">stores your PUBLIC key</tspan><tspan x="825.0" y="311.7">port 22 → SSH login</tspan><tspan x="825.0" y="329.2">port 80/443 → website</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="500" y="505.0">Source 0.0.0.0/0 = anyone on the internet   •   “All traffic” opens every port (0–65535) — avoid it, open only what you need</tspan></text>
