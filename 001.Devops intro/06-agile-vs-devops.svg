<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Agile vs DevOps — who reaches the user first?</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="17" fill="#6741d9" font-weight="bold"><tspan x="40" y="95.0">AGILE: develop + test small pieces at the same time (sprints)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="110.0" y="140.6">Sprint 1</tspan><tspan x="110.0" y="159.4">dev ⇄ test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="280.0" y="140.6">Sprint 2</tspan><tspan x="280.0" y="159.4">dev ⇄ test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="450.0" y="140.6">Sprint 3</tspan><tspan x="450.0" y="159.4">dev ⇄ test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="690.0" y="140.6">whole app</tspan><tspan x="690.0" y="159.4">released at the END</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="870" y="212.0">client waits…</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="40" y="220.0">✓ no time gap between dev &amp; testing     ✗ client still gets everything at once (like waterfall)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="17" fill="#2f9e44" font-weight="bold"><tspan x="40" y="282.0">DEVOPS: release every finished piece to the market immediately</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="110.0" y="327.6">Sprint 1</tspan><tspan x="110.0" y="346.4">dev ⇄ test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="110.0" y="422.0">release v1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="280.0" y="327.6">Sprint 2</tspan><tspan x="280.0" y="346.4">dev ⇄ test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="280.0" y="422.0">release v2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="450.0" y="327.6">Sprint 3</tspan><tspan x="450.0" y="346.4">dev ⇄ test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="450.0" y="422.0">release v3</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="635.0" y="337.0">…v4, v5 …</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="normal"><tspan x="870" y="423.9">users get features</tspan><tspan x="870" y="440.1">early &amp; continuously</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="960" y="512.0">time</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="330" y="512.0">the market (end users)</tspan></text>
