<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Software architectures: 1-tier → N-tier</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="500.0" y="66.0">P = presentation (UI)   L = logic   D = data (DB)</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="40" y="118.0">1-TIER  •  standalone app</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="40" y="368.0">e.g. VLC media player — your videos are the “DB”</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="255" y="160.0">your laptop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="195.0">P  presentation</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="237.0">L  logic</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="255.0" y="279.0">D  data</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="normal"><tspan x="255" y="342.0">everything local • no internet needed</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="530" y="118.0">2-TIER  •  client–server</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="530" y="368.0">e.g. desktop banking app, JioSaavn (needs internet)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="615" y="170.0">your laptop</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="615.0" y="207.0">P  presentation</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="615.0" y="252.0">L  logic</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="normal"><tspan x="750.0" y="213.0">internet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#495057" font-weight="normal"><tspan x="880" y="190.0">server</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="880.0" y="232.0">D  data</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="normal"><tspan x="745" y="335.0">UI + logic on laptop, DB on a remote server</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="40" y="438.0">3-TIER  •  web application</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="40" y="688.0">e.g. WhatsApp Web, YouTube, Instagram</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="95.0" y="532.5">laptop</tspan><tspan x="95.0" y="550.0">(browser</tspan><tspan x="95.0" y="567.5">only)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="normal"><tspan x="182.5" y="538.0">internet</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="normal"><tspan x="342" y="478.0">cloud</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="342.0" y="513.0">Web server (P)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="342.0" y="561.0">App server (L)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="342.0" y="609.0">DB server (D)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="normal"><tspan x="255" y="665.0">nothing installed locally — use it all from the internet</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="18" fill="#1e1e1e" font-weight="bold"><tspan x="530" y="438.0">N-TIER  •  microservices</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="530" y="688.0">e.g. Paytm: one app = a collection of services</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="577.5" y="541.2">browser /</tspan><tspan x="577.5" y="558.8">mobile</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="707.5" y="541.2">API</tspan><tspan x="707.5" y="558.8">gateway</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="880.0" y="479.0">recharge service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="880.0" y="525.0">DTH service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="880.0" y="571.0">scanner service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1e1e1e" font-weight="normal"><tspan x="880.0" y="617.0">payment service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="normal"><tspan x="745" y="665.0">each service: own code, own DB, deployed independently</tspan></text>
</g>
</svg>