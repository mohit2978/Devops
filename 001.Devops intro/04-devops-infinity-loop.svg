<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="900" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<path d="M450,250 C350,120 150,120 150,250 C150,380 350,380 450,250" fill="none" stroke="#4dabf7" stroke-width="30"/>
<path d="M450,250 C550,120 750,120 750,250 C750,380 550,380 450,250" fill="none" stroke="#69db7c" stroke-width="30"/>
<path d="M272,145 L262,152.5 L272,160" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M252,340 L262,347.5 L252,355" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M628,145 L638,152.5 L628,160" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M648,340 L638,347.5 L648,355" fill="none" stroke="#ffffff" stroke-width="3"/>
<rect x="412" y="237" width="76" height="26" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="450.0" y="38.0">DevOps lifecycle — an infinite loop  ∞</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#495057" font-weight="normal"><tspan x="450.0" y="66.0">never-ending, continuous process: what you learn while monitoring feeds the next plan</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="450" y="250.0">release</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="36" fill="#1971c2" font-weight="bold"><tspan x="290" y="250.0">Dev</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="36" fill="#2f9e44" font-weight="bold"><tspan x="610" y="250.0">Ops</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1971c2" font-weight="bold"><tspan x="388" y="148.0">plan</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1971c2" font-weight="bold"><tspan x="262" y="115.0">code</tspan></text>
<text xml:space="preserve" text-anchor="end" dominant-baseline="middle" font-size="17" fill="#1971c2" font-weight="bold"><tspan x="125" y="250.0">build</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#1971c2" font-weight="bold"><tspan x="262" y="390.0">test</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#2f9e44" font-weight="bold"><tspan x="638" y="115.0">deploy</tspan></text>
<text xml:space="preserve" text-anchor="start" dominant-baseline="middle" font-size="17" fill="#2f9e44" font-weight="bold"><tspan x="775" y="250.0">operate</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#2f9e44" font-weight="bold"><tspan x="638" y="390.0">monitor</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="normal"><tspan x="450" y="425.0">plan → code → build → test → RELEASE → deploy → operate → monitor → plan → …</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="normal"><tspan x="450" y="450.0">“release” is the extra stage vs SDLC: many versions of the app exist, each one must be maintained</tspan></text>
</g>
</svg>