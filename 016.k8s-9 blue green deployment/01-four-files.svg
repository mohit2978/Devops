<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="370" height="120" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="30" y="280" width="370" height="120" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="80" width="370" height="120" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<rect x="600" y="280" width="370" height="120" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<path d="M600,140 L400,140" fill="none" stroke="#1971c2" stroke-width="3"/>
<path d="M411.7,134.3 L400,140 L411.7,145.7" fill="none" stroke="#1971c2" stroke-width="3"/>
<path d="M600,340 L400,340" fill="none" stroke="#2f9e44" stroke-width="3"/>
<path d="M411.7,334.3 L400,340 L411.7,345.7" fill="none" stroke="#2f9e44" stroke-width="3"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">The 4 YAML files and how they connect</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="215.0" y="117.5">1. blue deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="215.0" y="135.4">javawebappbluedeployment</tspan><tspan x="215.0" y="150.4">2 pods • image ashokit/javawebapp</tspan><tspan x="215.0" y="165.4">labels: version v1, color blue</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="215.0" y="317.5">3. green deployment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="215.0" y="335.4">javawebappgreendeployment</tspan><tspan x="215.0" y="350.4">2 pods • image ashokit/javawebapp:v2</tspan><tspan x="215.0" y="365.4">labels: version v2, color green</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="785.0" y="117.5">2. live service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="135.4">javawebappliveservice</tspan><tspan x="785.0" y="150.4">type LoadBalancer • port 80</tspan><tspan x="785.0" y="165.4">selector: version: v1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1e1e1e" font-weight="bold"><tspan x="785.0" y="317.5">4. pre-prod service</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="785.0" y="335.4">javawebpreprodservice</tspan><tspan x="785.0" y="350.4">type NodePort 31785</tspan><tspan x="785.0" y="365.4">selector: version: v2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1971c2" font-weight="bold"><tspan x="500" y="125.0">selects v1</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#2f9e44" font-weight="bold"><tspan x="500" y="325.0">selects v2</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="785" y="225.0">customers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#495057" font-weight="bold"><tspan x="785" y="425.0">testers</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="500" y="455.0">apply order: blue deployment → live service → green deployment → pre-prod service → (switch) live service v2</tspan></text>
</g>
</svg>