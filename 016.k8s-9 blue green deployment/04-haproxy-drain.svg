<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="110" width="140" height="60" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="20" y="290" width="140" height="60" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<rect x="250" y="170" width="220" height="120" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<path d="M160,140 L250,200" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M237.1,198.2 L250,200 L243.4,188.8" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M160,320 L250,260" fill="none" stroke="#2f9e44" stroke-width="2"/>
<path d="M243.4,271.2 L250,260 L237.1,261.8" fill="none" stroke="#2f9e44" stroke-width="2"/>
<rect x="560" y="75" width="410" height="150" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<rect x="585" y="120" width="360" height="40" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="585" y="170" width="360" height="40" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<rect x="560" y="255" width="410" height="120" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<rect x="585" y="300" width="360" height="50" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<path d="M470,200 L560,150" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M552.5,160.6 L560,150 L547.0,150.7" fill="none" stroke="#1971c2" stroke-width="2"/>
<path d="M470,260 L560,315" fill="none" stroke="#2f9e44" stroke-width="3"/>
<path d="M547.1,313.7 L560,315 L553.0,304.1" fill="none" stroke="#2f9e44" stroke-width="3"/>
</g>
<g font-family="Virgil, Excalifont, 'Comic Sans MS', 'Segoe Print', cursive">
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="26" fill="#1e1e1e" font-weight="bold"><tspan x="500.0" y="38.0">Switching without dropping anyone: draining &amp; sticky sessions (HAProxy)</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="132.5">user A</tspan><tspan x="90.0" y="147.5">mid-payment</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="90.0" y="312.5">user B</tspan><tspan x="90.0" y="327.5">new visitor</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="360.0" y="207.5">HAProxy / LB</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="360.0" y="224.8">blue servers: DRAIN mode</tspan><tspan x="360.0" y="239.8">green servers: active</tspan><tspan x="360.0" y="254.8">sticky sessions on</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="765" y="97.0">BLUE (v1) — draining</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="140.0">keeps serving EXISTING sessions / connections</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="190.0">receives NO new connections</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2f9e44" font-weight="bold"><tspan x="765" y="277.0">GREEN (v2) — active</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1e1e1e" font-weight="normal"><tspan x="765.0" y="325.0">all NEW users / transactions</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1971c2" font-weight="bold"><tspan x="515" y="160.0">A</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#2f9e44" font-weight="bold"><tspan x="515" y="300.0">B</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1971c2" font-weight="bold"><tspan x="500" y="410.0">active transaction stays on blue until done • new ones go to green • then blue is removed</tspan></text>
<text xml:space="preserve" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#495057" font-weight="normal"><tspan x="500" y="440.0">same idea in K8s: switch the selector, keep blue pods running until connections finish, graceful shutdown on SIGTERM</tspan></text>
</g>
</svg>